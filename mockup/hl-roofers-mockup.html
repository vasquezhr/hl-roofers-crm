       1. Bootstrap 5.3.8 CSS   embedded copy, do not edit

       3. Page shell            top bar, navigation, pop-up, message
       4. Bootstrap 5.3.8 JS    embedded copy, do not edit
       5. Mockup script         words (English/Spanish), sample data, screens
     ===================================================================== -->

<style id="hl-css">
/* =====================================================================
   The app's styles. Everything else on the page is plain Bootstrap.
   Part 1 swaps Bootstrap's blue for the business's colors.
   Part 2 is the handful of pieces Bootstrap does not have.
   ===================================================================== */

/* ---------- 1. The business's colors ----------
   These are H & L's, with every shade picked by hand. Admin > Colors and icon
   puts another business's shades in their place, worked out by the script. */
:root {
  --hl-bar: #1f3a5f;                    /* top bar */
  --hl-amp: #f0b07f;                    /* the "&" in the name on the top bar */
  --hl-accent: #b05a22;                 /* buttons and highlights */
  --hl-accent-rgb: 176, 90, 34;
  --hl-accent-hover: #974d1d;
  --hl-accent-active: #8d481b;
  --hl-accent-active-border: #844319;
  --hl-accent-text: #6f3713;
  --hl-accent-subtle: #f6e3d4;
  --hl-accent-border: #e7bf9f;
  --hl-accent-focus: #d9a57f;
  --hl-accent-dark: #e08a4c;            /* the same, on the dark theme */
  --hl-accent-dark-rgb: 224, 138, 76;
  --hl-accent-dark-text: #f0b07f;
  --hl-accent-dark-subtle: #3a2a1f;
  --hl-accent-dark-border: #7a4a25;
  --hl-chart-dark: #cf7a40;             /* chart bars on the dark theme; checked for contrast */
}
[data-bs-theme=light] {
  --hl-chart: var(--hl-accent);
  --bs-primary: var(--hl-accent);
  --bs-primary-rgb: var(--hl-accent-rgb);
  --bs-primary-text-emphasis: var(--hl-accent-text);
  --bs-primary-bg-subtle: var(--hl-accent-subtle);
  --bs-primary-border-subtle: var(--hl-accent-border);
  --bs-link-color: #24507f;
  --bs-link-color-rgb: 36, 80, 127;
  --bs-link-hover-color: #1a3a5c;
  --bs-link-hover-color-rgb: 26, 58, 92;
  --bs-body-bg: #f4f1ec;              /* warm paper background */
  --bs-body-bg-rgb: 244, 241, 236;
  --bs-focus-ring-color: rgba(var(--hl-accent-rgb), .25);
}
[data-bs-theme=dark] {
  --hl-chart: var(--hl-chart-dark);
  --bs-primary: var(--hl-accent-dark);
  --bs-primary-rgb: var(--hl-accent-dark-rgb);
  --bs-primary-text-emphasis: var(--hl-accent-dark-text);
  --bs-primary-bg-subtle: var(--hl-accent-dark-subtle);
  --bs-primary-border-subtle: var(--hl-accent-dark-border);
  --bs-link-color: #86b2ea;
  --bs-link-color-rgb: 134, 178, 234;
  --bs-link-hover-color: #a9c8f0;
  --bs-link-hover-color-rgb: 169, 200, 240;
  --bs-focus-ring-color: rgba(var(--hl-accent-dark-rgb), .3);
}
/* white cards and lists on the warm background (light theme only) */
[data-bs-theme=light] .card { --bs-card-bg: #fff; }
[data-bs-theme=light] .list-group { --bs-list-group-bg: #fff; }
[data-bs-theme=dark] .card { --bs-card-bg: var(--bs-tertiary-bg); }
.table { --bs-table-bg: transparent; }
/* Bootstrap components that hard-code its blue */
.btn-primary {
  --bs-btn-color: #fff; --bs-btn-bg: var(--hl-accent); --bs-btn-border-color: var(--hl-accent);
  --bs-btn-hover-color: #fff; --bs-btn-hover-bg: var(--hl-accent-hover); --bs-btn-hover-border-color: var(--hl-accent-active);
  --bs-btn-active-color: #fff; --bs-btn-active-bg: var(--hl-accent-active); --bs-btn-active-border-color: var(--hl-accent-active-border);
  --bs-btn-disabled-color: #fff; --bs-btn-disabled-bg: var(--hl-accent); --bs-btn-disabled-border-color: var(--hl-accent);
  --bs-btn-focus-shadow-rgb: var(--hl-accent-rgb);
}
.btn-outline-primary {
  --bs-btn-color: var(--bs-primary); --bs-btn-border-color: var(--bs-primary);
  --bs-btn-hover-color: #fff; --bs-btn-hover-bg: var(--hl-accent); --bs-btn-hover-border-color: var(--hl-accent);
  --bs-btn-active-color: #fff; --bs-btn-active-bg: var(--hl-accent); --bs-btn-active-border-color: var(--hl-accent);
  --bs-btn-disabled-color: var(--bs-primary); --bs-btn-disabled-border-color: var(--bs-primary);
  --bs-btn-focus-shadow-rgb: var(--hl-accent-rgb);
}
.nav-pills { --bs-nav-pills-link-active-bg: var(--hl-accent); }
.hl-side .nav, .hl-tabbar .nav { --bs-nav-link-color: var(--bs-body-color); --bs-nav-link-hover-color: var(--bs-primary); }
.list-group { --bs-list-group-active-bg: var(--hl-accent); --bs-list-group-active-border-color: var(--hl-accent); }
.dropdown-menu { --bs-dropdown-link-active-bg: var(--hl-accent); }
.progress { --bs-progress-bar-bg: var(--hl-chart); }
.form-check-input:checked { background-color: var(--hl-accent); border-color: var(--hl-accent); }
.form-control:focus, .form-select:focus, .form-check-input:focus {
  border-color: var(--hl-accent-focus); box-shadow: 0 0 0 .25rem rgba(var(--hl-accent-rgb), .25);
}

/* ---------- 2. Pieces Bootstrap does not have ---------- */
/* brand bar */
.hl-topbar { background: var(--hl-bar); }
.hl-amp { color: var(--hl-amp); }
.hl-tag { font-size: .62rem; letter-spacing: .04em; }
/* page frame */
.hl-side { width: 220px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.hl-main { max-width: 1000px; padding-bottom: 5.5rem; }    /* leaves room for the phone tab bar */
@media (min-width: 992px) { .hl-main { padding-bottom: 2rem; } }
.hl-minw0 { min-width: 0; }
/* phone tab bar */
.hl-tabbar { padding-bottom: env(safe-area-inset-bottom); }
.hl-tabbar .nav-link { font-size: .7rem; font-weight: 600; color: var(--bs-secondary-color); }
.hl-tabbar .nav-link.active { color: var(--bs-primary); }
/* icons */
.hl-ic { width: 1.15em; height: 1.15em; flex: none; vertical-align: -.2em; }
.hl-tabbar .hl-ic, .hl-side .hl-ic { width: 1.35rem; height: 1.35rem; }
/* a section of a record page, folded away with the arrow before its title */
.hl-fold { color: var(--bs-secondary-color); vertical-align: baseline; }
.hl-fold .hl-ic { transition: transform .15s; }
.hl-fold[aria-expanded=false] .hl-ic { transform: rotate(-90deg); }
.hl-folded > :first-child { margin-bottom: 0 !important; }
.card-body.hl-folded { padding-top: .5rem; padding-bottom: .5rem; }       /* a folded card is only as tall as its title */
.card-body.hl-folded > :first-child { line-height: 1.5rem; }
.card-body { position: relative; }
/* the Edit and Change stage buttons in a record's header: small, level with the stage badge */
.hl-edit { --bs-btn-padding-y: .1rem; --bs-btn-padding-x: .45rem; --bs-btn-font-size: .75rem; line-height: 1.4; align-self: center; }
/* the arrow at the top left of a record page */
.hl-back { color: var(--bs-secondary-color); }
.hl-back:hover, .hl-back:focus-visible { color: var(--bs-primary); }
/* the pencil at the top right of a section: on hover on a computer, always showing on a touch screen */
.hl-pencil { position: absolute; top: .55rem; right: .75rem; padding: .15rem; line-height: 1; color: var(--bs-secondary-color); }
.hl-pencil:hover, .hl-pencil:focus-visible { color: var(--bs-primary); }
@media (hover: hover) { .hl-pencil { opacity: 0; transition: opacity .15s; } .card-body:hover .hl-pencil, .hl-pencil:focus-visible { opacity: 1; } }
/* the side menu folded to icons only */
.hl-side-toggle { color: var(--bs-secondary-color); }
.hl-side-toggle:hover { color: var(--bs-primary); }
.hl-side-icons .hl-side { width: 4.25rem; }
.hl-side-icons .hl-side .nav-link { justify-content: center; padding-left: .5rem; padding-right: .5rem; }
.hl-side-icons .hl-side .nav-link span { display: none; }
.hl-side-icons .hl-side .hl-side-toggle { align-self: center !important; }
/* notes keep their line breaks */
.hl-pre { white-space: pre-wrap; }
/* chart columns: the bar lightens when it is pointed at or focused */
.hl-mark { fill: var(--hl-chart); pointer-events: none; }
.hl-hit { fill: transparent; outline: none; }
.hl-hit:hover + .hl-mark, .hl-hit:focus + .hl-mark { opacity: .7; }
/* stage bar: one step per stage, from Inspection to Paid */
.hl-stage { display: flex; flex-wrap: wrap; gap: .25rem; }
.hl-stage > div { flex: 1 1 4.4rem; min-width: 0; text-align: center; font-size: .68rem; font-weight: 700; color: var(--bs-secondary-color); overflow-wrap: anywhere; }
/* on a phone the steps wrap onto a second row (four to a row), so the bar fits the screen with no scroll bar */
@media (max-width: 575.98px) { .hl-stage > div { flex: 1 0 calc(25% - .25rem); } }
.hl-stage > div::before { content: ""; display: block; height: .4rem; border-radius: 1rem; background: var(--bs-border-color); margin-bottom: .3rem; }
.hl-stage > .done::before { background: var(--bs-success); }
.hl-stage > .cur::before { background: var(--bs-primary); }
.hl-stage > .cur { color: var(--bs-primary); }
</style>
</head>
<body>

<div class="d-flex min-vh-100">
  <!-- side navigation (computers) -->
  <aside class="d-none d-lg-flex flex-column flex-shrink-0 bg-body-tertiary border-end p-3 hl-side">
    <button type="button" class="btn btn-link p-0 mb-2 hl-side-toggle align-self-start" data-act="sideToggle" id="sideToggle" aria-expanded="true"></button>
    <ul class="nav nav-pills flex-column gap-1" id="sideNav"></ul>
  </aside>

  <div class="flex-grow-1 d-flex flex-column hl-minw0">
    <!-- top bar -->
    <header class="navbar sticky-top shadow-sm px-3 py-2 hl-topbar" data-bs-theme="dark">
      <a class="navbar-brand d-flex flex-column lh-1 m-0 p-0" href="#" data-act="goHome">
        <span class="fw-bolder" id="brandName">H <span class="hl-amp">&amp;</span> L ROOFERS</span>
        <small class="opacity-75 hl-tag" id="brandTag">HONEST &amp; LOYAL · VIRGINIA</small>
      </a>
      <div class="d-flex align-items-center gap-2 ms-auto">
        <div class="btn-group btn-group-sm" role="group" aria-label="Language / Idioma">
          <button type="button" class="btn btn-outline-light" data-act="setLang" data-lang="en">EN</button>
          <button type="button" class="btn btn-outline-light" data-act="setLang" data-lang="es">ES</button>
        </div>
        <div class="dropdown">
          <button class="btn btn-sm btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" id="roleBtn"></button>
          <ul class="dropdown-menu dropdown-menu-end" id="roleMenu" data-bs-theme="light"></ul>
        </div>
      </div>
    </header>

    <!-- the current screen -->
    <main class="container-fluid py-3 px-3 px-lg-4 hl-main" id="view"></main>
  </div>
</div>

<!-- bottom tab bar (phones) -->
<nav class="d-lg-none fixed-bottom bg-body border-top hl-tabbar">
  <ul class="nav nav-justified" id="tabNav"></ul>
</nav>

<!-- "More" menu (phones) -->
<div class="offcanvas offcanvas-bottom h-auto" tabindex="-1" id="moreNav" aria-labelledby="moreTitle">
  <div class="offcanvas-header pb-0">
    <h2 class="offcanvas-title h6" id="moreTitle"></h2>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <div class="list-group" id="moreList"></div>
  </div>
</div>

<!-- pop-up window, filled in by the script -->
<div class="modal fade" id="modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered" id="modalDialog">
    <div class="modal-content" id="modalContent"></div>
  </div>
</div>

<!-- short confirmation message -->
<div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3 mb-5 mb-lg-0">
  <div class="toast text-bg-dark border-0" role="status" aria-live="polite" aria-atomic="true" id="toast">
    <div class="toast-body text-center fw-semibold"></div>
  </div>
</div>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pick = (obj, key) => key.split(".").reduce((o, p) => (o == null ? o : o[p]), obj);

/* t(key, {n: 3}) returns the text for that key in the current language */
function t(key, vars) {
  let v = pick(I18N[S.lang], key);
  if (v == null) v = pick(I18N.en, key);
  if (v == null) { console.warn("missing text: " + key); return key; }
  return vars ? String(v).replace(/\{(\w+)\}/g, (m, k) => (vars[k] ?? m)) : v;
}
const tt = (key, vars) => esc(t(key, vars));      // the same text, made safe to place inside HTML

/* ---------- dates ---------- */
// No Saturday work. Sunday is not decided yet, so both days are shown as off for now.
const isOff = d => d.getDay() === 0 || d.getDay() === 6;
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); while (isOff(d)) d.setDate(d.getDate() + 1); return d; })();
function wd(n) {                       // n working days from today (negative = in the past)
  const d = new Date(TODAY), step = n < 0 ? -1 : 1;
  for (let k = Math.abs(n); k > 0;) { d.setDate(d.getDate() + step); if (!isOff(d)) k--; }
  return d;
}
function ago(n) { const d = new Date(TODAY); d.setDate(d.getDate() - n); return d; }   // n calendar days ago
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const sameDay = (a, b) => iso(a) === iso(b);
const loc = () => (S.lang === "es" ? "es-US" : "en-US");
const fmtDay = d => d.toLocaleDateString(loc(), { weekday: "short", month: "short", day: "numeric" });
const fmtDate = d => d.toLocaleDateString(loc(), { month: "short", day: "numeric", year: "numeric" });
const fmtTime = s => { if (!s) return ""; const [h, m] = s.split(":").map(Number); return ((h + 11) % 12 + 1) + ":" + String(m).padStart(2, "0") + (h < 12 ? " am" : " pm"); };
const fmtClock = d => fmtTime(String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"));
const fmtStamp = d => fmtDay(d) + ", " + fmtClock(d);                 // the date and time of a history line: Wed, Nov 11, 2:35 pm
const money = n => "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
function daysSince(d) { return Math.round((TODAY - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000); }
function miles(a, b) {                 // straight-line miles with a rough road factor
  const R = 3958.8, r = x => x * Math.PI / 180, dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h)) * 1.25;
}

function addLog(rec, key, vars) { (rec.log = rec.log || []).unshift({ d: new Date(), w: me(), k: key, v: vars }); }
function historyList(rec) {
  const log = (rec.log || []).slice().sort((a, b) => b.d - a.d);      // newest first
  if (!log.length) return `<div class="text-body-secondary small">${esc(t("noHistory"))}</div>`;
  const first = log[log.length - 1], last = log[0];
  return `<div class="small text-body-secondary mb-2">${tt("hist.created")}: ${esc(fmtStamp(first.d))} · ${esc(whoName(first.w))}` +
    (last !== first ? `<br>${tt("hist.changed")}: ${esc(fmtStamp(last.d))} · ${esc(whoName(last.w))}` : "") + `</div>` +

}

const OPEN_ON_A_JOB = ["customer", "crew", "scope", "money"];
const foldClosed = key => (S.foldPref.has(key) ? S.foldPref.get(key) : key.startsWith("job:") && !OPEN_ON_A_JOB.includes(key.slice(4)));
// pencil = {kind, id, sec}: the small pencil that edits this section in place (needs the Edit permission for that kind of record)
const section = (title, body, right, fold, pencil) => {
  const key = fold ? (location.hash.slice(1).split("/")[0] || "") + ":" + fold : "", closed = !!key && foldClosed(key);
  const word = tt(closed ? "showSection" : "hideSection");
  const arrow = key ? `<button type="button" class="btn btn-link p-0 me-1 hl-fold" data-act="fold" data-key="${key}" aria-expanded="${!closed}" aria-label="${word}: ${esc(String(title).replace(/<[^>]*>/g, ""))}" title="${word}">${ic("chevron")}</button>` : "";
  return `<div class="card shadow-sm mb-3"><div class="card-body${closed ? " hl-folded" : ""}">${title ? `<div class="d-flex align-items-center gap-2 mb-2"><h2 class="h6 mb-0 flex-grow-1">${arrow}${title}</h2>${right || ""}</div>` : ""}` +
    (key ? `<div${closed ? " hidden" : ""} data-body>${pencil && !closed && mayEdit(pencil.kind) ? `<button type="button" class="btn btn-link hl-pencil" data-act="inlineOpen" data-kind="${pencil.kind}" data-id="${esc(pencil.id)}" data-sec="${pencil.sec}" title="${tt("edit.section")}" aria-label="${tt("edit.section")}">${ic("pencil")}</button>` : ""}${body}</div>` : body) + `</div></div>`;
};
const dl = rows => `<dl class="row mb-0 small">` + rows.filter(Boolean).map(([k, v]) =>
  `<dt class="col-4 text-body-secondary fw-normal">${k}</dt><dd class="col-8 mb-1">${v}</dd>`).join("") + `</dl>`;
const empty = text => `<div class="text-center text-body-secondary py-4">${esc(text)}</div>`;

// row of filter buttons above a list: options are [value, label, count]
function pills(name, cur, opts) {
  return `<div class="d-flex flex-nowrap gap-1 overflow-auto pb-2 mb-2">` + opts.map(([v, l, n]) =>
    `<button type="button" class="btn btn-sm rounded-pill text-nowrap ${cur === v ? "btn-primary" : "btn-outline-secondary"}" data-act="setFilter" data-name="${name}" data-value="${v}">${esc(l)}${n != null ? ` <span class="opacity-75">${n}</span>` : ""}</button>`).join("") + `</div>`;
}

// phone, text and directions links. They open the phone's own apps and add a line to the record's history.
const telHref = phone => "tel:" + String(phone).replace(/\D/g, "");
const smsHref = (phone, body) => "sms:" + String(phone).replace(/\D/g, "") + "&body=" + encodeURIComponent(body);   // iPhone format
const mapsHref = p => "https://maps.apple.com/?daddr=" + encodeURIComponent(p.addr + ", " + p.city);
function contactBtns(o) {              // o = {phone, first, lang, place, kind, id, sm}
  const size = o.sm ? "btn-sm" : "", tag = `data-act="touch" data-kind="${o.kind}" data-id="${esc(o.id)}"`;
  const hello = (I18N[o.lang || "en"] || I18N.en).sms.onTheWay.replace("{name}", o.first || "");
  return `<div class="d-flex flex-wrap gap-2">` +
    (o.phone ? `<a class="btn btn-outline-secondary ${size}" href="${telHref(o.phone)}" ${tag} data-how="call">${ic("phone")} ${esc(t("call"))}</a>` +
               `<a class="btn btn-outline-secondary ${size}" href="${smsHref(o.phone, hello)}" ${tag} data-how="text">${ic("msg")} ${esc(t("text"))}</a>` : "") +
    (o.place ? `<a class="btn btn-outline-secondary ${size}" href="${mapsHref(o.place)}" target="_blank" rel="noopener" ${tag} data-how="nav">${ic("nav")} ${esc(t("directions"))}</a>` : "") +
    (o.extra || "") + `</div>`;
}

/* ---------- pop-up window and short messages (Bootstrap modal and toast) ---------- */
function openModal(html, size) {
  $("#modalDialog").className = "modal-dialog modal-dialog-scrollable modal-dialog-centered modal-fullscreen-sm-down" + (size === "lg" ? " modal-lg" : "");
  $("#modalContent").innerHTML = html;
  bootstrap.Modal.getOrCreateInstance($("#modal")).show();
}
function closeModal() { const m = bootstrap.Modal.getInstance($("#modal")); if (m) m.hide(); }
const modalShell = (title, body, footer) =>
  `<div class="modal-header"><h2 class="modal-title h5">${title}</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="${esc(t("close"))}"></button></div>` +
  `<div class="modal-body">${body}</div>` + (footer ? `<div class="modal-footer">${footer}</div>` : "");
const cancelBtn = () => `<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">${esc(t("cancel"))}</button>`;
function toast(msg) { $("#toast .toast-body").textContent = msg; bootstrap.Toast.getOrCreateInstance($("#toast"), { delay: 2600 }).show(); }
const field = (label, html) => `<div class="mb-3"><label class="form-label small fw-semibold mb-1">${esc(label)}</label>${html}</div>`;
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };

/* ---------- screens and navigation ---------- */
// Each screen registers itself: route("jobs", {roles, icon, render}). A tab only shows once its screen exists.
const ROUTES = {};
const route = (name, def) => { ROUTES[name] = def; };
const NAV = {
  admin: ["dashboard", "today", "leads", "opps", "jobs", "schedule", "accounts", "search", "reports", "admin"],
  office: ["today", "leads", "opps", "jobs", "schedule", "accounts", "search", "reports"],
  crew: ["myday", "myjobs", "search"]
};
const tabsFor = role => NAV[role].filter(k => ROUTES[k]);
const allowed = name => ROUTES[name] && ROUTES[name].roles.includes(S.role);
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

function render() {
  let [name, ...rest] = (location.hash || "").slice(1).split("/");
  let arg = decodeURIComponent(rest.join("/"));
  if (!allowed(name)) { name = tabsFor(S.role)[0]; arg = ""; history.replaceState(null, "", "#" + name); }
  const r = ROUTES[name];
  document.querySelectorAll(".tooltip").forEach(el => el.remove());      // a tooltip left over from the last screen
  renderChrome(typeof r.tab === "function" ? r.tab() : (r.tab || name));
  $("#view").innerHTML = r.render(arg) + `<p class="text-center text-body-secondary small mt-4 mb-0">${tt("demo")}</p>`;
  document.documentElement.lang = S.lang;
  capitalOptions(document); showSide();
  if (r.after) r.after(arg);
}

// top bar, side navigation and phone tab bar
function renderChrome(active) {
  const tabs = tabsFor(S.role);
  const cur = k => (k === active ? ' active" aria-current="page' : "");
  $("#sideNav").innerHTML = tabs.map(k =>
    `<li class="nav-item"><a class="nav-link d-flex align-items-center gap-2${cur(k)}" href="#${k}">${ic(ROUTES[k].icon)}<span>${esc(t("nav." + k))}</span></a></li>`).join("");
  // phones: up to 5 tabs; if there are more, the 5th is "More"
  const first = tabs.length > 5 ? tabs.slice(0, 4) : tabs, more = tabs.length > 5 ? tabs.slice(4) : [];
  const tab = (inner, extra) => `<li class="nav-item"><a class="nav-link d-flex flex-column align-items-center px-1 py-2${extra}>${inner}</a></li>`;
  $("#tabNav").innerHTML = first.map(k => tab(`${ic(ROUTES[k].icon)}<span>${esc(t("nav." + k))}</span>`, `${cur(k)}" href="#${k}"`)).join("") +
    (more.length ? tab(`${ic("more")}<span>${esc(t("nav.more"))}</span>`, `${more.includes(active) ? " active" : ""}" href="#" role="button" data-bs-toggle="offcanvas" data-bs-target="#moreNav"`) : "");
  $("#moreTitle").textContent = t("nav.more");
  $("#moreList").innerHTML = more.map(k =>
    `<a class="list-group-item list-group-item-action d-flex align-items-center gap-2${k === active ? " active" : ""}" href="#${k}" data-act="navMore" data-to="#${k}">${ic(ROUTES[k].icon)} ${esc(t("nav." + k))}</a>`).join("");
  // the business's name and the line under it (Admin > Company details)
  $("#brandName").innerHTML = brandHtml(S.company.name || "—");
  $("#brandTag").textContent = (S.company.tagline || "").toUpperCase();
  // role and language switches
  $("#roleBtn").textContent = isCrew() ? crewName(CREWS.find(c => c.id === S.crew)) : t("role." + S.role);
  const item = (role, crew, label) => `<li><button type="button" class="dropdown-item${S.role === role && (!crew || S.crew === crew) ? " active" : ""}" data-act="setRole" data-role="${role}" data-crew="${crew}">${esc(label)}</button></li>`;
  $("#roleMenu").innerHTML = `<li><h6 class="dropdown-header">${esc(t("viewAs"))}</h6></li>` + item("admin", "", t("role.admin")) + item("office", "", t("role.office")) +
    CREWS.map(c => item("crew", c.id, crewName(c) + " · " + c.lead)).join("") +
    (can("delete") ? `<li><hr class="dropdown-divider"></li><li><a class="dropdown-item" href="#bin">${ic("trash")} ${tt("bin.title")}</a></li>` : "");
  document.querySelectorAll('[data-act="setLang"]').forEach(b => b.classList.toggle("active", b.dataset.lang === S.lang));
}

// the name in capitals, with the "&" in the light accent color, as on the app's top bar
const brandHtml = name => esc(name.toUpperCase()).replace(/&amp;/g, '<span class="hl-amp">&amp;</span>');

/* ---------- clicks: every button says what it does with data-act="name" ---------- */
const ACT = {};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || !ACT[el.dataset.act]) return;
  if (el.tagName === "A" && (el.getAttribute("href") || "#") === "#") e.preventDefault();
  ACT[el.dataset.act](el.dataset, el, e);
});
document.addEventListener("input", e => { const el = e.target.closest("[data-input]"); if (el && ACT[el.dataset.input]) ACT[el.dataset.input](el.dataset, el, e); });
document.addEventListener("change", e => { const el = e.target.closest("[data-change]"); if (el && ACT[el.dataset.change]) ACT[el.dataset.change](el.dataset, el, e); });
// the screen the person came from, so a record page's arrow can name it (the week of the Schedule is kept in S.week)
let LAST = location.hash, PREV = "";
window.addEventListener("hashchange", () => { PREV = LAST; LAST = location.hash; closeModal(); render(); window.scrollTo(0, 0); });
const BACK_FROM = { today: "nav.today", dashboard: "nav.dashboard", leads: "nav.leads", opps: "nav.opps", jobs: "nav.jobs", schedule: "nav.schedule", accounts: "nav.accounts",
  search: "nav.search", reports: "nav.reports", myday: "nav.myday", myjobs: "nav.myjobs", lead: "back.lead", opp: "back.opp", job: "back.job", account: "back.account" };
// the arrow at the top left of a lead, account, opportunity or job: back to the screen the person came from, named; else to the list
function recBack(fallbackHref, fallbackLabel) {
  const name = PREV.slice(1).split("/")[0], here = LAST;
  const found = PREV && PREV !== here && BACK_FROM[name] && allowed(name === "lead" || name === "opp" || name === "job" || name === "account" ? name : name);
  return `<a class="hl-back small text-decoration-none d-inline-flex align-items-center gap-1 mb-2" href="${found ? esc(PREV) : fallbackHref}">${ic("back")}<span>${esc(found ? t(BACK_FROM[name]) : fallbackLabel)}</span></a>`;
}
// every drop-down option starts with a capital letter, in both languages
function capitalOptions(root) {
  root.querySelectorAll("option").forEach(o => { const w = o.textContent; if (w && /^\p{Ll}/u.test(w)) o.textContent = w[0].toLocaleUpperCase() + w.slice(1); });
}

ACT.setLang = d => { S.lang = d.lang; render(); };
ACT.fold = d => { S.foldPref.set(d.key, !foldClosed(d.key)); render(); };
ACT.sideToggle = () => { S.sideIcons = !S.sideIcons; try { localStorage.setItem("hl-side", S.sideIcons ? "icons" : "open"); } catch (e) {} showSide(); };
function showSide() {
  document.documentElement.classList.toggle("hl-side-icons", !!S.sideIcons);
  const b = $("#sideToggle"); if (!b) return;
  b.innerHTML = ic("sidebar"); b.setAttribute("aria-expanded", S.sideIcons ? "false" : "true");
  b.title = b.ariaLabel = t(S.sideIcons ? "side.open" : "side.fold");
}
ACT.setRole = d => { S.role = d.role; if (d.crew) S.crew = d.crew; go("#" + tabsFor(S.role)[0]); };
ACT.goHome = () => go("#" + tabsFor(S.role)[0]);
ACT.setFilter = d => { S.f[d.name] = d.value; render(); };
ACT.navMore = (d, el, e) => { e.preventDefault(); const oc = bootstrap.Offcanvas.getInstance($("#moreNav")); if (oc) oc.hide(); go(d.to); };
// Call, Text and Directions add a line to the record's history. The link itself still opens the phone's app.
ACT.touch = d => {
  const rec = findRec(d.kind, d.id);
  if (rec) { addLog(rec, "log." + d.how); if (typeof onTouch === "function") onTouch(d.kind, rec, d.how); }
  setTimeout(render, 400);
};

const cosTotal = j => (j.cos || []).filter(c => c.status === "signed").reduce((s, c) => s + c.amount, 0);
const jobTotal = j => j.price + cosTotal(j);
const paidTotal = j => (j.payments || []).reduce((s, p) => s + p.amount, 0);

/* ---------- a little starting history, so the History boxes are not empty ---------- */
let seeded = 0;
// a starting history line. A day with no time gets one: the time given ("14:20"), or a believable one between 8 am and 5 pm.
function seed(rec, d, w, k, v, time) {
  const at = new Date(d);
  if (!at.getHours() && !at.getMinutes()) {
    if (time) at.setHours(+time.slice(0, 2), +time.slice(3));
    else at.setHours(8 + (seeded * 7) % 9, 5 + (seeded * 13) % 50);
  }
  seeded++;
  (rec.log = rec.log || []).push({ d: at, w, k, v });
}
OPPS.forEach(o => {
  if (o.stage === "lost") seed(o, o.lostOn, "office", "log.lost", null, "16:05");
  if (o.signedOn) seed(o, o.signedOn, "office", "log.signed", null, "10:42");
  if (o.sentOn) seed(o, o.sentOn, "office", "log.proposalSent", null, "14:20");
  seed(o, o.created, "office", "log.oppCreated", null, "09:12");
});
JOBS.forEach(j => {
  const made = j.opp ? oppOf(j.opp).signedOn : ago(2);
  if (j.stage === "inprogress") seed(j, j.days[0], j.crew, "log.started", null, "07:55");
  if (j.days.length && j.stage !== "signed") seed(j, made, "office", "log.scheduled", null, "13:30");
  seed(j, made, "office", j.opp ? "log.jobCreated" : "log.warrantyCreated", null, "10:43");
});

  if (j.stage === "scheduled" && (!isCrew() || isCrewLead())) out.push(b("jobStage", "check", t("job.start"), 'data-to="inprogress"'));
  if (["scheduled", "inprogress"].includes(j.stage) && !isCrew()) out.push(b("jobSchedule", "edit", t("sched.changeDates"), "", "btn-outline-secondary"));
  if (j.stage === "inprogress" && (!isCrew() || isCrewLead())) out.push(b("jobStage", "check", t("job.markDone"), 'data-to="done"'));
  if (j.type !== "warranty") {
    if (j.stage === "done" && !isCrew()) out.push(b("jobInvoice", "mail", t("job.makeInvoice")));
    if (canTakePayment(j) && (j.stage === "invoiced" || (isCrew() && ["inprogress", "done"].includes(j.stage)))) out.push(b("payAdd", "dollar", t("money.record")));
    if (j.invoice) out.push(b("jobInvoice", "doc", t("job.viewInvoice"), "", "btn-outline-secondary"));

  return out.join("");
}

  const first = j.days.length ? j.days[0] : wd(1);
  openModal(modalShell(tt("job.schedule"),
    `<p class="small text-body-secondary">#${j.id} · ${esc(acct(j.acct).name)} · ${tt("type." + j.type)}</p>` +

    `<div class="col-5">${field(t("job.howManyDays"), `<input type="number" class="form-control" id="jsDays" min="1" max="20" value="${days}">`)}</div></div>` +
    dayOffBox("jsOff") + `<div class="alert alert-danger py-2 small d-none" id="jsProblem"></div>` +
    `<div class="form-text">${tt("job.scheduleHint")}</div>`,
    cancelBtn() + `<button type="button" class="btn btn-primary" data-act="saveSchedule" data-id="${j.id}">${tt("job.schedule")}</button>`));
};
ACT.saveSchedule = d => {
  const j = jobOf(d.id), n = Math.max(1, parseInt(val("jsDays"), 10) || 1);
  if (!val("jsDay")) { $("#jsDay").classList.add("is-invalid"); return; }
  const start = dayFromIso(val("jsDay"));
  if (isOff(start) && !$("#jsOff").checked) { $("#jsProblem").textContent = t("sched.pickWorkDay"); $("#jsProblem").classList.remove("d-none"); return; }
  const days = [new Date(start)], cur = new Date(start), wasDays = j.days.slice(), wasCrew = j.crew;     // the first day, then work days
  while (days.length < n) { cur.setDate(cur.getDate() + 1); if (!isOff(cur)) days.push(new Date(cur)); }
  j.added = [];
  j.crew = val("jsCrew"); j.days = days; j.time = "08:00";
  if (j.stage === "signed") { j.stage = "scheduled"; addLog(j, "log.scheduled"); }
  else if (wasDays.map(iso).join() !== days.map(iso).join() || wasCrew !== j.crew) {       // an already scheduled job changed: the crew gets a "Changed" notice
    j.changed = { wasDays, seen: false, d: new Date() }; addLog(j, "log.changed", { was: rangeText(wasDays) });
  }
  closeModal(); toast(t("log.scheduled")); render();
};

// everything happening on one day: timed inspections, and jobs a crew is working that day
function stopsOn(day, crewId) {

    .forEach(o => out.push({ kind: "insp", time: o.insp.time, rec: o, href: "#opp/" + o.id }));

}

    row: (o, hl) => recRow("#opp/" + o.id, "#" + hl(o.id) + " · " + hl(t("type." + o.type)), hl(acct(o.acct).name), hl(addrLine(placeOf(o))), stageBadge(o.stage)) },
  { title: "nav.jobs", roles: ["admin", "office", "crew"], find: hit => myJobs().filter(j => hit(j.id, acct(j.acct).name, addrLine(placeOf(j)), placeOf(j).site ? placeOf(j).site.name : "", t("type." + j.type), j.ref ? j.ref.num : "", ...scopeOf(j))),

];
function searchResults() {
  const q = S.q.trim().toLowerCase(); if (!q) return "";
  const digits = q.replace(/\D/g, "");
  const hit = (...parts) => { const s = parts.join(" ").toLowerCase(); return s.includes(q) || (digits.length >= 3 && s.replace(/\D/g, "").includes(digits)); };
  const mark = new RegExp("(" + esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
  const hl = s => esc(s).replace(mark, "<mark>$1</mark>");
  let total = 0;
  const groups = SEARCHERS.filter(g => g.roles.includes(S.role)).map(g => {
    const found = g.find(hit); total += found.length;
    return found.length ? `<h2 class="h6 mt-3 mb-2">${tt(g.title)} <span class="text-body-secondary fw-normal">${found.length}</span></h2>` + listBox(found.map(r => g.row(r, hl, q)).join("")) : "";
  }).join("");
  return total ? groups : empty(t("search.none"));
}

/* =====================================================================
   EDIT: one Edit window for every kind of record. Each Office login has an
   Edit permission for each kind (Admin > Users and permissions); the Admin
   edits everything; a crew edits nothing. Every saved change adds a line to
   the history with the value before and after. The number, the stage and
   the dates a step stamps are not here: they change only through their
   own buttons, so the history, the documents and the money stay in step.
   ===================================================================== */
let EDITING = null;            // the record in the Edit window: {kind, rec, fields, owner, logKey, name}

// a field: k (key), label (word key), type (text | number | money | date | textarea | select | check), opts [[value, word]], get, set
const fText = (k, label, get, set, type) => ({ k, label, type: type || "text", get, set });
const fSelect = (k, label, opts, get, set) => ({ k, label, type: "select", opts, get, set });
const typeOpts = () => TYPES.map(k => [k, "type." + k]);
const showVal = (f, v) => {
  if (v === "" || v == null || (Array.isArray(v) && !v.length)) return t("empty");
  if (f.type === "select") { const o = f.opts.find(x => x[0] === v); return o ? t(o[1]) : v; }
  if (f.type === "check") return t(v ? "yes" : "no");
  if (f.type === "money") return money(v);
  if (f.type === "date") return fmtDate(v);
  return String(v).replace(/\s+/g, " ").slice(0, 80);
};
const sameVal = (f, a, b) => (f.type === "date" ? iso(a) === iso(b) : f.type === "money" ? Number(a) === Number(b) : String(a ?? "") === String(b ?? ""));

const EDIT_SPECS = {
  lead: l => [fText("name", "name", () => l.name, v => { l.name = v; }), fText("phone", "phone", () => l.phone, v => { l.phone = v; }),
    fText("email", "email", () => l.email, v => { l.email = v; }), fText("addr", "street", () => l.addr, v => { l.addr = v; }),
    fText("city", "cityZip", () => l.city, v => { l.city = v; }), fSelect("type", "jobType", typeOpts(), () => l.type, v => { l.type = v; }),
    fSelect("lang", "leads.language", [["en", "langName.en"], ["es", "langName.es"]], () => l.lang, v => { l.lang = v; }),
    fSelect("owner", "leads.assigned", [["office", "role.office"], ["admin", "role.admin"]], () => l.owner, v => { l.owner = v; }),
    fText("msg", "leads.request", () => l.msg, v => { l.msg = v; }, "textarea")],
  account: a => [fText("name", "name", () => a.name, v => { a.name = v; }),
    fSelect("kind", "accounts.type", pickKeys("kind", a.kind).map(k => [k, "kind." + k]), () => a.kind, v => { a.kind = v; a.type = v === "homeowner" ? "person" : "company"; }),
    fSelect("lang", "leads.language", [["en", "langName.en"], ["es", "langName.es"]], () => a.lang, v => { a.lang = v; })],
  contact: c => [fText("name", "name", () => c.name, v => { c.name = v; }),
    fSelect("role", "edit.role", ["owner", "spouse", "office"].map(k => [k, "contactRole." + k]), () => c.role, v => { c.role = v; }),
    fText("phone", "phone", () => c.phone, v => { c.phone = v; }), fText("email", "email", () => c.email, v => { c.email = v; })],
  property: p => [fText("addr", "street", () => p.addr, v => { p.addr = v; }), fText("city", "cityZip", () => p.city, v => { p.city = v; }),
    fText("site", "siteContact", () => (p.site ? p.site.name : ""), v => { p.site = v ? { name: v, phone: p.site ? p.site.phone : "" } : null; })],
  note: n => [fText("text", "edit.noteText", () => n.text, v => { n.text = v; n.title = v.split("\n")[0]; }, "textarea")],
  opp: o => [fSelect("prop", "property", acct(o.acct).props.map(p => [p.id, "raw:" + addrLine(p)]), () => o.prop, v => { o.prop = v; }),
    fSelect("type", "jobType", typeOpts(), () => o.type, v => { o.type = v; }),
    fSelect("src", "opps.source", pickKeys("src", o.src).map(k => [k, "src." + k]), () => o.src, v => { o.src = v; }),
    { k: "laborOnly", label: "job.laborOnly", type: "check", get: () => !!o.laborOnly, set: v => { o.laborOnly = v; } },
    ...(o.stage === "lost" ? [fSelect("lostReason", "opps.lostReason", pickKeys("lost", o.lostReason).map(k => [k, "lost." + k]), () => o.lostReason, v => { o.lostReason = v; })] : [])],
  job: j => [fSelect("prop", "property", acct(j.acct).props.map(p => [p.id, "raw:" + addrLine(p)]), () => j.prop, v => { j.prop = v; }),
    ...(j.type === "warranty" ? [] : [fSelect("type", "jobType", typeOpts(), () => j.type, v => { j.type = v; }),
      { k: "price", label: "job.price", type: "money", get: () => j.price, set: v => { j.price = Number(v); } },
      { k: "laborOnly", label: "job.laborOnly", type: "check", get: () => !!j.laborOnly, set: v => { j.laborOnly = v; } }]),
    fText("scope", "job.scope", () => scopeOf(j).join("\n"), v => { j.scope = v.split("\n").map(x => x.trim()).filter(Boolean); }, "textarea"),
    fSelect("refType", "job.refType", [["", "raw:—"], ["po", "ref.po"], ["claim", "ref.claim"], ["wo", "ref.wo"]], () => (j.ref ? j.ref.type : ""), v => { j.ref = v ? { type: v, num: j.ref ? j.ref.num : "" } : null; }),
    fText("refNum", "job.refNumber", () => (j.ref ? j.ref.num : ""), v => { if (j.ref) j.ref.num = v; })],
  co: c => [fText("text", "money.coWhat", () => c.text, v => { c.text = v; }, "textarea"),
    { k: "amount", label: "money.coAmount", type: "money", get: () => c.amount, set: v => { c.amount = Number(v); } }],
  payment: p => [{ k: "amount", label: "money.amount", type: "money", get: () => p.amount, set: v => { p.amount = Number(v); } },
    fSelect("method", "money.method", pickKeys("method", p.method).map(k => [k, "method." + k]), () => p.method, v => { p.method = v; }),
    fText("num", "money.checkNo", () => p.num, v => { p.num = v; }),
    { k: "d", label: "edit.date", type: "date", get: () => p.d, set: v => { p.d = v; } },
    fSelect("kind", "edit.payKind", [["deposit", "pay.deposit"], ["payment", "pay.payment"]], () => p.kind, v => { p.kind = v; })]
};
const optLabel = w => (w.startsWith("raw:") ? esc(w.slice(4)) : tt(w));
function inputFor(f) {
  const v = f.get(), id = "ef_" + f.k;
  if (f.type === "locked") return `<div class="hl-pre small bg-body-tertiary border rounded p-2">${esc(v)}</div><div class="form-text">${tt("edit.locked")}</div>`;
  if (f.type === "select") return `<select class="form-select" id="${id}">${f.opts.map(([k, w]) => `<option value="${esc(k)}"${k === v ? " selected" : ""}>${optLabel(w)}</option>`).join("")}</select>`;
  if (f.type === "check") return `<div class="form-check"><input class="form-check-input" type="checkbox" id="${id}"${v ? " checked" : ""}><label class="form-check-label" for="${id}">${tt(f.label)}</label></div>`;
  if (f.type === "textarea") return `<textarea class="form-control" id="${id}" rows="3">${esc(v)}</textarea>`;
  if (f.type === "date") return `<input type="date" class="form-control" id="${id}" value="${iso(v)}">`;
  if (f.type === "money") return `<div class="input-group"><span class="input-group-text">$</span><input class="form-control" id="${id}" inputmode="decimal" value="${esc(v)}"></div>`;
  return `<input class="form-control" id="${id}" value="${esc(v)}" autocomplete="off">`;
}
const readInput = f => {
  if (f.type === "locked") return f.get();
  const el = document.getElementById("ef_" + f.k);
  if (f.type === "check") return el.checked;
  if (f.type === "date") return dayFromIso(el.value);
  if (f.type === "money") { const n = parseFloat(el.value.replace(/[^0-9.\-]/g, "")); return isNaN(n) ? null : n; }
  return el.value.trim();
};

// kind: lead, account, contact, property, note, opp, job, co, payment. owner: the record whose history gets the line.
function openEdit(kind, rec, owner, name, delKind, delId) {
  const fields = EDIT_SPECS[kind](rec);
  EDITING = { kind, rec, fields, owner: owner || rec, name: name || "" };
  const del = delKind && can("delete") ? `<button type="button" class="btn btn-outline-danger me-auto" data-act="askDelete" data-kind="${delKind}" data-id="${esc(delId)}">${ic("trash")} ${tt("bin.delete")}</button>` : "";
  openModal(modalShell(tt("edit.title." + kind),
    (name ? `<p class="small text-body-secondary">${esc(name)}</p>` : "") +
    fields.map(f => (f.type === "check" ? `<div class="mb-3">${inputFor(f)}</div>` : field(t(f.label), inputFor(f)))).join("") +
    `<div class="form-text">${tt("edit.hint")}</div>`,
    del + cancelBtn() + `<button type="button" class="btn btn-primary" data-act="editSave">${tt("save")}</button>`));
}
const LOG_FOR = { lead: "log.edited", account: "log.edited", opp: "log.edited", job: "log.edited", contact: "log.contactEdited", property: "log.propertyEdited",
  note: "log.noteEdited", co: "log.coEdited", payment: "log.paymentEdited" };
ACT.editSave = () => {
  const { kind, fields, owner, name } = EDITING, changes = [];
  for (const f of fields) {
    const before = f.get(), after = readInput(f);
    if ((f.type === "money" && (after === null || (kind === "job" && after < 0))) || (f.k === "name" && !after) || (f.k === "amount" && kind === "payment" && !(after > 0))) {
      document.getElementById("ef_" + f.k).classList.add("is-invalid"); return;
    }
    if (!sameVal(f, before, after)) changes.push({ f, before, after });
  }
  if (!changes.length) { closeModal(); toast(t("edit.nothing")); return; }
  changes.forEach(c => c.f.set(c.after));
  addLog(owner, LOG_FOR[kind], () => ({ detail: (name ? name + " · " : "") + changes.map(c => t(c.f.label) + ": " + showVal(c.f, c.before) + " → " + showVal(c.f, c.after)).join("; ") }));
  if (owner.payments !== undefined || owner.price !== undefined) recheckPaid(owner);
  closeModal(); toast(t("saved")); render();
};
// a job whose amounts changed: Paid follows the balance
function recheckPaid(j) {
  if (!j || j.type === "warranty" || typeof balance !== "function") return;
  if (j.stage === "paid" && balance(j) > 0) { j.stage = j.invoice ? "invoiced" : "done"; addLog(j, "log.notPaid"); }
  else if (["done", "invoiced"].includes(j.stage) && balance(j) <= 0 && (j.payments || []).length) { j.stage = "paid"; addLog(j, "log.paid"); }
}

/* the buttons that open it: each kind of record says who may */
ACT.editLead = d => openEdit("lead", LEADS.find(x => x.id === d.id), null, "", "lead", d.id);
ACT.editAccount = d => openEdit("account", acct(d.id), null, "", "account", d.id);
ACT.editContact = d => { const a = acct(d.acct), c = a.contacts[+d.i]; openEdit("contact", c, a, c.name, a.contacts.length > 1 ? "contact" : "", d.acct + ":" + d.i); };
ACT.editProperty = d => { const a = acct(d.acct), p = a.props[+d.i]; openEdit("property", p, a, p.addr, a.props.length > 1 ? "property" : "", d.acct + ":" + d.i); };
ACT.editNote = d => { const a = acct(d.acct), n = a.details[+d.i]; openEdit("note", n, a, n.title || "", "note", d.acct + ":" + d.i); };
ACT.editOpp = d => openEdit("opp", oppOf(d.id), null, "", "deal", d.id);
ACT.editJob = d => openEdit("job", jobOf(d.id), null, "", "deal", d.id);
ACT.editCo = d => { const j = jobOf(d.id), c = j.cos.find(x => x.id === d.co); openEdit("co", c, j, c.id, "co", d.id + ":" + c.id); };
ACT.editPay = d => { const j = jobOf(d.id), p = j.payments.find(x => x.n === +d.n); openEdit("payment", p, j, "R" + p.n, "payment", d.id + ":" + p.n); };

/* small buttons for record pages */
// all = true on a lead, an opportunity and a job: with pencils on the page, this button opens every section for editing at once
const editBtn = (act, data, kind, all) => (mayEdit(kind) ? `<button type="button" class="btn btn-outline-secondary btn-sm hl-edit text-nowrap" data-act="${all ? "editAll" : act}" data-fallback="${act}" ${data}>${ic("edit")} ${tt("docs.edit")}</button>` : "");
ACT.editAll = (d, el) => {

const delBtn = (kind, id) => (can("delete") ? `<button type="button" class="btn btn-outline-danger btn-sm" data-act="askDelete" data-kind="${kind}" data-id="${esc(id)}" title="${tt("bin.delete")}" aria-label="${tt("bin.delete")}">${ic("trash")}</button>` : "");
// the top right of a record page: Edit, Delete and the stage
const headTools = (editPart, delPart, extra) => `<div class="d-flex flex-wrap align-items-center justify-content-end gap-2">${editPart}${delPart}${extra || ""}</div>`;

/* =====================================================================
   DELETE AND THE RECYCLE BIN. Deleting needs the "Delete records"
   permission set and works on every kind of record. Nothing is erased:
   the record leaves every list, Search, the schedule and the reports, and
   waits in the Recycle Bin for 30 days, where it can be restored exactly as
   it was. Only the Admin deletes for good. The history says who and when.

   What goes together:
     an account        with its opportunities, its jobs and the leads that became them
     an opportunity    with its job, and a job with its opportunity: one deal, one number,
                       with the job's warranty jobs
     anything else     by itself
   ===================================================================== */
const BIN = [];
const KEEP_DAYS = 30;
const daysLeft = e => Math.max(0, KEEP_DAYS - daysSince(e.d));
const take = (list, rec) => { const i = list.indexOf(rec); if (i >= 0) list.splice(i, 1); };

// which record a Delete button means. id is "A1", "26-112", "L-311", or "A1:0" (a contact, property or note), "26-112:CO1" or "26-104:1" (a payment)
function binTarget(kind, id) {
  const [a, b] = String(id).split(":");
  if (kind === "lead") return { rec: LEADS.find(l => l.id === a) };
  if (kind === "account") return { rec: acct(a) };
  if (kind === "deal") return { rec: oppOf(a) || jobOf(a), deal: a };
  if (kind === "contact") return { rec: acct(a).contacts[+b], parent: acct(a), list: acct(a).contacts };
  if (kind === "property") return { rec: acct(a).props[+b], parent: acct(a), list: acct(a).props };
  if (kind === "note") return { rec: acct(a).details[+b], parent: acct(a), list: acct(a).details };
  if (kind === "co") return { rec: jobOf(a).cos.find(c => c.id === b), parent: jobOf(a), list: jobOf(a).cos };
  if (kind === "payment") return { rec: jobOf(a).payments.find(p => p.n === +b), parent: jobOf(a), list: jobOf(a).payments };
  if (kind === "file") { const owner = jobOf(a) || acct(a); return { rec: owner.files.find(f => f.id === b), parent: owner, list: owner.files }; }
  return {};
}
// everything that goes along: [[list, record], ...]
function binParts(kind, x) {
  if (kind === "account") {
    const opps = OPPS.filter(o => o.acct === x.rec.id), jobs = JOBS.filter(j => j.acct === x.rec.id);
    const leads = LEADS.filter(l => opps.some(o => o.id === l.opp) || jobs.some(j => j.id === l.job));
    return [[ACCOUNTS, x.rec], ...opps.map(o => [OPPS, o]), ...jobs.map(j => [JOBS, j]), ...leads.map(l => [LEADS, l])];
  }
  if (kind === "deal") {
    const o = oppOf(x.deal), j = jobOf(x.deal), w = j ? JOBS.filter(k => k.warrantyFor === j.id) : [];
    const leads = LEADS.filter(l => l.opp === x.deal || l.job === x.deal);
    return [...(o ? [[OPPS, o]] : []), ...(j ? [[JOBS, j]] : []), ...w.map(k => [JOBS, k]), ...leads.map(l => [LEADS, l])];
  }
  if (kind === "lead") return [[LEADS, x.rec]];
  return [[x.list, x.rec]];
}
function binLabel(kind, x) {
  const r = x.rec, owner = x.parent && x.parent.name ? x.parent.name : x.parent ? acct(x.parent.acct).name : "";
  if (kind === "deal") return "#" + x.deal + " · " + acct(r.acct).name;
  if (kind === "contact") return r.name + " (" + owner + ")";
  if (kind === "property") return r.addr + " (" + owner + ")";
  if (kind === "note") return (r.title || r.text.split("\n")[0]).slice(0, 60) + " (" + owner + ")";
  if (kind === "co") return "#" + x.parent.id + " · " + r.id + " (" + owner + ")";

  if (kind === "file") return r.name + " (" + owner + ")";

}
// what goes along, not counting the record itself (for a deal: its own opportunity and job)
const alsoOf = (kind, parts, x) => {
  const own = rec => rec === x.rec || (kind === "deal" && rec.id === x.deal && !rec.warrantyFor);
  const count = list => parts.filter(([l, rec]) => l === list && !own(rec)).length;
  return { opps: count(OPPS), jobs: count(JOBS), leads: count(LEADS) };
};

const binBlocked = (kind, x) => (kind === "property" && [...OPPS, ...JOBS].some(r => r.prop === x.rec.id) ? t("bin.propertyInUse") : "");

function binMoney(kind, x) {
  if (kind === "payment") return t("bin.payWithout", { balance: money(balance(x.parent) + x.rec.amount) });
  if (kind === "co" && x.rec.status === "signed") return t("bin.coWithout", { total: money(jobTotal(x.parent) - x.rec.amount) });

}

};
const PARENT_LOG = { contact: "log.contactDeleted", property: "log.propertyDeleted", note: "log.noteDeleted", co: "log.coDeleted", payment: "log.paymentDeleted", file: "log.fileDeleted" };
ACT.doDelete = d => {
  const x = binTarget(d.kind, d.id), parts = binParts(d.kind, x), label = binLabel(d.kind, x);
  const entry = { id: "B" + (BIN.length + 1) + "-" + Date.now(), kind: d.kind, label, also: alsoOf(d.kind, parts, x), w: me(), d: new Date(), parts, parent: x.parent };
  parts.forEach(([list, rec]) => { if (list === LEADS || list === ACCOUNTS || list === OPPS || list === JOBS) addLog(rec, "log.deleted"); take(list, rec); });
  if (PARENT_LOG[d.kind]) addLog(x.parent, PARENT_LOG[d.kind], { what: binLabel(d.kind, x).replace(/ \(.*\)$/, "") });
  if (d.kind === "co" || d.kind === "payment") recheckPaid(x.parent);
  BIN.unshift(entry); addSetupLog("log.recordDeleted", { what: label });
  closeModal(); toast(t("bin.deleted", { what: label }));

  const here = location.hash;
  if (["lead", "account", "deal"].includes(d.kind) && parts.some(([, r]) => here.endsWith("/" + r.id))) go(d.kind === "lead" ? "#leads" : d.kind === "account" ? "#accounts" : isCrew() ? "#myjobs" : "#jobs");

};

// restore: blocked while what it belongs to is in the bin too
const BIN_ACCOUNTS = () => BIN.flatMap(e => e.parts.filter(([list]) => list === ACCOUNTS).map(([, r]) => r));
function restoreBlocked(e) {
  const p = e.parent;
  if (p && p.days && !JOBS.includes(p)) return t("bin.jobFirst", { id: p.id });                  // on a job that is in the bin
  if (p && p.contacts && !ACCOUNTS.includes(p)) return t("bin.accountFirst", { name: p.name });  // on an account that is in the bin
  if (e.kind === "deal") {
    const id = e.parts[0][1].acct, gone = BIN_ACCOUNTS().find(a => a.id === id);

  return "";
}
ACT.binRestore = d => {

  e.parts.forEach(([list, rec]) => { list.push(rec); if (list === LEADS || list === ACCOUNTS || list === OPPS || list === JOBS) addLog(rec, "log.restored"); });
  if (PARENT_LOG[e.kind]) addLog(e.parent, "log.restoredItem", { what: e.label.replace(/ \(.*\)$/, "") });
  if (e.kind === "co" || e.kind === "payment") recheckPaid(e.parent);

        [tt("property"), `${esc(l.addr)}<br><span class="text-body-secondary">${esc(l.city)}</span>`], [tt("leads.language"), tt("langName." + l.lang)]]), "", "contact", { kind: "lead", id: l.id, sec: "contact" }) +

      `</div></div>` + section(tt("history"), historyList(l), "", "history");
  }
});
// The first call or text to a new lead marks it Contacted.

}

/* Convert: one step creates the customer and the opportunity. */

ACT.leadUnfit = d => openModal(modalShell(tt("leads.unfit"),

/* Leads also show on Today and in Search. */
TILES.unshift(() => ({ v: LEADS.filter(l => l.status === "new").length, l: t("today.newLeads"), to: "#leads", f: ["leads", "new"] }));
