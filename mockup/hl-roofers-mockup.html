<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H &amp; L Roofers – App Mockup</title>
<style>
:root{
  --bg:#f4f1ec; --surface:#ffffff; --surface-2:#f9f7f3; --line:#e4ded4;
  --ink:#1d2430; --ink-2:#4a5363; --ink-3:#7b8392;
  --brand:#1f3a5f; --brand-ink:#ffffff; --accent:#c4672a; --accent-soft:#f6e3d4;
  --ok:#2f7d4f; --ok-soft:#dcefe3; --warn:#b7791f; --warn-soft:#f8ecd2; --bad:#b23b3b; --bad-soft:#f6dddd;
  --info:#2c5d9b; --info-soft:#dde8f6;
  --radius:14px; --shadow:0 1px 2px rgba(20,25,35,.06),0 4px 14px rgba(20,25,35,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161d; --surface:#1a2029; --surface-2:#202733; --line:#2c3441;
    --ink:#e9edf3; --ink-2:#b4bccb; --ink-3:#8a93a3;
    --brand:#1a2f4c; --brand-ink:#ffffff; --accent:#e08a4c; --accent-soft:#3a2a1f;
    --ok:#6cc392; --ok-soft:#1d3527; --warn:#e3b45c; --warn-soft:#3a3020; --bad:#ec8a8a; --bad-soft:#3d2224;
    --info:#86b2ea; --info-soft:#1f2c3f; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a2029; --surface-2:#202733; --line:#2c3441;
  --ink:#e9edf3; --ink-2:#b4bccb; --ink-3:#8a93a3;
  --brand:#1a2f4c; --brand-ink:#ffffff; --accent:#e08a4c; --accent-soft:#3a2a1f;
  --ok:#6cc392; --ok-soft:#1d3527; --warn:#e3b45c; --warn-soft:#3a3020; --bad:#ec8a8a; --bad-soft:#3d2224;
  --info:#86b2ea; --info-soft:#1f2c3f; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
.app{display:flex;min-height:100vh}
/* ---------- header ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);padding:10px 16px calc(10px);padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0;overflow:hidden}
.brand .tag{overflow:hidden;text-overflow:ellipsis}
@media(max-width:420px){.seg button{padding:5px 8px}.top-controls{gap:4px}.brand .name{font-size:15px}.brand .tag{font-size:10px}}
.brand .name{font-weight:800;letter-spacing:.06em;font-size:17px;white-space:nowrap}
.brand .name span{color:#f0b07f}
.brand .tag{font-size:11px;opacity:.8;letter-spacing:.04em;white-space:nowrap}
.top-controls{margin-left:auto;display:flex;gap:6px;align-items:center}
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;color:#fff;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;opacity:.8}
.seg button.on{background:#fff;color:var(--brand);opacity:1}
/* ---------- nav ---------- */
.side{display:none}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px max(6px,env(safe-area-inset-bottom))}
.tabbar a,.side a{text-decoration:none;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;padding:4px 6px;border-radius:10px;min-width:58px}
.tabbar a.on,.side a.on{color:var(--accent)}
.tabbar svg,.side svg{width:24px;height:24px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:16px 16px 96px;max-width:860px;width:100%;margin:0 auto}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:4px;width:200px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh}
  .side a{flex-direction:row;gap:10px;font-size:14px;padding:10px 12px;min-width:0}
  .side a.on{background:var(--accent-soft)}
  .side .side-brand{font-weight:800;letter-spacing:.06em;color:var(--brand);padding:6px 12px 14px;font-size:15px}
  :root[data-theme="dark"] .side .side-brand{color:var(--ink)}
  .tabbar{display:none}
  .content{padding:24px 28px 48px}
}
/* ---------- common ---------- */
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.01em}
h2{font-size:16px;margin:22px 0 10px;color:var(--ink-2);font-weight:700}
.sub{color:var(--ink-3);font-size:13px;margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.b{font-weight:700}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.st-lead{background:var(--info-soft);color:var(--info);border-color:transparent}
.st-inspection{background:var(--info-soft);color:var(--info);border-color:transparent}
.st-proposal{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.st-accepted{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.st-scheduled{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.st-inprogress{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.st-done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.st-invoiced{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.st-paid{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:650;cursor:pointer;text-decoration:none;color:var(--ink);font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn svg{width:16px;height:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .v{font-size:20px;font-weight:800}
.kpi .l{font-size:11.5px;color:var(--ink-3);font-weight:600}
.kpi.alert .v{color:var(--bad)}
.time{font-weight:800;font-size:15px;width:58px;flex:none}
.appt{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.appt .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--accent);flex:none}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 8px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.filters button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.filters .n{opacity:.6;margin-left:4px;font-weight:700}
.jobcard{cursor:pointer}
.money{font-variant-numeric:tabular-nums;font-weight:750}
.hide-crew{} body.crew .hide-crew{display:none!important}
.only-crew{display:none} body.crew .only-crew{display:revert}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0}
.stepper{display:flex;gap:4px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.stepper div{flex:1;min-width:64px;text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-3)}
.stepper div i{display:block;height:6px;border-radius:6px;background:var(--line);margin-bottom:5px}
.stepper div.done i{background:var(--ok)}
.stepper div.cur i{background:var(--accent)}
.stepper div.cur{color:var(--accent)}
.note{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:10px;color:var(--ink-2)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--ink-3);text-decoration:none;font-weight:600;font-size:14px;margin-bottom:6px}
/* measure */
.sec{display:grid;grid-template-columns:1fr 12px 1fr 12px 46px 50px 24px;gap:5px;align-items:center;margin-bottom:8px}
.sec input[type=number]{width:100%;min-width:0;padding:9px 4px;font-size:16px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);text-align:center;font-weight:650}
.sec .x{text-align:center;color:var(--ink-3);font-weight:700}
.sec .tri{display:flex;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--ink-3);border:1px solid var(--line);border-radius:9px;padding:10px 2px;cursor:pointer;user-select:none;background:var(--surface-2)}
.sec .tri.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.sec .del{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:18px}
.sec-head{display:grid;grid-template-columns:1fr 12px 1fr 12px 46px 50px 24px;gap:5px;font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.sec-head span{text-align:center}
.inrow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.inrow{grid-template-columns:repeat(4,1fr)}}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-3);margin-bottom:3px}
.field input,.field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.result{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.result div{background:var(--brand);color:#fff;border-radius:12px;padding:10px;text-align:center}
.result .v{font-size:22px;font-weight:800}
.result .l{font-size:11px;opacity:.8;font-weight:600}
table.mat{width:100%;border-collapse:collapse;font-size:14px}
table.mat td{padding:7px 4px;border-bottom:1px solid var(--line)}
table.mat td:last-child,table.mat td.num{text-align:right;font-variant-numeric:tabular-nums}
table.mat tr.tot td{font-weight:800;border-bottom:0;font-size:15px}
.hint{font-size:12px;color:var(--ink-3);background:var(--surface-2);border-radius:10px;padding:8px 10px;margin-top:10px}
/* schedule */
.week{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:140px}
.day.today{border-color:var(--accent)}
.day h4{margin:0 0 6px;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.day h4 b{display:block;color:var(--ink);font-size:17px;letter-spacing:0}
.slot{font-size:11.5px;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:5px 6px;margin-bottom:5px;cursor:pointer;border-left:3px solid var(--accent)}
.slot b{display:block;font-size:11px;color:var(--accent)}
.slot.new{background:var(--ok-soft);border-left-color:var(--ok)}
.slot.new b{color:var(--ok)}
@media(max-width:700px){.week{grid-template-columns:1fr}.day{min-height:0}.day h4{display:flex;gap:8px;align-items:baseline}.day h4 b{display:inline}}
.sugg{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.sugg.best{border-color:var(--ok);background:var(--ok-soft)}
.sugg .when{font-weight:800;min-width:96px}
.minimap{width:100%;height:auto;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
/* search */
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.searchbox input{border:0;outline:0;background:transparent;flex:1;font-size:16px}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 28px}
@media(min-width:760px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sheet-head h3{margin:0;font-size:17px}
.x-btn{margin-left:auto;border:0;background:var(--surface);border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:18px;color:var(--ink-2)}
/* proposal doc */
.doc{background:#fff;color:#1d2430;border-radius:6px;box-shadow:0 2px 20px rgba(0,0,0,.12);padding:28px 26px;font-size:13px;max-width:680px;margin:0 auto}
.doc .dh{display:flex;justify-content:space-between;gap:12px;border-bottom:3px solid #1f3a5f;padding-bottom:12px;margin-bottom:14px;flex-wrap:wrap}
.doc .dn{font-weight:900;letter-spacing:.07em;font-size:20px;color:#1f3a5f}
.doc .dn span{color:#c4672a}
.doc .dt{font-size:11px;color:#5a6372;letter-spacing:.03em}
.doc h5{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7b8392;margin:14px 0 4px}
.doc table{width:100%;border-collapse:collapse}
.doc td{padding:7px 0;border-bottom:1px solid #e7e2da;vertical-align:top}
.doc td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.doc .total td{font-weight:900;font-size:15px;border-bottom:0;color:#1f3a5f}
@media(max-width:520px){.doc .dh>div:last-child{text-align:left!important}}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:26px}
.doc .sig div{border-top:1px solid #9aa1ad;padding-top:4px;font-size:11px;color:#5a6372}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-weight:650;font-size:14px;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.demo-flag{font-size:11px;color:var(--ink-3);text-align:center;margin-top:28px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.photos div{aspect-ratio:1;border-radius:8px;background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 8px,var(--line) 8px,var(--line) 9px);display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:11px;font-weight:700}
.two{display:grid;gap:12px}
@media(min-width:760px){.photos{grid-template-columns:repeat(6,1fr)}}
@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
.empty{color:var(--ink-3);text-align:center;padding:20px}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <div class="main">
    <header class="topbar">
      <div class="brand">
        <div class="name">H <span>&amp;</span> L ROOFERS</div>
        <div class="tag">HONEST &amp; LOYAL · VIRGINIA</div>
      </div>
      <div class="top-controls">
        <div class="seg" id="langSeg"><button data-lang="en" class="on">EN</button><button data-lang="es">ES</button></div>
        <div class="seg" id="roleSeg"><button data-role="office" class="on" data-i18n="office">Office</button><button data-role="crew" data-i18n="crew">Crew</button></div>
      </div>
    </header>
    <div class="content" id="view"></div>
  </div>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

let SECTIONS=[{l:28,w:16,n:2,tri:false},{l:15,w:11,n:2,tri:false},{l:9,w:8,n:1,tri:true},{l:39,w:21,n:1,tri:false}];
let M={waste:5,ridge:52,eaves:96,rakes:88,valleys:24,b15:3,b2:2,b3:1,vents:4,ply:4,laborSq:130,hlPct:15};
const PRICE={bundle:38,ridge:62,starter:55,ice:95,felt:110,nails:48,boot:14,vent:28,ply:42};
function calcMeasure(){
  const sqft=SECTIONS.reduce((s,x)=>s+(+x.l||0)*(+x.w||0)*(+x.n||0)*(x.tri?0.5:1),0);
  const withWaste=sqft*(1+M.waste/100);
  const squares=Math.ceil(withWaste/100*3)/3;
  const items=[
    ["Shingles (bundles)",Math.ceil(squares*3),PRICE.bundle],
    ["Ridge cap (bundles)",Math.ceil(M.ridge/25),PRICE.ridge],
    ["Starter strip (bundles)",Math.ceil((+M.eaves+ +M.rakes)/100),PRICE.starter],
    ["Ice & water (rolls)",Math.ceil((+M.eaves+ +M.valleys)/66),PRICE.ice],
    ["Synthetic felt (rolls)",Math.ceil(squares/10),PRICE.felt],
    ["Coil nails (boxes)",Math.ceil(squares/15),PRICE.nails],
    [t("boots15"),+M.b15,PRICE.boot],[t("boots2"),+M.b2,PRICE.boot],[t("boots3"),+M.b3,PRICE.boot+6],
    [t("vents"),+M.vents,PRICE.vent],[t("plywood"),+M.ply,PRICE.ply],
  ].filter(r=>r[1]>0);
  const mat=items.reduce((s,r)=>s+r[1]*r[2],0);
  const labor=squares*M.laborSq;
  const hl=(mat+labor)*M.hlPct/100;
  return {sqft,withWaste,squares,items,mat,labor,hl,total:mat+labor+hl};
}
function viewMeasure(){
  const r=calcMeasure();
  const num=(k,lab)=>`<div class="field"><label>${lab}</label><input type="number" inputmode="decimal" value="${M[k]}" oninput="M['${k}']=+this.value;updMeasure()"></div>`;
  return `
  <h1>${t("measureTitle")}</h1>
  <p class="sub">Denise Wyckoff · 2309 Grove Ave — ${t("measureSub")}</p>
  <div class="card">
    <div class="sec-head"><span>${t("length")}</span><span></span><span>${t("width")}</span><span></span><span>${t("count")}</span><span>${t("tri")}</span><span></span></div>
    <div id="secs">${SECTIONS.map((s,i)=>`
      <div class="sec">
        <input type="number" inputmode="decimal" value="${s.l}" oninput="SECTIONS[${i}].l=+this.value;updMeasure()">
        <span class="x">×</span>
        <input type="number" inputmode="decimal" value="${s.w}" oninput="SECTIONS[${i}].w=+this.value;updMeasure()">
        <span class="x">×</span>
        <input type="number" inputmode="numeric" value="${s.n}" oninput="SECTIONS[${i}].n=+this.value;updMeasure()">
        <div class="tri ${s.tri?"on":""}" onclick="SECTIONS[${i}].tri=!SECTIONS[${i}].tri;render()">◺ ½</div>
        <button class="del" onclick="SECTIONS.splice(${i},1);render()" aria-label="remove">×</button>
      </div>`).join("")}
    </div>
    <div class="row" style="justify-content:space-between;margin-top:4px">
      <button class="btn sm" onclick="SECTIONS.push({l:10,w:10,n:1,tri:false});render()">${t("addSection")}</button>
      <div class="field" style="width:120px"><label>${t("waste")}</label><input type="number" value="${M.waste}" oninput="M.waste=+this.value;updMeasure()"></div>
    </div>
    <div class="result" id="mres">${resultHTML(r)}</div>
    <div class="inrow">
      ${num("ridge",t("ridge"))}${num("eaves",t("eaves"))}${num("rakes",t("rakes"))}${num("valleys",t("valleys"))}
      ${num("b15",t("boots15"))}${num("b2",t("boots2"))}${num("b3",t("boots3"))}${num("vents",t("vents"))}
      ${num("ply",t("plywood"))}
    </div>
  </div>
  <div class="two" style="margin-top:12px">
    <div class="card"><div class="b" style="margin-bottom:6px">${t("matList")}</div><div id="mlist">${matHTML(r)}</div></div>
    <div class="card hide-crew">
      <div class="b" style="margin-bottom:6px">${t("pricing")}</div>
      <div class="inrow" style="grid-template-columns:1fr 1fr">
        ${num("laborSq",t("laborPerSq"))}${num("hlPct",t("hl")+" %")}
      </div>
      <div id="mprice" style="margin-top:8px">${priceHTML(r)}</div>
      <button class="btn primary" style="width:100%;margin-top:10px" onclick="openProposal('26-112')">${ICONS.doc}${t("makeProposal")}</button>
    </div>
  </div>
  <p class="hint">${t("factorsHint")}</p>`;
}
const resultHTML=r=>`<div><div class="v">${Math.round(r.sqft).toLocaleString()}</div><div class="l">${t("sqft")}</div></div><div><div class="v">${r.squares.toFixed(1)}</div><div class="l">${t("squares")} (+${M.waste}%)</div></div><div><div class="v">${Math.ceil(r.squares*3)}</div><div class="l">${t("bundles")}</div></div>`;
const matHTML=r=>`<table class="mat">${r.items.map(i=>`<tr><td>${esc(i[0])}</td><td class="num">${i[1]}</td><td class="hide-crew">${money(i[1]*i[2])}</td></tr>`).join("")}</table>`;
const priceHTML=r=>`<table class="mat"><tr><td>${t("materialCost")}</td><td>${money(r.mat)}</td></tr><tr><td>${t("labor")} (${r.squares.toFixed(1)} sq × $${M.laborSq})</td><td>${money(r.labor)}</td></tr><tr><td>${t("hl")} (${M.hlPct}%)</td><td>${money(r.hl)}</td></tr><tr class="tot"><td>${t("total")}</td><td>${money(Math.round(r.total/5)*5)}</td></tr></table>`;
function updMeasure(){const r=calcMeasure();$("#mres").innerHTML=resultHTML(r);$("#mlist").innerHTML=matHTML(r);const p=$("#mprice");if(p)p.innerHTML=priceHTML(r)}

/* ---------- Schedule ---------- */
let NEW_JOB="26-123", BOOKED=null;
const SLOTS=["08:00","10:00","13:00","15:00"];
function weekDays(){const out=[];let d=new Date(TODAY);while(out.length<6){if(d.getDay()!==0)out.push(new Date(d));d.setDate(d.getDate()+1)}return out}
function suggestions(job){
  const days=weekDays(); const res=[];
  days.forEach(day=>{
    const on=JOBS.filter(j=>j.day&&iso(j.day)===iso(day)&&j.id!==job.id);
    const mins=x=>{const[h,m]=x.split(":").map(Number);return h*60+m};
    const clash=s=>on.some(j=>Math.abs(mins(j.time)-mins(s))<120); // each visit blocks ~2 hours
    let near=null;on.forEach(o=>{const m=miles(job,o);if(!near||m<near.m)near={m,j:o}});
    SLOTS.forEach(s=>{
      if(iso(day)===iso(TODAY))return; // don't suggest same-day
      if(clash(s))return;
      const score=near?near.m:40;
      res.push({day,time:s,near,score});
    });
  });
  res.sort((a,b)=>a.score-b.score||a.day-b.day||a.time.localeCompare(b.time));
  // keep the best slot per day, top 4
  const seen=new Set(),top=[];for(const r of res){const k=iso(r.day);if(seen.has(k))continue;seen.add(k);top.push(r);if(top.length===4)break}
  return top;
}
function minimap(job,day){
  const pts=JOBS.filter(j=>j.day&&iso(j.day)===iso(day));
  const all=[...pts,job];
  const lats=all.map(p=>p.lat),lngs=all.map(p=>p.lng);
  const pad=.03,minLat=Math.min(...lats)-pad,maxLat=Math.max(...lats)+pad,minLng=Math.min(...lngs)-pad,maxLng=Math.max(...lngs)+pad;
  const W=320,H=150,X=l=>((l-minLng)/(maxLng-minLng||1))*(W-30)+15,Y=l=>H-(((l-minLat)/(maxLat-minLat||1))*(H-30)+15);
  return `<svg class="minimap" viewBox="0 0 ${W} ${H}" role="img" aria-label="map">
    ${pts.map(p=>`<line x1="${X(job.lng)}" y1="${Y(job.lat)}" x2="${X(p.lng)}" y2="${Y(p.lat)}" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 4"/>`).join("")}
    ${pts.map(p=>`<circle cx="${X(p.lng)}" cy="${Y(p.lat)}" r="7" fill="var(--accent)"/><text x="${X(p.lng)+10}" y="${Y(p.lat)+4}" font-size="11" fill="var(--ink-2)">${esc(p.cust.split(" ")[0])} ${fmtTime(p.time)}</text>`).join("")}
    <circle cx="${X(job.lng)}" cy="${Y(job.lat)}" r="8" fill="var(--ok)" stroke="#fff" stroke-width="2"/><text x="${X(job.lng)+11}" y="${Y(job.lat)+4}" font-size="11" font-weight="700" fill="var(--ok)">${esc(job.cust.split(" ")[0])}</text>
  </svg>`;
}
function viewSchedule(){
  const days=weekDays();
  const job=JOBS.find(j=>j.id===NEW_JOB);
  const sug=suggestions(job);
  const unscheduled=JOBS.filter(j=>!j.day&&["lead","accepted","proposal"].includes(j.status));
  return `
  <h1>${t("schedule")}</h1>
  <p class="sub">${t("weekOf")}</p>
  <div class="week">${days.map(d=>{
    const on=JOBS.filter(j=>j.day&&iso(j.day)===iso(d)).sort((a,b)=>a.time.localeCompare(b.time));
    const isNew=BOOKED&&iso(BOOKED.day)===iso(d);
    return `<div class="day ${iso(d)===iso(TODAY)?"today":""}"><h4>${d.toLocaleDateString(LANG==="es"?"es-US":"en-US",{weekday:"short"})} <b>${d.getDate()}</b></h4>
      ${on.map(j=>`<div class="slot" onclick="location.hash='#job/${j.id}'"><b>${fmtTime(j.time)}</b>${esc(j.cust.split(" ")[0])} · ${t("type."+j.type)}</div>`).join("")}
      ${isNew?`<div class="slot new"><b>${fmtTime(BOOKED.time)} · ${t("booked")}</b>${esc(job.cust)}</div>`:""}
    </div>`}).join("")}
  </div>
  <h2>${t("newAppt")}</h2>
  <div class="card">
    <div class="field"><label>${t("pickJob")}</label>
      <select onchange="NEW_JOB=this.value;BOOKED=null;render()">
        ${unscheduled.map(j=>`<option value="${j.id}" ${j.id===NEW_JOB?"selected":""}>${esc(j.cust)} — ${esc(j.addr)}, ${esc(j.city.split(" VA")[0])} (${t("type."+j.type)})</option>`).join("")}
      </select>
    </div>
    <div class="b" style="margin:14px 0 8px">${t("suggestions")}</div>
    <div class="list">${sug.map((s,i)=>`
      <div class="sugg ${i===0?"best":""}" onclick="BOOKED={day:new Date('${iso(s.day)}T12:00'),time:'${s.time}'};toast(t('bookedMsg'));render()">
        <div class="when">${fmtDay(s.day)}<div class="small muted">${fmtTime(s.time)}</div></div>
        <div class="grow small">${s.near?`<b>${s.near.m.toFixed(1)} ${t("miles")}</b> ${t("nearby")} ${esc(s.near.j.cust)} (${fmtTime(s.near.j.time)})`:t("noNearby")}
          ${i===0?`<div><span class="chip st-done" style="margin-top:4px">${t("best")}</span></div>`:""}</div>
        <span class="btn sm">${t("book")}</span>
      </div>`).join("")}
    </div>
    ${sug[0]?`<div style="margin-top:12px">${minimap(job,sug[0].day)}</div>`:""}
  </div>`;
}

/* ---------- Search ---------- */
let Q="";
function viewSearch(){
  return `
  <h1>${t("search")}</h1>
  <div class="searchbox">${ICONS.search.replace('<svg','<svg style="width:20px;height:20px;color:var(--ink-3)"')}<input id="q" placeholder="${t("searchPh")}" value="${esc(Q)}" oninput="Q=this.value;$('#sres').innerHTML=searchResults()" autocomplete="off"></div>
  <p class="sub" style="margin-top:8px">${t("searchHint")}</p>
  <div id="sres" class="list">${searchResults()}</div>`;
}
function searchResults(){
  const q=Q.trim().toLowerCase(); if(!q) return "";
  const hl=s=>esc(s).replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>");
  const hits=JOBS.filter(j=>[j.cust,j.addr,j.city,j.phone,j.email||"",j.id,t("type."+j.type),j.note||"",j.scope.join(" ")].join(" ").toLowerCase().includes(q));
  if(!hits.length) return `<div class="empty">${t("noResults")}</div>`;
  return `<div class="small muted">${hits.length} ${t("results")}</div>`+hits.map(j=>`
    <div class="card jobcard" onclick="location.hash='#job/${j.id}'">
      <div class="row" style="justify-content:space-between"><div class="b">${hl(j.cust)}</div>${statusChip(j.status)}</div>
      <div class="small muted">${hl(j.addr)}, ${hl(j.city)} · ${hl(j.phone)}</div>
      <div class="small">#${hl(j.id)} · ${hl(t("type."+j.type))}</div>
      ${j.note&&j.note.toLowerCase().includes(q)?`<div class="note" style="margin-top:6px">${hl(j.note.split("\n").find(l=>l.toLowerCase().includes(q))||"")}</div>`:""}
    </div>`).join("");
}

/* ---------- Proposal sheet ---------- */
function openProposal(id){
  const j=JOBS.find(x=>x.id===id);
  const r=calcMeasure();
  const total=j.id==="26-112"?Math.round(r.total/5)*5:j.price;
  const lines=j.id==="26-112"
    ?[[`Complete roof replacement — ${r.squares.toFixed(1)} squares, GAF Timberline HDZ (Charcoal)`,Math.round(r.total/5)*5],["Tear-off to the deck, haul away and magnetic nail sweep","incl."],["Ice & water shield at eaves and valleys, synthetic underlayment","incl."],[`Pipe boots (${M.b15+M.b2+M.b3}), ridge vent, starter and ridge cap`,"incl."],[`Plywood replacement — up to ${M.ply} sheets`,"incl."]]
    :j.scope.map((s,i)=>[s,i===0?j.price:"incl."]);
  $("#sheet").innerHTML=`
    <div class="sheet-head"><h3>${t("proposal")} #${j.id}</h3><button class="x-btn" onclick="closeSheet()" aria-label="close">×</button></div>
    <div class="doc">
      <div class="dh">
        <div><div class="dn">H <span>&amp;</span> L ROOFERS</div><div class="dt">HONEST &amp; LOYAL · VIRGINIA<br>{Company Business Address} · {Company Business Phone Number}<br>{Company Legal Name} · License {Company License Number}</div></div>
        <div style="text-align:right"><div style="font-weight:800;font-size:15px">PROPOSAL #${j.id}</div><div class="dt">${t("date")}: ${TODAY.toLocaleDateString("en-US")}</div></div>
      </div>
      <h5>${t("proposalFor")}</h5>
      <div><b>${esc(j.cust)}</b><br>${esc(j.addr)}, ${esc(j.city)}<br>${j.phone}${j.email?" · "+j.email:""}</div>
      <h5>${t("scopeLines")}</h5>
      <table>${lines.map(l=>`<tr><td>${esc(l[0])}</td><td class="r">${typeof l[1]==="number"?money(l[1]):l[1]}</td></tr>`).join("")}
        <tr class="total"><td>${t("total")}</td><td class="r">${money(total)}</td></tr></table>
      <h5>${t("terms")}</h5>
      <div style="color:#4a5363">${t("termsText")}</div>
      <div class="sig"><div>${t("accept")} — signature / date</div><div>${t("hlSign")} — signature / date</div></div>
    </div>
    <div class="btns" style="justify-content:center;margin-top:14px">
      <button class="btn primary" onclick="toast(t('emailSent'));closeSheet()">${ICONS.mail}${t("sendEmail")}</button>
      <button class="btn" onclick="toast('PDF (demo)')">${ICONS.doc}${t("print")}</button>
    </div>`;
  $("#scrim").classList.add("open");
}
function closeSheet(){$("#scrim").classList.remove("open")}
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet()});

/* ---------- router ---------- */
function render(){
  const h=(location.hash||"#today").slice(1);
  const [name,arg]=h.split("/");
  if(ROLE==="crew"&&["invoiced","paid","proposal"].includes(JOB_FILTER))JOB_FILTER="all";
  renderNav(TABS.includes(name)?name:(name==="job"?"jobs":"today"));
  const v=$("#view");
  v.innerHTML = name==="jobs"?viewJobs(): name==="job"?viewJob(arg): name==="measure"?viewMeasure(): name==="schedule"?viewSchedule(): name==="search"?viewSearch(): viewToday();
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.documentElement.lang=LANG;
  if(name==="search"){const q=$("#q");q&&q.focus();}
}
window.addEventListener("hashchange",()=>{closeSheet();render();window.scrollTo(0,0)});
$("#langSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;LANG=b.dataset.lang;document.querySelectorAll("#langSeg button").forEach(x=>x.classList.toggle("on",x===b));render()});
$("#roleSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;ROLE=b.dataset.role;document.body.classList.toggle("crew",ROLE==="crew");document.querySelectorAll("#roleSeg button").forEach(x=>x.classList.toggle("on",x===b));render()});
render();
</script>
