/* =====================================================================
   DOCUMENTS: the proposal, change orders, the invoice and receipts, as they
   would print or email. Business details show as placeholders until Admin
   fills them in. A document is kept exactly as it was at the moment that
   matters (a proposal or change order when it is signed, an invoice when it
   is sent, a receipt when the payment is recorded), in the customer's
   language, with the business's details as they were then.
   ===================================================================== */
const CO_BLANK = { legal: "{Company Legal Name}", license: "{Company License Number}", address: "{Company Business Address}", phone: "{Company Business Phone Number}" };
const co = (k, firm) => (firm || S.company)[k] || CO_BLANK[k];
const firmNow = () => ({ ...S.company });
// draw something in another language (a kept copy is in the customer's language), then switch back
function inLang(lang, fn) { const keep = S.lang; S.lang = lang || keep; try { return fn(); } finally { S.lang = keep; } }

// the paper: always white, even when the screen is in dark mode
const docWrap = html => `<div class="card shadow-sm" data-bs-theme="light"><div class="card-body p-3 p-sm-4">${html}</div></div>`;
const docHead = (title, num, date, firm) =>
  `<div class="d-flex flex-wrap justify-content-between gap-2 border-bottom border-3 border-dark pb-2 mb-3">` +
  `<div>${(firm || S.company).logo ? `<img src="${(firm || S.company).logo}" alt="" class="d-block mb-2" style="max-height: 3.5rem; max-width: 12rem">` : ""}<div class="fs-5 fw-bolder">${esc((co("name", firm) || "").toUpperCase()).replace(/&amp;/g, '<span class="text-primary">&amp;</span>')}</div>` +
  `<div class="small text-body-secondary">${esc(co("legal", firm))} · ${tt("docs.license")} ${esc(co("license", firm))}<br>${esc(co("address", firm))} · ${esc(co("phone", firm))}</div></div>` +
  `<div class="text-sm-end"><div class="fw-bold text-uppercase">${esc(title)} #${esc(num)}</div><div class="small text-body-secondary">${tt("docs.date")}: ${esc(fmtDate(date))}</div></div></div>`;
const docLabel = text => `<div class="small text-uppercase text-body-secondary fw-semibold">${esc(text)}</div>`;
const signedMoney = n => (n < 0 ? "−" + money(-n) : money(n));
// a line: [what, amount, quantity, price for each, unit]. "GAF Timberline HDZ shingles — 50 × $22 per bundle"
const qtyText = q => String(+(+q).toFixed(3));
const unitWord = u => t("unit." + u);
const lineText = l => l[0] + (l[2] && l[3] != null ? ` — ${qtyText(l[2])} × ${money(l[3])}` + (l[4] && l[4] !== "each" ? " " + t("docs.per") + " " + unitWord(l[4]) : "") : "");
function docLines(lines, totals) {
  return `<table class="table table-sm mb-0"><tbody>` +
    lines.map(l => `<tr><td>${esc(lineText(l))}</td><td class="text-end text-nowrap">${l[1] == null ? tt("included") : signedMoney(l[1])}</td></tr>`).join("") +
    totals.map((r, i) => `<tr class="${i === totals.length - 1 ? "fw-bold fs-6" : ""}"><td class="${i === 0 ? "border-top border-dark" : ""}">${esc(r[0])}</td><td class="text-end text-nowrap${i === 0 ? " border-top border-dark" : ""}">${signedMoney(r[1])}</td></tr>`).join("") +
    `</tbody></table>`;
}
const keptNote = (kept, key) => `<div class="alert alert-secondary py-2 small mb-2">${ic("shield")} ${tt(key, { d: fmtDate(kept.d) })} ${tt("docs.keptLang", { lang: t("langName." + kept.lang) })}</div>`;
ACT.pdfDemo = () => toast(t("docs.pdfDemo"));

/* ------------------------------ PROPOSAL ------------------------------ */
// Step 1: build it. A line is typed in, or comes from the Price Book at today's price. With a quantity and a
// price for each, the amount is worked out: 50 × $22 = $1,100. The app works it out again when it is saved.
let DRAFT = null;
const draftTotal = () => DRAFT.lines.reduce((s, l) => s + (Number(l.amount) || 0), 0);
const num = s => { const n = parseFloat(String(s ?? "").replace(/[^0-9.\-]/g, "")); return isNaN(n) ? null : n; };
ACT.oppProposal = d => {
  const o = oppOf(d.id);
  DRAFT = { id: o.id, lines: o.lines.map(l => ({ text: l[0], amount: l[1], qty: l[2] ?? null, each: l[3] ?? null, unit: l[4] || "" })) };
  if (!DRAFT.lines.length) DRAFT.lines.push({ text: "", amount: null, qty: null, each: null, unit: "" });
  showBuilder();
};
function showBuilder(focus) {
  const o = oppOf(DRAFT.id);
  const rows = DRAFT.lines.map((l, i) => {
    const worked = l.qty != null && l.each != null;
    return `<div class="row g-2 mb-2 align-items-center">` +
      `<div class="col-12 col-md"><input class="form-control form-control-sm" value="${esc(l.text)}" data-input="draftEdit" data-i="${i}" data-k="text" aria-label="${tt("docs.lineWhat")}"></div>` +
      `<div class="col-4 col-md-2"><div class="input-group input-group-sm"><input class="form-control" id="qty_${i}" inputmode="decimal" value="${l.qty ?? ""}" placeholder="—" data-input="draftEdit" data-i="${i}" data-k="qty" aria-label="${tt("docs.qty")}">${l.unit ? `<span class="input-group-text">${esc(unitWord(l.unit))}</span>` : ""}</div></div>` +
      `<div class="col-4 col-md-2"><div class="input-group input-group-sm"><span class="input-group-text">$</span><input class="form-control" inputmode="decimal" value="${l.each ?? ""}" data-input="draftEdit" data-i="${i}" data-k="each" aria-label="${tt("docs.each")}"></div></div>` +
      `<div class="col-3 col-md-2"><div class="input-group input-group-sm"><span class="input-group-text">$</span><input class="form-control${worked ? " bg-body-tertiary" : ""}" id="amt_${i}" inputmode="decimal" value="${l.amount ?? ""}" placeholder="${tt("included")}" data-input="draftEdit" data-i="${i}" data-k="amount"${worked ? " readonly" : ""} aria-label="${tt("docs.lineAmount")}"></div></div>` +
      `<div class="col-1 col-md-auto"><button type="button" class="btn btn-sm btn-outline-secondary" data-act="draftDel" data-i="${i}" aria-label="${tt("docs.removeLine")}">×</button></div></div>`;
  }).join("");
  const book = `<select class="form-select form-select-sm w-auto" data-change="draftFromBook" aria-label="${tt("docs.fromBook")}"><option value="">${tt("docs.fromBook")}</option>` +
    PRICE.map(it => `<option value="${it.code}">${esc(it.name)} · ${money(it.price)}/${tt("unit." + it.unit)}</option>`).join("") + `</select>`;
  openModal(modalShell(`${tt("opps.proposal")} #${o.id}`,
    `<p class="small text-body-secondary">${esc(acct(o.acct).name)} · ${esc(addrLine(placeOf(o)))}</p>` +
    `<div class="row g-2 small fw-semibold text-body-secondary mb-1 d-none d-md-flex"><div class="col">${tt("docs.lineWhat")}</div><div class="col-2">${tt("docs.qty")}</div><div class="col-2">${tt("docs.each")}</div><div class="col-2">${tt("docs.lineAmount")}</div><div class="col-auto invisible"><span class="btn btn-sm">×</span></div></div>` + rows +
    `<div class="d-flex flex-wrap gap-2 align-items-center mt-2"><button type="button" class="btn btn-sm btn-outline-secondary" data-act="draftAdd">${ic("plus")} ${tt("docs.addLine")}</button>${book}` +
    `<div class="ms-auto fw-bold">${tt("total")}: <span id="draftTotal">${money(draftTotal())}</span></div></div>` +
    `<div class="form-text mt-2">${tt("docs.builderHint")}</div>`,
    cancelBtn() + `<button type="button" class="btn btn-primary" data-act="draftPreview">${tt("docs.preview")}</button>`), "lg");
  if (focus != null) setTimeout(() => { const el = document.getElementById("qty_" + focus); if (el) { el.focus(); el.select(); } }, 350);
}
ACT.draftEdit = (d, el) => {
  const i = +d.i, line = DRAFT.lines[i];
  if (d.k === "text") line.text = el.value; else line[d.k] = num(el.value);
  const amt = document.getElementById("amt_" + i), worked = line.qty != null && line.each != null;
  if (worked) { line.amount = Math.round(line.qty * line.each * 100) / 100; amt.value = line.amount; }
  amt.readOnly = worked; amt.classList.toggle("bg-body-tertiary", worked);
  $("#draftTotal").textContent = money(draftTotal());
};
ACT.draftAdd = () => { DRAFT.lines.push({ text: "", amount: null, qty: null, each: null, unit: "" }); showBuilder(); };
ACT.draftDel = d => { DRAFT.lines.splice(+d.i, 1); showBuilder(); };
ACT.draftFromBook = (d, el) => {
  const it = PRICE.find(x => x.code === el.value); if (!it) return;
  DRAFT.lines.push({ text: it.name, qty: 1, each: it.price, amount: it.price, unit: it.unit });
  showBuilder(DRAFT.lines.length - 1);                // the cursor goes to the quantity, ready to type 50
};
ACT.draftPreview = () => {
  const o = oppOf(DRAFT.id), lines = DRAFT.lines.filter(l => l.text.trim());
  const bad = lines.find(l => (l.qty != null && (l.qty <= 0 || l.each == null)));
  if (bad) { toast(t("docs.qtyNeedsEach")); return; }
  if (!lines.length || !(draftTotal() > 0)) { toast(t("docs.needPrice")); return; }
  o.lines = lines.map(l => [l.text.trim(), l.amount, l.qty, l.each, l.unit]); o.total = draftTotal();
  if (o.stage === "proposal") addLog(o, "log.proposalChanged");
  showProposal(o);
};

// Step 2: the proposal as the customer gets it. Once signed, it is drawn from its kept copy.
function proposalBody(o, kept) {
  const a = acct(o.acct), p = placeOf(o), c = a.contacts[0], lines = kept ? kept.lines : o.lines, total = kept ? kept.total : o.total;
  return docHead(t("docs.proposal"), o.id, o.sentOn || new Date(), kept && kept.firm) +
    docLabel(t("docs.for")) + `<div class="mb-3"><span class="fw-semibold">${esc(a.name)}</span><br>${esc(addrLine(p))}<br>${esc(c.phone)}${c.email ? " · " + esc(c.email) : ""}</div>` +
    docLines(lines, [[t("total"), total]]) +
    `<div class="mt-3">${docLabel(t("docs.terms"))}<div class="small">${tt("docs.termsText")}</div></div>`;
}
const signLines = (who, firm) => `<div class="row g-4 mt-3 small text-body-secondary"><div class="col-6"><div class="border-top border-secondary pt-1">${tt("docs.custSign")}${who ? ": " + esc(who) : ""}</div></div>` +
  `<div class="col-6"><div class="border-top border-secondary pt-1">${esc(co("legal", firm))}</div></div></div>`;
function showProposal(o) {
  const canSend = oppOpen(o) && !isCrew(), email = acct(o.acct).contacts[0].email, job = jobOf(o.id), kept = o.kept;
  const doc = kept ? keptNote(kept, "docs.keptSigned") + inLang(kept.lang, () => docWrap(proposalBody(o, kept) + signLines(o.signedBy, kept.firm)))
    : docWrap(proposalBody(o) + signLines(o.signedBy));
  openModal(modalShell(`${tt("opps.proposal")} #${o.id}`, doc + (o.signedHow === "paper" ? papersBlock(job, "signedProposal") : ""),
    (canSend ? `<button type="button" class="btn btn-outline-secondary" data-act="oppProposal" data-id="${o.id}">${ic("edit")} ${tt("docs.edit")}</button>` : "") +
    `<button type="button" class="btn btn-outline-secondary" data-act="pdfDemo">${ic("download")} ${tt("docs.pdf")}</button>` +
    (canSend ? `<button type="button" class="btn btn-primary" data-act="proposalSend" data-id="${o.id}"${email ? "" : " disabled"}>${ic("mail")} ${tt(o.stage === "proposal" ? "docs.emailAgain" : "docs.email")}</button>` : "")), "lg");
}
ACT.oppView = d => showProposal(oppOf(d.id));
ACT.proposalSend = d => {
  const o = oppOf(d.id);
  o.stage = "proposal"; o.sentOn = new Date(); addLog(o, "log.proposalSent");
  closeModal(); toast(t("docs.emailed", { email: acct(o.acct).contacts[0].email })); render();
};
// kept when it is signed, in the customer's language
const keepProposal = o => { o.kept = { d: new Date(), lang: acct(o.acct).lang, firm: firmNow(), lines: o.lines.map(l => l.slice()), total: o.total }; };
OPPS.filter(o => o.stage === "won").forEach(o => { keepProposal(o); o.kept.d = o.signedOn; });

// Step 3: what the customer sees when they tap the link in the email. Accepting signs the proposal.
ACT.oppAccept = d => {
  const o = oppOf(d.id), a = acct(o.acct);
  openModal(modalShell(tt("docs.acceptTitle"),
    `<div class="alert alert-info py-2 small">${tt("docs.acceptExplain", { name: a.name })}</div>` + docWrap(proposalBody(o) +
      `<div class="mt-3">${docLabel(t("docs.acceptLabel"))}</div>` +
      `<input class="form-control my-2" id="accName" placeholder="${tt("docs.acceptName")}" autocomplete="off">` +
      `<button type="button" class="btn btn-primary w-100" data-act="acceptConfirm" data-id="${o.id}">${ic("check")} ${tt("docs.acceptBtn")}</button>` +
      `<div class="form-text">${tt("docs.acceptNote")}</div>`), ""), "lg");
};
ACT.acceptConfirm = d => {
  const name = val("accName");
  if (!name) { $("#accName").classList.add("is-invalid"); return; }
  const o = oppOf(d.id); o.signedBy = name;
  const j = signOpp(o, "link");
  closeModal(); toast(t("opps.jobCreated", { id: j.id })); go("#job/" + j.id);
};

/* ------------------------------ CHANGE ORDER ------------------------------ */
// Work added or taken off after signing. It is a document of its own, with its own Accept page; it counts once signed.
function coBody(j, c, kept) {
  const a = acct(j.acct), p = placeOf(j), before = kept ? kept.before : jobTotal(j) - (c.status === "signed" ? c.amount : 0);
  return docHead(t("docs.changeOrder"), j.id + " · " + c.id, c.d, kept && kept.firm) +
    docLabel(t("docs.for")) + `<div class="mb-3"><span class="fw-semibold">${esc(a.name)}</span><br>${esc(addrLine(p))}<br>${tt("docs.perProposal", { id: j.id, type: t("type." + j.type) })}</div>` +
    docLines([[c.text, c.amount]], [[t("docs.coBefore"), before], [t("docs.coThis"), c.amount], [t("docs.coAfter"), before + c.amount]]) +
    `<div class="mt-3">${docLabel(t("docs.terms"))}<div class="small">${tt("docs.coTerms")}</div></div>`;
}
function showChangeOrder(j, c) {
  const office = !isCrew(), open = c.status !== "signed", kept = c.kept;
  const doc = kept ? keptNote(kept, "docs.keptSigned") + inLang(kept.lang, () => docWrap(coBody(j, c, kept) + signLines(c.signedBy, kept.firm)))
    : docWrap(coBody(j, c) + signLines(c.signedBy));
  const b = (act, icon, label, cls, extra) => `<button type="button" class="btn ${cls || "btn-outline-secondary"}" data-act="${act}" data-id="${j.id}" data-co="${c.id}" ${extra || ""}>${ic(icon)} ${esc(label)}</button>`;
  openModal(modalShell(`${tt("docs.changeOrder")} ${c.id} · #${j.id}`, `<div class="small mb-2">${badge(t("co." + c.status), open ? "warning" : "success")}${c.signedOn ? " · " + esc(fmtDate(c.signedOn)) : ""}${c.signedBy ? " · " + esc(c.signedBy) : ""}</div>` +
      doc + papersBlock(j, "signedCO", c.id),
    (office && can("delete") ? `<button type="button" class="btn btn-outline-danger me-auto" data-act="askDelete" data-kind="co" data-id="${j.id}:${c.id}">${ic("trash")} ${tt("bin.delete")}</button>` : "") +
    (office && open && mayEdit("co") ? b("editCo", "edit", t("docs.edit")) : "") +
    b("pdfDemo", "download", t("docs.pdf")) +
    (office && open ? b("coAccept", "link", t("opps.acceptPage")) + b("coSign", "check", t("money.coMarkSigned")) + b("coEmail", "mail", t("docs.email"), "btn-primary") : "")), "lg");
}
ACT.coView = d => { const j = jobOf(d.id); showChangeOrder(j, j.cos.find(c => c.id === d.co)); };
ACT.coEmail = d => { const j = jobOf(d.id); addLog(j, "log.coEmailed", { id: d.co }); closeModal(); toast(t("docs.emailed", { email: acct(j.acct).contacts[0].email })); render(); };
ACT.coAccept = d => {
  const j = jobOf(d.id), c = j.cos.find(x => x.id === d.co), a = acct(j.acct);
  openModal(modalShell(tt("docs.coAcceptTitle"),
    `<div class="alert alert-info py-2 small">${tt("docs.acceptExplain", { name: a.name })}</div>` + docWrap(coBody(j, c) +
      `<div class="mt-3">${docLabel(t("docs.coAcceptLabel"))}</div>` +
      `<input class="form-control my-2" id="coAccName" placeholder="${tt("docs.acceptName")}" autocomplete="off">` +
      `<button type="button" class="btn btn-primary w-100" data-act="coAcceptConfirm" data-id="${j.id}" data-co="${c.id}">${ic("check")} ${tt("docs.coAcceptBtn")}</button>`), ""), "lg");
};
function signCo(j, c, how, who) {
  c.kept = { d: new Date(), lang: acct(j.acct).lang, firm: firmNow(), before: jobTotal(j) };
  c.status = "signed"; c.signedOn = new Date(); c.signedBy = who || ""; c.how = how;
  addLog(j, "log.coSigned", { id: c.id });
  recheckPaid(j);
}
ACT.coAcceptConfirm = d => {
  const name = val("coAccName");
  if (!name) { $("#coAccName").classList.add("is-invalid"); return; }
  const j = jobOf(d.id); signCo(j, j.cos.find(c => c.id === d.co), "link", name);
  closeModal(); toast(t("log.coSigned", { id: d.co })); render();
};

/* ------------------------------ INVOICE ------------------------------ */
const payLabel = x => `${fmtDate(x.d)} · ${t("pay." + x.kind)} · ${t("method." + x.method)}${x.num ? " #" + x.num : ""}`;
function invoiceLines(j) {
  const out = [[t("docs.perProposal", { id: j.id, type: t("type." + j.type) }), j.price]];
  (j.cos || []).filter(c => c.status === "signed").forEach(c => out.push([t("money.co") + " " + c.id + ": " + c.text, c.amount]));
  return out;
}
function invoiceBody(j, firm, date) {
  const a = acct(j.acct), p = placeOf(j), c = a.contacts[0], pays = j.payments || [];
  const totals = [[t("total"), jobTotal(j)], ...pays.map(x => [payLabel(x) + " · R" + x.n, -x.amount]), [t("money.balance"), balance(j)]];
  return docHead(t("docs.invoice"), j.id, date, firm) +
    `<div class="row g-3 mb-3"><div class="col-sm-6">${docLabel(t("docs.billTo"))}<span class="fw-semibold">${esc(a.name)}</span><br>${esc(c.phone)}${c.email ? "<br>" + esc(c.email) : ""}</div>` +
    `<div class="col-sm-6">${docLabel(t("docs.workAt"))}${esc(addrLine(p))}${p.site ? "<br>" + esc(p.site.name) : ""}${j.ref ? "<br>" + tt("ref." + j.ref.type) + " " + esc(j.ref.num) : ""}</div></div>` +
    docLines(invoiceLines(j), totals) +
    `<div class="mt-3">${docLabel(t("docs.terms"))}<div class="small">${tt("docs.invoiceTerms")}</div></div>`;
}
function showInvoice(j) {
  const doc = docWrap(invoiceBody(j, null, j.invoice ? j.invoice.d : new Date()));
  const canSend = !isCrew() && !j.invoice && j.stage === "done";
  openModal(modalShell(`${tt("docs.invoice")} #${j.id}`, doc,
    (j.invoice && j.invoice.kept ? `<button type="button" class="btn btn-outline-secondary me-auto" data-act="invoiceKept" data-id="${j.id}">${ic("shield")} ${tt("docs.asSent")}</button>` : "") +
    `<button type="button" class="btn btn-outline-secondary" data-act="pdfDemo">${ic("download")} ${tt("docs.pdf")}</button>` +
    (canSend ? `<button type="button" class="btn btn-primary" data-act="invoiceSend" data-id="${j.id}">${ic("mail")} ${tt("docs.sendInvoice")}</button>` : "") +
    (!canSend && canTakePayment(j) ? `<button type="button" class="btn btn-primary" data-act="payAdd" data-id="${j.id}">${ic("dollar")} ${tt("money.record")}</button>` : "")), "lg");
}
ACT.jobInvoice = d => showInvoice(jobOf(d.id));
// the invoice exactly as it was sent: its own words and amounts, in the customer's language
ACT.invoiceKept = d => {
  const j = jobOf(d.id), k = j.invoice.kept;
  openModal(modalShell(`${tt("docs.invoice")} #${j.id} · ${tt("docs.asSent")}`, keptNote(k, "docs.keptSent") + inLang(k.lang, () => docWrap(k.html())),
    `<button type="button" class="btn btn-outline-secondary" data-act="jobInvoice" data-id="${j.id}">‹ ${tt("docs.liveInvoice")}</button><button type="button" class="btn btn-outline-secondary" data-act="pdfDemo">${ic("download")} ${tt("docs.pdf")}</button>`), "lg");
};
function keepInvoice(j) {
  const firm = firmNow(), snap = { ...j, payments: (j.payments || []).map(p => ({ ...p })), cos: (j.cos || []).map(c => ({ ...c })) }, date = j.invoice.d;
  j.invoice.kept = { d: date, lang: acct(j.acct).lang, firm, html: () => invoiceBody(snap, firm, date) };
}
ACT.invoiceSend = d => {
  const j = jobOf(d.id);
  j.invoice = { d: new Date() }; keepInvoice(j); j.stage = "invoiced"; addLog(j, "log.invoiced");
  if (balance(j) <= 0) { j.stage = "paid"; addLog(j, "log.paid"); }
  closeModal(); toast(t("docs.emailed", { email: acct(j.acct).contacts[0].email })); render();
};

/* ------------------------------ RECEIPT ------------------------------ */
// Every payment has a receipt: R1, R2 ... on its job. A number is never used twice, even after a delete.
function receiptBody(j, p, k) {
  const a = acct(j.acct);
  return docHead(t("docs.receipt"), j.id + " · R" + p.n, p.d, k.firm) +
    `<div class="row g-3 mb-3"><div class="col-sm-6">${docLabel(t("docs.receivedFrom"))}<span class="fw-semibold">${esc(a.name)}</span><br>${esc(a.contacts[0].phone)}</div>` +
    `<div class="col-sm-6">${docLabel(t("docs.forJob"))}#${esc(j.id)} · ${tt("type." + j.type)}<br>${esc(addrLine(placeOf(j)))}</div></div>` +
    docLines([[payLabel(p), p.amount]], [[t("docs.jobTotal"), k.total], [t("docs.paidSoFar"), k.paid], [t("money.balance"), k.total - k.paid]]) +
    `<div class="mt-3 small">${tt("docs.thanks")}</div>`;
}
const keepReceipt = (j, p) => { p.kept = { d: p.d, lang: acct(j.acct).lang, firm: firmNow(), total: jobTotal(j), paid: (j.payments || []).filter(x => x.n <= p.n).reduce((s, x) => s + x.amount, 0) }; };
function showReceipt(j, p) {
  const k = p.kept, office = !isCrew();
  openModal(modalShell(`${tt("docs.receipt")} #${j.id} · R${p.n}`, keptNote(k, "docs.keptReceipt") + inLang(k.lang, () => docWrap(receiptBody(j, p, k))),
    `<button type="button" class="btn btn-outline-secondary" data-act="pdfDemo">${ic("download")} ${tt("docs.pdf")}</button>` +
    (office ? `<button type="button" class="btn btn-primary" data-act="receiptEmail" data-id="${j.id}" data-n="${p.n}">${ic("mail")} ${tt("docs.emailReceipt")}</button>` : "")), "lg");
}
ACT.receiptView = d => { const j = jobOf(d.id); showReceipt(j, j.payments.find(p => p.n === +d.n)); };
ACT.receiptEmail = d => { const j = jobOf(d.id); addLog(j, "log.receiptEmailed", { n: d.n }); closeModal(); toast(t("docs.emailed", { email: acct(j.acct).contacts[0].email })); render(); };

/* ------------------------------ THE DOCUMENTS LIST ------------------------------ */
// On an account (all of its work) and on a job (its own). The job's crew can open its job's documents.
function docRows(opps, jobs) {
  const rows = [], add = (kind, number, about, status, tone, d, amount, open) => rows.push({ kind, number, about, status, tone, d, amount, open });
  opps.forEach(o => {
    if (o.stage === "inspection" || !o.total) return;
    const open = `data-act="oppView" data-id="${o.id}"`;
    if (o.stage === "won") add(t("docs.proposal"), "#" + o.id, t("type." + o.type), t("docs.signedOn", { d: fmtDate(o.signedOn) }), "success", o.signedOn, o.total, open);
    else if (o.stage === "lost") add(t("docs.proposal"), "#" + o.id, t("type." + o.type), t("docs.notAccepted"), "secondary", o.lostOn || o.sentOn, o.total, open);
    else add(t("docs.proposal"), "#" + o.id, t("type." + o.type), t("docs.sentOn", { d: fmtDate(o.sentOn) }), "warning", o.sentOn, o.total, open);
  });
  jobs.forEach(j => {
    (j.cos || []).forEach(c => add(t("docs.changeOrder"), "#" + j.id + " · " + c.id, c.text, c.status === "signed" ? t("docs.signedOn", { d: fmtDate(c.signedOn || c.d) }) : t("co.sent"),
      c.status === "signed" ? "success" : "warning", c.signedOn || c.d, c.amount, `data-act="coView" data-id="${j.id}" data-co="${c.id}"`));
    (j.payments || []).forEach(p => add(t("docs.receipt"), "#" + j.id + " · R" + p.n, payLabel(p), t("docs.receivedOn", { d: fmtDate(p.d) }), "success", p.d, p.amount,
      `data-act="receiptView" data-id="${j.id}" data-n="${p.n}"`));
    if (j.invoice) add(t("docs.invoice"), "#" + j.id, t("type." + j.type), j.stage === "paid" ? t("docs.paidDoc") : t("docs.sentOn", { d: fmtDate(j.invoice.d) }),
      j.stage === "paid" ? "success" : "danger", j.invoice.d, jobTotal(j), `data-act="jobInvoice" data-id="${j.id}"`);
  });
  return rows.sort((a, b) => (b.d || 0) - (a.d || 0));
}
function documentsCard(opps, jobs) {
  const rows = docRows(opps, jobs);
  return section(tt("docs.documents"), rows.length ? `<div class="list-group list-group-flush small">` + rows.map(r =>
    `<div class="list-group-item d-flex align-items-center gap-2 px-0"><div class="flex-grow-1 hl-minw0">` +
    `<a href="#" class="fw-semibold text-decoration-none" ${r.open}>${ic("doc")} ${esc(r.kind)} ${esc(r.number)}</a>` +
    `<div class="text-truncate">${badge(r.status, r.tone)} <span class="text-body-secondary">${esc(r.about)}</span></div></div>` +
    `<div class="text-nowrap fw-semibold">${signedMoney(r.amount)}</div><button type="button" class="btn btn-outline-secondary btn-sm" data-act="pdfDemo">PDF</button></div>`).join("") + `</div>`
    : `<div class="small text-body-secondary">${tt("docs.noDocs")}</div>`, "", "documents");
}

/* =====================================================================
   MONEY ON A JOB: price, change orders, deposits and payments, balance.
   A crew sees all of this on its own jobs and can record a payment it
   collects. It never sees the business's costs or margin.
   ===================================================================== */

/* ---------- starting sample money ---------- */
jobOf("26-112").cos = [{ id: "CO1", text: "Replace 6 more sheets of rotted plywood found at tear-off", amount: 390, status: "sent", d: wd(-1) }];
seed(jobOf("26-112"), wd(-1), "office", "log.coSent", { id: "CO1" });
jobOf("26-104").payments = [{ n: 1, d: ago(5), amount: 1500, method: "check", num: "2217", kind: "deposit", w: "office" }];
seed(jobOf("26-104"), ago(5), "office", "log.payment", { amount: "$1,500" });
Object.assign(jobOf("26-101"), { invoice: { d: ago(13) }, payments: [{ n: 1, d: ago(12), amount: 1850, method: "check", num: "1048", kind: "payment", w: "office" }] });
jobOf("26-099").invoice = { d: ago(6) };
jobOf("26-095").invoice = { d: ago(9) };
["26-101", "26-099", "26-095"].forEach(id => { const j = jobOf(id); seed(j, j.invoice.d, "office", "log.invoiced"); });
seed(jobOf("26-101"), ago(12), "office", "log.paid");
JOBS.forEach(j => { j.cos = j.cos || []; j.payments = j.payments || []; j.payTop = j.payments.length; j.coTop = j.cos.length; });
// the copies kept when an invoice was sent and when a payment was recorded
["26-101", "26-099", "26-095"].forEach(id => keepInvoice(jobOf(id)));
JOBS.forEach(j => j.payments.forEach(p => keepReceipt(j, p)));

// an office user can take a payment at any point (a deposit before the work); a crew can once the work has started
const canTakePayment = j => balance(j) > 0 && (isCrew() ? ["inprogress", "done", "invoiced"].includes(j.stage) && isCrewLead() : j.stage !== "paid");

function jobMoneyCard(j) {
  if (j.type === "warranty") return section(tt("job.money"), `<div class="small text-body-secondary">${tt("job.warrantyNoCharge")}</div>`, "", "money");
  const cos = j.cos.slice().sort((a, b) => +a.id.slice(2) - +b.id.slice(2)), pays = j.payments.slice().sort((a, b) => a.n - b.n), office = !isCrew();   // in number order, a restored one too
  const row = (label, amount, cls) => `<div class="d-flex justify-content-between gap-3 ${cls || ""}"><span>${label}</span><span class="text-nowrap">${amount}</span></div>`;
  const head = text => `<div class="small text-uppercase text-body-secondary fw-semibold mt-3 mb-1">${esc(text)}</div>`;
  const link = (act, data, label) => `<a href="#" data-act="${act}" ${data}>${esc(label)}</a>`;
  let h = row(`${tt("job.price")} <span class="text-body-secondary">· ${tt("job.fromProposal")}</span>`, money(j.price));
  if (j.laborOnly) h += `<div class="text-body-secondary">${tt("job.laborOnlyNote")}</div>`;
  if (cos.length || office) {
    h += head(t("money.cos"));
    h += cos.map(c => `<div class="d-flex gap-3 align-items-start border-top py-1"><div class="flex-grow-1 hl-minw0">${link("coView", `data-id="${j.id}" data-co="${c.id}"`, c.id)} · ${esc(c.text)}<br>` +
      badge(t("co." + c.status), c.status === "signed" ? "success" : "warning") +
      (c.status === "sent" && office ? ` <button type="button" class="btn btn-sm btn-link p-0 align-baseline" data-act="coSign" data-id="${j.id}" data-co="${c.id}">${tt("money.coMarkSigned")}</button>` : "") +
      (c.status === "sent" && mayEdit("co") ? ` · ${link("editCo", `data-id="${j.id}" data-co="${c.id}"`, t("docs.edit"))}` : "") +
      `</div><div class="text-nowrap${c.status === "signed" ? "" : " text-body-secondary"}">${signedMoney(c.amount)}` +
      (office && can("delete") ? ` <a href="#" class="link-danger ms-1" data-act="askDelete" data-kind="co" data-id="${j.id}:${c.id}" aria-label="${tt("bin.delete")}">${ic("trash")}</a>` : "") + `</div></div>`).join("");
    if (!cos.length) h += `<div class="text-body-secondary">${tt("none")}</div>`;
    if (office && j.stage !== "paid") h += `<button type="button" class="btn btn-outline-secondary btn-sm mt-2" data-act="coAdd" data-id="${j.id}">${ic("plus")} ${tt("money.coAdd")}</button>`;
  }
  h += row(tt("total"), money(jobTotal(j)), "fw-bold border-top mt-3 pt-2");
  if (cos.some(c => c.status === "sent")) h += `<div class="text-body-secondary">${tt("money.coNote")}</div>`;
  if (pays.length) h += head(t("money.payments")) + pays.map(x => row(`${esc(payLabel(x))} <span class="text-body-secondary">· ${esc(whoName(x.w))}</span> · ` +
      link("receiptView", `data-id="${j.id}" data-n="${x.n}"`, t("docs.receipt") + " R" + x.n) + (mayEdit("payment") ? " · " + link("editPay", `data-id="${j.id}" data-n="${x.n}"`, t("docs.edit")) : ""),
    "−" + money(x.amount) + (office && can("delete") ? ` <a href="#" class="link-danger ms-1" data-act="askDelete" data-kind="payment" data-id="${j.id}:${x.n}" aria-label="${tt("bin.deletePayment")}">${ic("trash")}</a>` : ""))).join("");
  h += row(tt("money.balance"), money(balance(j)), "fw-bold fs-5 border-top mt-3 pt-2" + (balance(j) > 0 ? "" : " text-success"));
  const btns = (canTakePayment(j) ? `<button type="button" class="btn btn-primary btn-sm" data-act="payAdd" data-id="${j.id}">${ic("dollar")} ${tt("money.record")}</button>` : "") +
    (j.invoice ? `<button type="button" class="btn btn-outline-secondary btn-sm" data-act="jobInvoice" data-id="${j.id}">${ic("doc")} ${tt("job.viewInvoice")}</button>` : "");
  return section(tt("job.money"), `<div class="small">${h}</div>` + (btns ? `<div class="d-flex flex-wrap gap-2 mt-3">${btns}</div>` : ""), "", "money", { kind: "job", id: j.id, sec: "money" });
}

/* ---------- change orders: work added or removed after signing ---------- */
ACT.coAdd = d => openModal(modalShell(tt("money.coAdd"),
  `<p class="small text-body-secondary">${tt("money.coExplain")}</p>` +
  field(t("money.coWhat"), `<textarea class="form-control" id="coText" rows="2"></textarea>`) +
  field(t("money.coAmount"), `<div class="input-group"><span class="input-group-text">$</span><input class="form-control" id="coAmt" inputmode="decimal"></div><div class="form-text">${tt("money.coMinus")}</div>`),
  cancelBtn() + `<button type="button" class="btn btn-primary" data-act="coSave" data-id="${d.id}">${ic("mail")} ${tt("money.coSend")}</button>`));
ACT.coSave = d => {
  const j = jobOf(d.id), text = val("coText"), amount = parseFloat(val("coAmt").replace(/[^0-9.\-]/g, ""));
  if (!text) { $("#coText").classList.add("is-invalid"); return; }
  if (isNaN(amount)) { $("#coAmt").classList.add("is-invalid"); return; }
  j.coTop = Math.max(j.coTop || 0, ...j.cos.map(c => +c.id.slice(2))) + 1;           // never a number used before, even one in the Recycle Bin
  const c = { id: "CO" + j.coTop, text, amount, status: "sent", d: new Date() };
  j.cos.push(c); addLog(j, "log.coSent", { id: c.id });
  closeModal(); toast(t("money.coSentToast")); render();
};
ACT.coSign = d => { const j = jobOf(d.id); signCo(j, j.cos.find(x => x.id === d.co), "paper"); closeModal(); toast(t("log.coSigned", { id: d.co })); render(); };

/* ---------- payments ---------- */
ACT.payAdd = d => {
  const j = jobOf(d.id);
  openModal(modalShell(tt("money.record"),
    `<p class="small text-body-secondary">#${j.id} · ${esc(acct(j.acct).name)} · ${tt("money.balance")}: <span class="fw-semibold">${money(balance(j))}</span></p>` +
    `<div class="row g-2"><div class="col-6">${field(t("money.amount"), `<div class="input-group"><span class="input-group-text">$</span><input class="form-control" id="payAmt" inputmode="decimal" value="${balance(j)}"></div>`)}</div>` +
    `<div class="col-6">${field(t("money.method"), `<select class="form-select" id="payHow">${pickKeys("method").map(k => `<option value="${k}">${tt("method." + k)}</option>`).join("")}</select>`)}</div></div>` +
    field(t("money.checkNo"), `<input class="form-control" id="payNum" inputmode="numeric" autocomplete="off">`) +
    `<div class="form-text">${tt("money.recordedBy", { who: whoName(me()) })}</div>`,
    cancelBtn() + `<button type="button" class="btn btn-primary" data-act="paySave" data-id="${j.id}">${ic("check")} ${tt("money.record")}</button>`));
};
ACT.paySave = d => {
  const j = jobOf(d.id), amount = parseFloat(val("payAmt").replace(/[^0-9.]/g, ""));
  if (!(amount > 0)) { $("#payAmt").classList.add("is-invalid"); return; }
  j.payTop = Math.max(j.payTop || 0, ...j.payments.map(p => p.n)) + 1;               // its receipt number: never one used before
  const p = { n: j.payTop, d: new Date(), amount, method: val("payHow"), num: val("payNum"), kind: ["signed", "scheduled"].includes(j.stage) ? "deposit" : "payment", w: me() };
  j.payments.push(p); keepReceipt(j, p);
  addLog(j, "log.payment", { amount: money(amount) });
  if (balance(j) <= 0 && ["done", "invoiced"].includes(j.stage)) { j.stage = "paid"; addLog(j, "log.paid"); }
  closeModal(); toast(t("money.recorded")); render();
};

function schedItem(s, day) {

  return `<a href="#job/${r.id}" class="${base}border-${tone} bg-${tone}-subtle"><span class="fw-semibold">${esc(crewName(crewOf(r.crew)))}</span> · ` +

function schedDay(d) {
  const f = S.f.sched;
  const items = stopsOn(d).filter(s => f === "all" || (f === "insp" ? s.kind === "insp" : s.kind === "job" && s.rec.crew === f));
  return `<div class="col"><div class="card h-100${sameDay(d, TODAY) ? " border-primary" : isOff(d) ? " border-warning" : ""}">` +
    `<div class="card-header d-flex justify-content-between py-1 px-2 small"><span class="fw-semibold text-uppercase">${esc(d.toLocaleDateString(loc(), { weekday: "short" }))}</span>` +

/* ---------- suggested times ---------- */
// Inspection: any hour from 9 am to 4 pm, one hour long. Days are ranked by how close the
// visit is to that day's other stops, then by soonest.
function inspSuggestions(o) {
  const place = placeOf(o), out = [];
  for (let k = 1; k <= 6; k++) {
    const day = wd(k), others = stopsOn(day).filter(s => s.rec !== o);
    let near = null;
    others.forEach(s => { const m = miles(place, placeOf(s.rec)); if (!near || m < near.m) near = { m, s }; });
    const nearHour = near && near.s.kind === "insp" ? parseInt(near.s.time, 10) : 9;
    for (let h = 9; h <= 16; h++) {
      if (others.some(s => s.kind === "insp" && Math.abs(parseInt(s.time, 10) - h) < 1)) continue;      // that hour is taken
      out.push({ day, time: String(h).padStart(2, "0") + ":00", near, score: near ? near.m : 40, gap: Math.abs(h - nearHour) });
    }
  }
  out.sort((a, b) => a.score - b.score || a.day - b.day || a.gap - b.gap || a.time.localeCompare(b.time));
  const seen = new Set(), top = [];                                  // the best time on each day; four days
  for (const r of out) { if (seen.has(iso(r.day))) continue; seen.add(iso(r.day)); top.push(r); if (top.length === 4) break; }
  return top;
}
// Job: the next days when the crew is free for the whole job. Whole days only.
function jobSuggestions(j, crewId, days) {
  const n = days || DAYS_BY_TYPE[j.type] || 1, out = [];
  for (let k = 1; k <= 15 && out.length < 4; k++) {
    const days = Array.from({ length: n }, (_, i) => wd(k + i));
    if (days.some(d => crewBusy(crewId, d, j.id))) continue;
    const prev = JOBS.find(x => x.crew === crewId && x.id !== j.id && x.days.some(d => sameDay(d, wd(k - 1))));
    out.push({ days, prev, m: prev ? miles(placeOf(j), placeOf(prev)) : null });
  }
  return out;
}
// small map: the new visit (green) and that day's other stops
function miniMap(place, day, label) {
  const pts = stopsOn(day).map(s => ({ p: placeOf(s.rec), label: acct(s.rec.acct).name.split(" ")[0] + " " + fmtTime(s.time) }));
  const all = [...pts.map(x => x.p), place], lats = all.map(p => p.lat), lngs = all.map(p => p.lng), pad = 0.03;
  const minLat = Math.min(...lats) - pad, maxLat = Math.max(...lats) + pad, minLng = Math.min(...lngs) - pad, maxLng = Math.max(...lngs) + pad;
  const W = 320, H = 150, X = l => ((l - minLng) / (maxLng - minLng || 1)) * (W - 90) + 15, Y = l => H - (((l - minLat) / (maxLat - minLat || 1)) * (H - 30) + 15);
  return `<svg class="w-100 border rounded bg-body-tertiary mt-3" viewBox="0 0 ${W} ${H}" role="img" aria-label="${tt("sched.map")}">` +
    pts.map(x => `<line x1="${X(place.lng)}" y1="${Y(place.lat)}" x2="${X(x.p.lng)}" y2="${Y(x.p.lat)}" stroke="var(--bs-secondary)" stroke-width="1.5" stroke-dasharray="4 4"/>`).join("") +
    pts.map(x => `<circle cx="${X(x.p.lng)}" cy="${Y(x.p.lat)}" r="6" fill="var(--bs-primary)"/><text x="${X(x.p.lng) + 9}" y="${Y(x.p.lat) + 4}" font-size="10" fill="var(--bs-body-color)">${esc(x.label)}</text>`).join("") +
    `<circle cx="${X(place.lng)}" cy="${Y(place.lat)}" r="7" fill="var(--bs-success)" stroke="var(--bs-body-bg)" stroke-width="2"/><text x="${X(place.lng) + 10}" y="${Y(place.lat) + 4}" font-size="10" font-weight="700" fill="var(--bs-success)">${esc(label)}</text></svg>`;
}

/* =====================================================================
   DASHBOARD AND REPORTS. The numbers are samples. Every chart has a
   table behind it, and every report exports to a spreadsheet file.
   Crews never see these screens.
   ===================================================================== */

/* ---------- sample numbers (made up) ---------- */
const monthStart = n => new Date(TODAY.getFullYear(), TODAY.getMonth() - n, 1);        // the first of the month, n months back
const fmtMonth = d => d.toLocaleDateString(loc(), { month: "long", year: "numeric" });
// revenue for the last six complete months, oldest first: replacement, repair, gutters, siding, other
const REV = [[16800, 9400, 4200, 3600, 2400], [17500, 10150, 4800, 3900, 2300], [19200, 11000, 5100, 4300, 1600],
  [22400, 12300, 5600, 5200, 2400], [24800, 13100, 6400, 5400, 2600], [26300, 13900, 6700, 5600, 2600]]
  .map((parts, i) => ({ d: monthStart(6 - i), parts, total: parts.reduce((a, b) => a + b, 0) }));
const LEAD_SRC = [["web", 34, 19], ["referral", 18, 14], ["repeat", 11, 10], ["contractor", 9, 9], ["warranty", 6, 6]];   // source, leads, converted (last 90 days)

/* ---------- charts ---------- */
const compact = v => "$" + (v >= 1000 ? Math.round(v / 100) / 10 + "K" : v);
const niceMax = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); return [1, 1.5, 2, 3, 4, 5, 6, 8, 10].find(s => s >= v / p) * p; };
// drawn at about the width it will show at, so the labels stay readable on a phone
const chartWidth = () => (window.innerWidth >= 992 ? 450 : Math.max(280, Math.min(560, window.innerWidth - 66)));
// columns: one amount per period. Only the newest and the highest column carry a number; the rest are on the axis and in the tooltip.
function colChart(rows, label) {
  const W = chartWidth(), H = 200, m = { l: 44, r: 8, t: 22, b: 24 }, top = Math.max(...rows.map(r => r.value)), max = niceMax(top);
  const band = (W - m.l - m.r) / rows.length, bw = Math.min(24, band * 0.5), y0 = H - m.b, y = v => m.t + (y0 - m.t) * (1 - v / max);
  const ink = 'font-size="11" fill="var(--bs-secondary-color)"';
  let g = [0, max / 2, max].map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bs-border-color)"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end" ${ink}>${compact(v)}</text>`).join("");
  rows.forEach((r, i) => {
    const x = m.l + band * i + (band - bw) / 2, yt = y(r.value), rad = Math.min(4, y0 - yt), hitTop = Math.max(0, yt - 16);
    g += `<rect class="hl-hit" x="${m.l + band * i}" y="${hitTop}" width="${band}" height="${y0 - hitTop}" tabindex="0" data-bs-toggle="tooltip" data-bs-title="${esc(money(r.value) + " · " + r.tip)}"/>` +
      `<path class="hl-mark" d="M${x},${y0}V${yt + rad}Q${x},${yt} ${x + rad},${yt}H${x + bw - rad}Q${x + bw},${yt} ${x + bw},${yt + rad}V${y0}Z"/>` +
      `<text x="${x + bw / 2}" y="${y0 + 15}" text-anchor="middle" ${ink}>${esc(r.label)}</text>` +
      (i === rows.length - 1 || r.value === top ? `<text x="${x + bw / 2}" y="${yt - 6}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--bs-body-color)">${compact(r.value)}</text>` : "");
  });
  return `<svg class="w-100" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg>`;
}
// ranked bars: one row per item, largest first, the number at the end of the bar (Bootstrap's progress bar)
function rankBars(rows) {
  const max = Math.max(...rows.map(r => r.value));
  return rows.map(r => `<div class="row g-2 align-items-center small mb-2"><div class="col-6 col-sm-5 text-truncate">${esc(r.label)}</div><div class="col d-flex align-items-center gap-2">` +
    `<div class="progress bg-transparent rounded-0" style="width:${Math.max(2, r.value / max * 82)}%" role="img" aria-label="${esc(r.label + ": " + r.value)}" tabindex="0" data-bs-toggle="tooltip" data-bs-title="${esc(r.tip)}">` +
    `<div class="progress-bar rounded-end w-100"></div></div><span class="fw-semibold">${r.value}</span></div></div>`).join("");
}
const revChart = () => section(tt("reports.revChart"), colChart(REV.map(r => ({ label: r.d.toLocaleDateString(loc(), { month: "short" }), tip: fmtMonth(r.d), value: r.total })), t("reports.revChart")),
  `<a class="small" href="#report/revenue">${tt("reports.seeNumbers")}</a>`);
const leadChart = () => section(tt("reports.leadChart"), rankBars(LEAD_SRC.map(([k, n, c]) => ({ label: t("src." + k), value: n, tip: t("reports.leadTip", { n, c, p: pctOf(c, n) }) }))),
  `<a class="small" href="#report/leadsBySource">${tt("reports.seeNumbers")}</a>`);
const chartsRow = () => `<div class="row g-3"><div class="col-lg-6">${revChart()}</div><div class="col-lg-6">${leadChart()}</div></div>`;

  if (!/^[\w.@+-]+$/.test(login) || USERS.some(x => x.login === login && x.id !== d.id)) return bad("#ueLogin");
  if ((!d.id && pass.length < 10) || (pass && pass.length < 10)) return bad("#uePass");

/* ------------------------------ COLORS AND ICON ------------------------------ */
// The main color (buttons, highlights, charts) and the top bar's color. White writing goes on both, so a color it does
// not read well on (contrast below 4.5 to 1, the WCAG AA level) is refused. H & L's colors keep their hand-picked shades;
// for other colors the shades are worked out here, the way Bootstrap works out its own, as the app does in look.py.
const HL_LOOK = { accent: "#b05a22", bar: "#1f3a5f", name: "H & L Roofers" };
S.look = { accent: HL_LOOK.accent, bar: HL_LOOK.bar, icon: null };
const lkRgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
const lkHex = c => "#" + c.map(x => Math.round(x).toString(16).padStart(2, "0")).join("");
const lkMix = (c, other, share) => c.map((x, i) => x + (other[i] - x) * share);
const lkLum = c => { const lin = x => { x /= 255; return x <= 0.04045 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4; }; const [r, g, b] = c.map(lin); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const lkContrast = (a, b) => { const [hi, lo] = [lkLum(a), lkLum(b)].sort((x, y) => y - x); return (hi + 0.05) / (lo + 0.05); };

  for (let step = Math.round((start || 0) * 20); step <= 20; step++) { const l = lkMix(c, LK_WHITE, step / 20).map(Math.round); if (lkContrast(l, bg) >= 4.5) return l; }
  return LK_WHITE;
}
function lkShades(accent, bar) {
  const m = lkRgb(accent), top = lkRgb(bar), dark = lkLighter(m, LK_DARK), whole = c => c.map(Math.round).join(", ");
  return { "--hl-bar": bar, "--hl-amp": lkHex(lkLighter(m, top, 0.5)), "--hl-accent": accent, "--hl-accent-rgb": whole(m),
    "--hl-accent-hover": lkHex(lkMix(m, LK_BLACK, 0.15)), "--hl-accent-active": lkHex(lkMix(m, LK_BLACK, 0.2)), "--hl-accent-active-border": lkHex(lkMix(m, LK_BLACK, 0.25)),
    "--hl-accent-text": lkHex(lkMix(m, LK_BLACK, 0.4)), "--hl-accent-subtle": lkHex(lkMix(m, LK_WHITE, 0.8)), "--hl-accent-border": lkHex(lkMix(m, LK_WHITE, 0.6)),
    "--hl-accent-focus": lkHex(lkMix(m, LK_WHITE, 0.5)), "--hl-accent-dark": lkHex(dark), "--hl-accent-dark-rgb": whole(dark),
    "--hl-accent-dark-text": lkHex(lkMix(dark, LK_WHITE, 0.4)), "--hl-accent-dark-subtle": lkHex(lkMix(m, LK_BLACK, 0.8)), "--hl-accent-dark-border": lkHex(lkMix(m, LK_BLACK, 0.4)),

// only what differs from H & L's is replaced, so H & L's hand-picked shades stay wherever its color stays
function applyLook() {
  const root = document.documentElement.style, all = lkShades(S.look.accent, S.look.bar);
  Object.keys(all).forEach(k => root.removeProperty(k));
  const names = [...(S.look.accent !== HL_LOOK.accent ? Object.keys(all).filter(k => k !== "--hl-bar") : []), ...(S.look.bar !== HL_LOOK.bar ? ["--hl-bar", "--hl-amp"] : [])];
  names.forEach(k => root.setProperty(k, all[k]));

  if (!link) { link = document.createElement("link"); link.rel = "icon"; document.head.appendChild(link); }
  link.href = iconUrl();
}
// the app's icon: the uploaded picture; H & L's own while the name and colors are H & L's; otherwise drawn from the initials
const initials = name => {
  let out = "";
  for (const w of (name || "").match(/&|[^\s,.&]+/g) || []) {
    if (w === "&") out += "&";
    else if (!["llc", "inc", "co", "corp", "ltd", "the", "and", "y", "de", "del", "la", "el", "los", "las"].includes(w.toLowerCase())) out += ([...w].find(ch => /[\p{L}\p{N}]/u.test(ch)) || "").toUpperCase();
  }
  return out.slice(0, 3).replace(/^&+|&+$/g, "") || "?";
};
const isHlLook = () => !S.look.icon && S.company.name === HL_LOOK.name && S.look.accent === HL_LOOK.accent && S.look.bar === HL_LOOK.bar;
function iconUrl() {
  if (S.look.icon) return S.look.icon;
  const svg = isHlLook()
    ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#1f3a5f"/><path d="M96 236 L256 112 L416 236" fill="none" stroke="#f0b07f" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>` +
      `<text x="256" y="388" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="150" fill="#fff">H<tspan fill="#f0b07f">&amp;</tspan>L</text></svg>`
    : (() => { const amp = lkHex(lkLighter(lkRgb(S.look.accent), lkRgb(S.look.bar), 0.5)), letters = initials(S.company.name);
        const size = letters.length > 2 ? 150 : 190;

          [...letters].map(ch => (ch === "&" ? `<tspan fill="${amp}">&amp;</tspan>` : esc(ch))).join("") + `</text></svg>`; })();

// an uploaded picture: a square one fills the icon; any other shape is fitted whole on a white square
function fitIcon(src, done) {

    const room = square ? size : Math.round(size * 0.84), scale = room / Math.max(img.width, img.height), w = Math.round(img.width * scale), h = Math.round(img.height * scale);

function saveLook(accent, bar, icon) {

function syncPicks() { PICK_GROUPS.forEach(g => PICKS[g.id].forEach(x => { I18N.en[g.id][x.key] = x.en; I18N.es[g.id][x.key] = x.es; })); }

    let f = raw(r);
    if (kind === "lead") {
      f = f.map(x => (x.k === "msg" && r.msgLocked ? { ...x, type: "locked" } : x));
      f.splice(f.findIndex(x => x.k === "type") + 1, 0, fSelect("src", "opps.source", pickKeys("src", r.src).map(k => [k, "src." + k]), () => r.src, v => { r.src = v; }));

    if (kind === "opp" && r.descLocked) f = [...f, { k: "desc", label: "leads.request", type: "locked", get: () => r.lines.map(l => l[0]).join("\n") }];

  IMP.file = name; IMP.headings = rows[0]; IMP.rows = rows.slice(1).map(r => IMP.headings.map((h, i) => r[i] || ""));
  const names = {}, used = new Set();
  IMP_FIELDS[IMP.kind].forEach(([k, aliases]) => [k, k.replace(/_/g, " "), I18N.en.imp.f[k], I18N.es.imp.f[k], ...aliases].forEach(w => { if (!(impTidy(w) in names)) names[impTidy(w)] = k; }));
  IMP.map = IMP.headings.map(h => { const k = names[impTidy(h)] || ""; if (used.has(k)) return ""; used.add(k); return k; });
  IMP.step = "map"; render();
}
ACT.impKind = (d, el) => { IMP.kind = el.value; render(); };
ACT.impTemplate = d => saveText("import-" + d.kind + ".csv", csvText([impSample(d.kind)[0], impExample(d.kind)[0]]), "text/csv;charset=utf-8");
ACT.impSample = () => impLoad(impSample(IMP.kind), "sample-" + IMP.kind + ".csv");
ACT.impRead = () => {
  const file = $("#impFile").files[0]; if (!file) return;
  if (/\.xlsx$/i.test(file.name)) { impLoad(impSample(IMP.kind), file.name); return; }      // the app reads Excel on the server: here the sample rows stand in
  if (!/\.csv$/i.test(file.name)) { IMP.problem = t("imp.fileHelp"); render(); return; }
  const reader = new FileReader();
  reader.onload = () => impLoad(csvParse(reader.result), file.name);
  reader.readAsText(file);
};
const digitsOnly = s => String(s || "").replace(/\D/g, "");
function impCheck(kind, v) {
  if (!v.name) return t("imp.needName");
  if (v.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)) return t("imp.badEmail");
  if (v.phone && ![10, 11].includes(digitsOnly(v.phone).length)) return t("imp.badPhone");
  if (v.language) { const w = impTidy(v.language); v.language = ["es", "spanish", "español", "espanol"].includes(w) ? "es" : ["en", "english", "inglés", "ingles"].includes(w) ? "en" : null; if (!v.language) return t("imp.badLang"); } else v.language = "en";
  if (v.phone) { const d = digitsOnly(v.phone).slice(-10); v.phone = `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}`; }
  v.state = (v.state || "VA").toUpperCase().slice(0, 2);
  if (kind === "customers") {
    if (v.kind) { const k = PICKS.kind.find(x => x.active && [x.key, impTidy(x.en), impTidy(x.es)].includes(impTidy(v.kind))); if (!k) return t("imp.badKind", { v: v.kind }); v.kind = k.key; } else v.kind = "homeowner";
    if (!v.street) return t("imp.needStreet");
    if (!(v.phone || v.email)) return t("imp.needContact");
  } else {
    if (v.job_type) { const k = TYPE_LIST.find(x => x.active && x.key !== "warranty" && [x.key, impTidy(I18N.en.type[x.key] || ""), impTidy(I18N.es.type[x.key] || "")].includes(impTidy(v.job_type))); if (!k) return t("imp.badType", { v: v.job_type }); v.job_type = k.key; } else v.job_type = "inspection";
    if (!(v.phone || v.email)) return t("imp.needContact");
  }
  return "";
}
ACT.impMap = () => {
  const map = IMP.headings.map((h, i) => val("impCol" + i)), used = map.filter(Boolean), required = IMP.kind === "customers" ? ["name", "street"] : ["name"];
  IMP.map = map; IMP.problem = "";
  if (used.length !== new Set(used).size) { IMP.problem = t("imp.dup"); return render(); }
  const missing = required.filter(k => !used.includes(k));
  if (missing.length) { IMP.problem = t("imp.needCol", { fields: missing.map(impWord).join(", ") }); return render(); }
  const seen = new Map();
  IMP.checked = IMP.rows.map((cells, n) => {
    const v = {}; IMP.map.forEach((k, i) => { if (k && cells[i]) v[k] = cells[i]; });
    const problem = impCheck(IMP.kind, v), row = { n: n + 2, v, cells, problem, state: problem ? "error" : "new", match: null, choice: "skip" };
    if (!problem) {
      if (IMP.kind === "customers") row.match = ACCOUNTS.find(a => a.contacts.some(c => (digitsOnly(c.phone) && digitsOnly(c.phone) === digitsOnly(v.phone)) || (c.email && v.email && c.email.toLowerCase() === v.email)) || a.props.some(p => v.street && p.addr.toLowerCase() === v.street.toLowerCase()));
      else row.match = LEADS.find(l => (digitsOnly(l.phone) && digitsOnly(l.phone) === digitsOnly(v.phone)) || (l.email && v.email && l.email.toLowerCase() === v.email));
      const token = digitsOnly(v.phone).slice(-10) || (v.email || "");
      if (row.match) row.state = "exists"; else if (seen.has(token)) { row.state = "exists"; row.earlier = true; } else row.state = "new";
      seen.set(token, true);
    }
    return row;
  });
  IMP.step = "review"; render();
};
ACT.impConfirm = () => {
  const counts = { created: 0, added: 0, skipped: 0, failed: 0 }, kind = IMP.kind;
  IMP.checked.forEach(row => {
    const pick = $("#impChoice" + row.n); if (pick) row.choice = pick.value;
    const v = row.v;
    if (row.state === "error") { row.result = "failed"; row.message = row.problem; counts.failed++; return; }
    if (row.state === "exists" && !(row.choice === "add" && row.match)) { row.result = "skipped"; row.message = t("imp.skippedMsg"); counts.skipped++; return; }
    if (row.state === "exists" && kind === "customers") {
      const a = row.match, added = [];
      if (v.street && !a.props.some(p => p.addr.toLowerCase() === v.street.toLowerCase())) { a.props.push({ id: "P" + (a.props.length + 1) + a.id, addr: v.street, city: [v.city, v.state, v.zip_code].filter(Boolean).join(" "), lat: 37.5, lng: -77.45 }); added.push(t("property")); }
      if (v.note) { a.details.unshift({ d: new Date(), w: me(), text: v.note, title: v.note.split("\n")[0] }); added.push(t("notes.add")); }
      addLog(a, "log.importAdded", { detail: IMP.file + " · " + (added.join(", ") || "—") });
      row.result = "added"; row.message = t("imp.addedMsg", { name: a.name, what: added.join(", ") || "—" }); row.rec = "#account/" + a.id; counts.added++; return;
    }
    if (kind === "customers") {
      const n = ACCOUNTS.length + 1, home = v.kind === "homeowner";
      const a = { id: "A" + n, name: v.name, type: home ? "person" : "company", kind: v.kind, lang: v.language, since: TODAY.getFullYear(),
        contacts: [{ name: v.contact_name || v.name, role: home ? "owner" : "office", phone: v.phone || "", email: v.email || "" }],
        props: [{ id: "P" + n, addr: v.street, city: [v.city, v.state, v.zip_code].filter(Boolean).join(" "), lat: 37.5, lng: -77.45 }],
        details: v.note ? [{ d: new Date(), w: me(), text: v.note, title: v.note.split("\n")[0] }] : [], files: [] };
      ACCOUNTS.push(a); addLog(a, "log.imported", { detail: IMP.file }); row.rec = "#account/" + a.id;
    } else {
      const l = { id: "L-" + (Math.max(...LEADS.map(x => +x.id.slice(2))) + 1), name: v.name, phone: v.phone || "", email: v.email || "", addr: v.street || "", city: [v.city, v.state, v.zip_code].filter(Boolean).join(" "),
        lat: null, lng: null, type: v.job_type, lang: v.language, src: "imported", status: "new", owner: "office", got: new Date(), msg: v.message || "", msgLocked: !!v.message };
      LEADS.unshift(l); addLog(l, "log.imported", { detail: IMP.file }); row.rec = "#lead/" + l.id;
    }
    row.result = "created"; row.message = row.result === "created" ? t("imp.createdMsg") : ""; counts.created++;
  });
  IMP.result = counts; IMP.step = "done";
  addSetupLog("log.dataImported", { detail: t("imp." + kind) + " · " + IMP.file + " · " + t("imp.summary", counts) });
  toast(t("imp.summary", counts)); render();
};
ACT.impResultsFile = () => saveText("results-" + IMP.kind + ".csv", csvText([[t("imp.row"), t("imp.result"), t("imp.message"), ...IMP.headings],
  ...IMP.checked.map(r => [r.n, t("imp." + r.result), r.message, ...r.cells])]), "text/csv;charset=utf-8");
ACT.impAgain = () => { Object.assign(IMP, { file: "", headings: [], rows: [], map: [], step: "start", result: null, problem: "", checked: [] }); render(); };
ACT.impBack = d => { IMP.step = d.to; IMP.problem = ""; render(); };
ADMIN_PAGES.push({
  id: "import", icon: "upload", title: "imp.title", desc: "imp.desc",
  render() {
    const kinds = ["customers", "leads"], err = IMP.problem ? `<div class="alert alert-danger small">${esc(IMP.problem)}</div>` : "";
    if (IMP.step === "start") return pageHead(tt("imp.title"), tt("imp.sub")) + err +
      section("", `<h2 class="h6">${tt("imp.step1")}</h2><div class="d-flex flex-wrap gap-2 mb-3">${kinds.map(k => `<button type="button" class="btn btn-outline-secondary btn-sm" data-act="impTemplate" data-kind="${k}">${ic("download")} ${tt("imp.tmplFor", { kind: t("imp." + k) })}</button>`).join("")}</div>` +
        `<h2 class="h6">${tt("imp.step2")}</h2>` +
        field(t("imp.kind"), `<select class="form-select" id="impKind" data-change="impKind">${kinds.map(k => `<option value="${k}"${k === IMP.kind ? " selected" : ""}>${tt("imp." + k)}</option>`).join("")}</select>`) +
        field(t("imp.file"), `<input type="file" class="form-control" id="impFile" accept=".xlsx,.csv"><div class="form-text">${tt("imp.fileHelp")}</div>`) +
        `<div class="d-flex flex-wrap gap-2"><button type="button" class="btn btn-primary" data-act="impRead">${ic("upload")} ${tt("imp.read")}</button><button type="button" class="btn btn-outline-secondary" data-act="impSample">${tt("imp.sample")}</button></div>`);
    if (IMP.step === "map") {
      const sample = IMP.rows.slice(0, 3), opts = IMP_FIELDS[IMP.kind].map(f => f[0]);
      return pageHead(tt("imp.mapTitle"), esc(t("imp." + IMP.kind) + " · " + IMP.file + " · " + t("imp.rowsN", { n: IMP.rows.length })) + ". " + tt("imp.mapHint")) + err +
        section("", `<div class="table-responsive"><table class="table table-sm small align-middle mb-0"><thead><tr><th>${tt("imp.colFile")}</th><th>${tt("imp.examples")}</th><th>${tt("imp.goesTo")}</th></tr></thead><tbody>` +
          IMP.headings.map((h, i) => `<tr><td class="fw-semibold">${esc(h || "—")}</td><td class="text-body-secondary">${esc(sample.map(r => r[i]).filter(Boolean).join(" · ").slice(0, 60))}</td>` +
            `<td><select class="form-select form-select-sm" id="impCol${i}"><option value="">${tt("imp.skipCol")}</option>${opts.map(k => `<option value="${k}"${k === IMP.map[i] ? " selected" : ""}>${esc(impWord(k))}</option>`).join("")}</select></td></tr>`).join("") +
          `</tbody></table></div>`) +
        `<div class="d-flex gap-2 justify-content-end"><button type="button" class="btn btn-outline-secondary" data-act="impAgain">${tt("cancel")}</button><button type="button" class="btn btn-primary" data-act="impMap">${tt("imp.reviewBtn")}</button></div>`;
    }
    if (IMP.step === "review") {
      const by = s => IMP.checked.filter(r => r.state === s), customers = IMP.kind === "customers";
      const tile = (n, label, cls) => `<div class="col-4"><div class="card shadow-sm text-center"><div class="card-body py-2"><div class="fs-4 fw-bold ${cls || ""}">${n}</div><div class="small text-body-secondary">${label}</div></div></div></div>`;
      return pageHead(tt("imp.reviewTitle"), esc(t("imp." + IMP.kind) + " · " + IMP.file + " · " + t("imp.rowsN", { n: IMP.checked.length })) + ". " + tt("imp.nothingYet")) +
        `<div class="row g-2 mb-3">${tile(by("new").length, tt("imp.newN"))}${tile(by("exists").length, tt("imp.existsN"))}${tile(by("error").length, tt("imp.problems"), by("error").length ? "text-danger" : "")}</div>` +
        (by("error").length ? section(tt("imp.problemRows"), `<div class="small text-body-secondary mb-2">${tt("imp.problemHelp")}</div><table class="table table-sm small mb-0"><thead><tr><th>${tt("imp.row")}</th><th>${tt("imp.name")}</th><th>${tt("imp.why")}</th></tr></thead><tbody>` +
          by("error").map(r => `<tr><td>${r.n}</td><td>${esc(r.v.name || r.cells[0] || "")}</td><td>${esc(r.problem)}</td></tr>`).join("") + `</tbody></table>`) : "") +
        (by("exists").length ? section(tt("imp.existsN"), `<div class="small text-body-secondary mb-2">${tt("imp.existsHelp")}</div><table class="table table-sm small align-middle mb-0"><thead><tr><th>${tt("imp.row")}</th><th>${tt("imp.name")}</th><th>${tt("imp.matches")}</th><th>${tt("imp.todo")}</th></tr></thead><tbody>` +
          by("exists").map(r => `<tr><td>${r.n}</td><td>${esc(r.v.name)}</td><td>${r.match ? `<a href="${customers ? "#account/" : "#lead/"}${r.match.id}">${esc(r.match.name)}</a>` : tt("imp.earlier")}</td>` +
            `<td><select class="form-select form-select-sm" id="impChoice${r.n}"><option value="skip">${tt("imp.skip")}</option>${r.match ? `<option value="add">${tt(customers ? "imp.addTo" : "imp.addLead")}</option>` : ""}</select></td></tr>`).join("") + `</tbody></table>`) : "") +
        section(tt("imp.newN"), by("new").length ? `<table class="table table-sm small mb-0"><thead><tr><th>${tt("imp.row")}</th><th>${tt("imp.name")}</th><th>${tt("phone")}</th><th>${tt("email")}</th></tr></thead><tbody>` +
          by("new").slice(0, 50).map(r => `<tr><td>${r.n}</td><td>${esc(r.v.name)}</td><td>${esc(r.v.phone || "")}</td><td>${esc(r.v.email || "")}</td></tr>`).join("") + `</tbody></table>` : `<div class="small text-body-secondary">${tt("none")}</div>`) +
        `<div class="d-flex gap-2 justify-content-end"><button type="button" class="btn btn-outline-secondary" data-act="impBack" data-to="map">${tt("imp.back")}</button><button type="button" class="btn btn-primary" data-act="impConfirm">${ic("check")} ${tt("imp.confirm")}</button></div>`;
    }
    return pageHead(tt("imp.results"), esc(t("imp." + IMP.kind) + " · " + IMP.file), `<button type="button" class="btn btn-outline-secondary btn-sm text-nowrap" data-act="impResultsFile">${ic("download")} ${tt("imp.resultsFile")}</button>`) +
      `<div class="alert alert-secondary small">${tt("imp.summary", IMP.result)}</div>` +
      section("", `<div class="table-responsive"><table class="table table-sm small align-middle mb-0"><thead><tr><th>${tt("imp.row")}</th><th>${tt("imp.result")}</th><th>${tt("imp.message")}</th><th></th></tr></thead><tbody>` +
        IMP.checked.map(r => `<tr><td>${r.n}</td><td>${badge(t("imp." + r.result), r.result === "failed" ? "danger" : r.result === "skipped" ? "secondary" : "success")}</td><td>${esc(r.message)}</td>` +
          `<td class="text-end">${r.rec && r.result !== "failed" ? `<a href="${r.rec}">${tt("imp.open")}</a>` : ""}</td></tr>`).join("") + `</tbody></table></div>`) +
      `<button type="button" class="btn btn-outline-secondary" data-act="impAgain">${tt("imp.again")}</button>`;
  }
