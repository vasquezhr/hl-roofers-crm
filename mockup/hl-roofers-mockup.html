<style id="hl-css">
/* =====================================================================
   H & L styles. Everything else on the page is plain Bootstrap.
   Part 1 swaps Bootstrap's blue for the H & L colors.
   Part 2 is the handful of pieces Bootstrap does not have.
   ===================================================================== */

/* ---------- 1. H & L colors ---------- */
:root {
  --hl-navy: #1f3a5f;                 /* top bar */
  --hl-accent: #b05a22;               /* buttons and highlights */
}
[data-bs-theme=light] {
  --bs-primary: #b05a22;
  --bs-primary-rgb: 176, 90, 34;
  --bs-primary-text-emphasis: #6f3713;
  --bs-primary-bg-subtle: #f6e3d4;
  --bs-primary-border-subtle: #e7bf9f;
  --bs-link-color: #24507f;
  --bs-link-color-rgb: 36, 80, 127;
  --bs-link-hover-color: #1a3a5c;
  --bs-link-hover-color-rgb: 26, 58, 92;
  --bs-body-bg: #f4f1ec;              /* warm paper background */
  --bs-body-bg-rgb: 244, 241, 236;
  --bs-focus-ring-color: rgba(176, 90, 34, .25);
}
[data-bs-theme=dark] {
  --bs-primary: #e08a4c;
  --bs-primary-rgb: 224, 138, 76;
  --bs-primary-text-emphasis: #f0b07f;
  --bs-primary-bg-subtle: #3a2a1f;
  --bs-primary-border-subtle: #7a4a25;
  --bs-link-color: #86b2ea;
  --bs-link-color-rgb: 134, 178, 234;
  --bs-link-hover-color: #a9c8f0;
  --bs-link-hover-color-rgb: 169, 200, 240;
  --bs-focus-ring-color: rgba(224, 138, 76, .3);
}
/* white cards and lists on the warm background (light theme only) */
[data-bs-theme=light] .card { --bs-card-bg: #fff; }
[data-bs-theme=light] .list-group { --bs-list-group-bg: #fff; }
[data-bs-theme=dark] .card { --bs-card-bg: var(--bs-tertiary-bg); }
.table { --bs-table-bg: transparent; }
/* Bootstrap components that hard-code its blue */
.btn-primary {
  --bs-btn-color: #fff; --bs-btn-bg: #b05a22; --bs-btn-border-color: #b05a22;
  --bs-btn-hover-color: #fff; --bs-btn-hover-bg: #974d1d; --bs-btn-hover-border-color: #8d481b;
  --bs-btn-active-color: #fff; --bs-btn-active-bg: #8d481b; --bs-btn-active-border-color: #844319;
  --bs-btn-disabled-color: #fff; --bs-btn-disabled-bg: #b05a22; --bs-btn-disabled-border-color: #b05a22;
  --bs-btn-focus-shadow-rgb: 176, 90, 34;
}
.btn-outline-primary {
  --bs-btn-color: var(--bs-primary); --bs-btn-border-color: var(--bs-primary);
  --bs-btn-hover-color: #fff; --bs-btn-hover-bg: #b05a22; --bs-btn-hover-border-color: #b05a22;
  --bs-btn-active-color: #fff; --bs-btn-active-bg: #b05a22; --bs-btn-active-border-color: #b05a22;
  --bs-btn-disabled-color: var(--bs-primary); --bs-btn-disabled-border-color: var(--bs-primary);
  --bs-btn-focus-shadow-rgb: 176, 90, 34;
}
.nav-pills { --bs-nav-pills-link-active-bg: #b05a22; }
.hl-side .nav, .hl-tabbar .nav { --bs-nav-link-color: var(--bs-body-color); --bs-nav-link-hover-color: var(--bs-primary); }
.list-group { --bs-list-group-active-bg: #b05a22; --bs-list-group-active-border-color: #b05a22; }
.dropdown-menu { --bs-dropdown-link-active-bg: #b05a22; }
.form-check-input:checked { background-color: #b05a22; border-color: #b05a22; }
.form-control:focus, .form-select:focus, .form-check-input:focus {
  border-color: #d9a57f; box-shadow: 0 0 0 .25rem rgba(176, 90, 34, .25);
}

/* ---------- 2. Pieces Bootstrap does not have ---------- */
/* brand bar */
.hl-topbar { background: var(--hl-navy); }
.hl-amp { color: #f0b07f; }
.hl-tag { font-size: .62rem; letter-spacing: .04em; }
/* page frame */
.hl-side { width: 220px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.hl-main { max-width: 1000px; padding-bottom: 5.5rem; }    /* leaves room for the phone tab bar */
@media (min-width: 992px) { .hl-main { padding-bottom: 2rem; } }
.hl-minw0 { min-width: 0; }
/* phone tab bar */
.hl-tabbar { padding-bottom: env(safe-area-inset-bottom); }
.hl-tabbar .nav-link { font-size: .7rem; font-weight: 600; color: var(--bs-secondary-color); }
.hl-tabbar .nav-link.active { color: var(--bs-primary); }
/* icons */
.hl-ic { width: 1.15em; height: 1.15em; flex: none; vertical-align: -.2em; }
.hl-tabbar .hl-ic, .hl-side .hl-ic { width: 1.35rem; height: 1.35rem; }
/* notes keep their line breaks */
.hl-pre { white-space: pre-wrap; }
/* stage bar: one step per stage, from Inspection to Paid */
.hl-stage { display: flex; gap: .25rem; overflow-x: auto; }
.hl-stage > div { flex: 1; min-width: 4.4rem; text-align: center; font-size: .68rem; font-weight: 700; color: var(--bs-secondary-color); }
.hl-stage > div::before { content: ""; display: block; height: .4rem; border-radius: 1rem; background: var(--bs-border-color); margin-bottom: .3rem; }
.hl-stage > .done::before { background: var(--bs-success); }
.hl-stage > .cur::before { background: var(--bs-primary); }
.hl-stage > .cur { color: var(--bs-primary); }
</style>
</head>
<body>

<div class="d-flex min-vh-100">
  <!-- side navigation (computers) -->
  <aside class="d-none d-lg-flex flex-column flex-shrink-0 bg-body-tertiary border-end p-3 hl-side">
    <ul class="nav nav-pills flex-column gap-1" id="sideNav"></ul>
  </aside>

  <div class="flex-grow-1 d-flex flex-column hl-minw0">
    <!-- top bar -->
    <header class="navbar sticky-top shadow-sm px-3 py-2 hl-topbar" data-bs-theme="dark">
      <a class="navbar-brand d-flex flex-column lh-1 m-0 p-0" href="#" data-act="goHome">
        <span class="fw-bolder">H <span class="hl-amp">&amp;</span> L ROOFERS</span>
        <small class="opacity-75 hl-tag">HONEST &amp; LOYAL · VIRGINIA</small>
      </a>
      <div class="d-flex align-items-center gap-2 ms-auto">
        <div class="btn-group btn-group-sm" role="group" aria-label="Language / Idioma">
          <button type="button" class="btn btn-outline-light" data-act="setLang" data-lang="en">EN</button>
          <button type="button" class="btn btn-outline-light" data-act="setLang" data-lang="es">ES</button>
        </div>
        <div class="dropdown">
          <button class="btn btn-sm btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" id="roleBtn"></button>
          <ul class="dropdown-menu dropdown-menu-end" id="roleMenu" data-bs-theme="light"></ul>
        </div>
      </div>
    </header>

    <!-- the current screen -->
    <main class="container-fluid py-3 px-3 px-lg-4 hl-main" id="view"></main>
  </div>
</div>

<!-- bottom tab bar (phones) -->
<nav class="d-lg-none fixed-bottom bg-body border-top hl-tabbar">
  <ul class="nav nav-justified" id="tabNav"></ul>
</nav>

<!-- "More" menu (phones) -->
<div class="offcanvas offcanvas-bottom h-auto" tabindex="-1" id="moreNav" aria-labelledby="moreTitle">
  <div class="offcanvas-header pb-0">
    <h2 class="offcanvas-title h6" id="moreTitle"></h2>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <div class="list-group" id="moreList"></div>
  </div>
</div>

<!-- pop-up window, filled in by the script -->
<div class="modal fade" id="modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered" id="modalDialog">
    <div class="modal-content" id="modalContent"></div>
  </div>
</div>

<!-- short confirmation message -->
<div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3 mb-5 mb-lg-0">
  <div class="toast text-bg-dark border-0" role="status" aria-live="polite" aria-atomic="true" id="toast">
    <div class="toast-body text-center fw-semibold"></div>
  </div>
</div>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pick = (obj, key) => key.split(".").reduce((o, p) => (o == null ? o : o[p]), obj);

/* t(key, {n: 3}) returns the text for that key in the current language */
function t(key, vars) {
  let v = pick(I18N[S.lang], key);
  if (v == null) v = pick(I18N.en, key);
  if (v == null) { console.warn("missing text: " + key); return key; }
  return vars ? String(v).replace(/\{(\w+)\}/g, (m, k) => (vars[k] ?? m)) : v;
}
const tt = (key, vars) => esc(t(key, vars));      // the same text, made safe to place inside HTML

/* ---------- dates ---------- */
// No Saturday work. Sunday is not decided yet, so both days are shown as off for now.
const isOff = d => d.getDay() === 0 || d.getDay() === 6;
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); while (isOff(d)) d.setDate(d.getDate() + 1); return d; })();
function wd(n) {                       // n working days from today (negative = in the past)
  const d = new Date(TODAY), step = n < 0 ? -1 : 1;
  for (let k = Math.abs(n); k > 0;) { d.setDate(d.getDate() + step); if (!isOff(d)) k--; }
  return d;
}
function ago(n) { const d = new Date(TODAY); d.setDate(d.getDate() - n); return d; }   // n calendar days ago
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const sameDay = (a, b) => iso(a) === iso(b);
const loc = () => (S.lang === "es" ? "es-US" : "en-US");
const fmtDay = d => d.toLocaleDateString(loc(), { weekday: "short", month: "short", day: "numeric" });
const fmtDate = d => d.toLocaleDateString(loc(), { month: "short", day: "numeric", year: "numeric" });
const fmtTime = s => { if (!s) return ""; const [h, m] = s.split(":").map(Number); return ((h + 11) % 12 + 1) + ":" + String(m).padStart(2, "0") + (h < 12 ? " am" : " pm"); };
const money = n => "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
function daysSince(d) { return Math.round((TODAY - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000); }
function miles(a, b) {                 // straight-line miles with a rough road factor
  const R = 3958.8, r = x => x * Math.PI / 180, dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h)) * 1.25;
}

}

/* ---------- screens and navigation ---------- */
// Each screen registers itself: route("jobs", {roles, icon, render}). A tab only shows once its screen exists.
const ROUTES = {};
const route = (name, def) => { ROUTES[name] = def; };
const NAV = {
  admin: ["dashboard", "today", "leads", "opps", "jobs", "schedule", "accounts", "search", "reports", "admin"],
  office: ["today", "leads", "opps", "jobs", "schedule", "accounts", "search", "reports"],

};

const allowed = name => ROUTES[name] && ROUTES[name].roles.includes(S.role);
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

function render() {
  let [name, ...rest] = (location.hash || "").slice(1).split("/");
  let arg = decodeURIComponent(rest.join("/"));
  if (!allowed(name)) { name = tabsFor(S.role)[0]; arg = ""; history.replaceState(null, "", "#" + name); }
  const r = ROUTES[name];
  renderChrome(typeof r.tab === "function" ? r.tab() : (r.tab || name));
  $("#view").innerHTML = r.render(arg) + `<p class="text-center text-body-secondary small mt-4 mb-0">${tt("demo")}</p>`;
  document.documentElement.lang = S.lang;
  const cur = $("#view .hl-stage .cur");            // on a phone, slide the stage bar so the current step shows
  if (cur) cur.parentNode.scrollLeft = cur.offsetLeft - cur.parentNode.offsetLeft - cur.parentNode.clientWidth / 2 + cur.clientWidth / 2;
  if (r.after) r.after(arg);
}

// top bar, side navigation and phone tab bar
function renderChrome(active) {
  const tabs = tabsFor(S.role);
  const cur = k => (k === active ? ' active" aria-current="page' : "");
  $("#sideNav").innerHTML = tabs.map(k =>
    `<li class="nav-item"><a class="nav-link d-flex align-items-center gap-2${cur(k)}" href="#${k}">${ic(ROUTES[k].icon)}<span>${esc(t("nav." + k))}</span></a></li>`).join("");
  // phones: up to 5 tabs; if there are more, the 5th is "More"
  const first = tabs.length > 5 ? tabs.slice(0, 4) : tabs, more = tabs.length > 5 ? tabs.slice(4) : [];
  const tab = (inner, extra) => `<li class="nav-item"><a class="nav-link d-flex flex-column align-items-center px-1 py-2${extra}>${inner}</a></li>`;
  $("#tabNav").innerHTML = first.map(k => tab(`${ic(ROUTES[k].icon)}<span>${esc(t("nav." + k))}</span>`, `${cur(k)}" href="#${k}"`)).join("") +
    (more.length ? tab(`${ic("more")}<span>${esc(t("nav.more"))}</span>`, `${more.includes(active) ? " active" : ""}" href="#" role="button" data-bs-toggle="offcanvas" data-bs-target="#moreNav"`) : "");
  $("#moreTitle").textContent = t("nav.more");
  $("#moreList").innerHTML = more.map(k =>
    `<a class="list-group-item list-group-item-action d-flex align-items-center gap-2${k === active ? " active" : ""}" href="#${k}" data-act="navMore" data-to="#${k}">${ic(ROUTES[k].icon)} ${esc(t("nav." + k))}</a>`).join("");
  // role and language switches
  $("#roleBtn").textContent = isCrew() ? crewName(CREWS.find(c => c.id === S.crew)) : t("role." + S.role);
  const item = (role, crew, label) => `<li><button type="button" class="dropdown-item${S.role === role && (!crew || S.crew === crew) ? " active" : ""}" data-act="setRole" data-role="${role}" data-crew="${crew}">${esc(label)}</button></li>`;
  $("#roleMenu").innerHTML = `<li><h6 class="dropdown-header">${esc(t("viewAs"))}</h6></li>` + item("admin", "", t("role.admin")) + item("office", "", t("role.office")) +
    CREWS.map(c => item("crew", c.id, crewName(c) + " · " + c.lead)).join("");
  document.querySelectorAll('[data-act="setLang"]').forEach(b => b.classList.toggle("active", b.dataset.lang === S.lang));
}

/* ---------- clicks: every button says what it does with data-act="name" ---------- */
const ACT = {};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || !ACT[el.dataset.act]) return;
  if (el.tagName === "A" && (el.getAttribute("href") || "#") === "#") e.preventDefault();
  ACT[el.dataset.act](el.dataset, el, e);
});
document.addEventListener("input", e => { const el = e.target.closest("[data-input]"); if (el && ACT[el.dataset.input]) ACT[el.dataset.input](el.dataset, el, e); });
document.addEventListener("change", e => { const el = e.target.closest("[data-change]"); if (el && ACT[el.dataset.change]) ACT[el.dataset.change](el.dataset, el, e); });
window.addEventListener("hashchange", () => { closeModal(); render(); window.scrollTo(0, 0); });

ACT.setFilter = d => { S.f[d.name] = d.value; render(); };

// Call, Text and Directions add a line to the record's history. The link itself still opens the phone's app.
ACT.touch = d => {
  const rec = findRec(d.kind, d.id);
  if (rec) { addLog(rec, "log." + d.how); if (typeof onTouch === "function") onTouch(d.kind, rec, d.how); }
  setTimeout(render, 400);
};

/* ---------- lookups ---------- */
const acct = id => ACCOUNTS.find(a => a.id === id);
const oppOf = id => OPPS.find(o => o.id === id);
const jobOf = id => JOBS.find(j => j.id === id);
const crewOf = id => CREWS.find(c => c.id === id);
const placeOf = rec => { const a = acct(rec.acct); return a.props.find(p => p.id === rec.prop) || a.props[0]; };
const firstName = a => (a.type === "person" ? a.contacts[0].name.split(" ")[0] : a.name);
const scopeOf = j => j.scope || (j.opp ? oppOf(j.opp).lines.map(l => l[0]) : []);
function findRec(kind, id) {
  return kind === "job" ? jobOf(id) : kind === "opp" ? oppOf(id) : kind === "acct" ? acct(id) : kind === "lead" ? LEADS.find(l => l.id === id) : null;
}
// next free number, shared by opportunities and jobs (26-128, 26-129, ...)
function nextNumber() {
  const seq = [...OPPS, ...JOBS].map(r => parseInt(r.id.split("-")[1], 10));
  return "26-" + (Math.max(...seq) + 1);
}
// which jobs the current user may see: crews only see jobs scheduled to them
const myJobs = () => (isCrew() ? JOBS.filter(j => j.crew === S.crew) : JOBS);

/* ---------- money on a job ---------- */
const cosTotal = j => (j.cos || []).filter(c => c.status === "signed").reduce((s, c) => s + c.amount, 0);
const jobTotal = j => j.price + cosTotal(j);
const paidTotal = j => (j.payments || []).reduce((s, p) => s + p.amount, 0);
const balance = j => jobTotal(j) - paidTotal(j);

/* ---------- a little starting history, so the History boxes are not empty ---------- */
const seed = (rec, d, w, k, v) => { (rec.log = rec.log || []).push({ d, w, k, v }); };
OPPS.forEach(o => {
  if (o.stage === "lost") seed(o, o.lostOn, "office", "log.lost");
  if (o.signedOn) seed(o, o.signedOn, "office", "log.signed");
  if (o.sentOn) seed(o, o.sentOn, "office", "log.proposalSent");
  seed(o, o.created, "office", "log.oppCreated");
});
JOBS.forEach(j => {
  if (j.stage === "inprogress") seed(j, j.days[0], j.crew, "log.started");
  if (j.days.length && j.stage !== "signed") seed(j, j.opp ? oppOf(j.opp).signedOn : ago(2), "office", "log.scheduled");
  seed(j, j.opp ? oppOf(j.opp).signedOn : ago(2), "office", j.opp ? "log.jobCreated" : "log.warrantyCreated");
});

    `<div class="text-end flex-shrink-0">${right || ""}</div></div></a>`;
}

// the buttons at the top of a job, by stage and by who is looking
function jobActions(j) {
  const b = (act, icon, label, extra, cls) => `<button type="button" class="btn ${cls || "btn-primary"}" data-act="${act}" data-id="${j.id}" ${extra || ""}>${ic(icon)} ${esc(label)}</button>`;
  const out = [];
  if (j.stage === "signed" && !isCrew()) out.push(b("goBook", "schedule", t("job.schedule"), 'data-kind="job"'));
  if (j.stage === "scheduled") out.push(b("jobStage", "check", t("job.start"), 'data-to="inprogress"'));
  if (j.stage === "scheduled" && !isCrew()) out.push(b("jobSchedule", "edit", t("sched.changeDates"), "", "btn-outline-secondary"));
  if (j.stage === "inprogress") out.push(b("jobStage", "check", t("job.markDone"), 'data-to="done"'));
  if (j.type !== "warranty") {
    if (j.stage === "done" && !isCrew()) out.push(b("jobInvoice", "mail", t("job.makeInvoice")));
    if (balance(j) > 0 && (j.stage === "invoiced" || (isCrew() && j.stage === "done"))) out.push(b("payAdd", "dollar", t("money.record")));
    if (j.invoice) out.push(b("jobInvoice", "doc", t("job.viewInvoice"), "", "btn-outline-secondary"));
    if (jobDone(j) && !isCrew()) out.push(b("jobWarranty", "shield", t("job.newWarranty"), "", "btn-outline-secondary"));
  }
  return out.join("");
}

// Put a job on the schedule: pick the crew, the first day and how many days.
const DAYS_BY_TYPE = { repair: 1, replacement: 2, gutters: 1, tpo: 2, siding: 3, chimney: 1, skylight: 1, inspection: 1, warranty: 1 };
const crewBusy = (crewId, day, exceptId) => JOBS.some(j => j.crew === crewId && j.id !== exceptId && j.days.some(x => sameDay(x, day)));
ACT.jobSchedule = d => {
  const j = jobOf(d.id), crewId = d.crew || j.crew || "c1", days = DAYS_BY_TYPE[j.type] || 1;
  const dayOpts = Array.from({ length: 8 }, (_, i) => wd(i + 1)).map(x =>
    `<option value="${iso(x)}">${esc(fmtDay(x))}${crewBusy(crewId, x, j.id) ? " — " + tt("job.crewBusy") : ""}</option>`).join("");
  openModal(modalShell(tt("job.schedule"),
    `<p class="small text-body-secondary">#${j.id} · ${esc(acct(j.acct).name)} · ${tt("type." + j.type)}</p>` +
    field(t("crew"), `<select class="form-select" id="jsCrew" data-change="jobScheduleCrew" data-id="${j.id}">${CREWS.map(c => `<option value="${c.id}"${c.id === crewId ? " selected" : ""}>${esc(crewName(c))} · ${esc(c.lead)}</option>`).join("")}</select>`) +
    `<div class="row g-2"><div class="col-7">${field(t("job.firstDay"), `<select class="form-select" id="jsDay">${dayOpts}</select>`)}</div>` +
    `<div class="col-5">${field(t("job.howManyDays"), `<input type="number" class="form-control" id="jsDays" min="1" max="20" value="${days}">`)}</div></div>` +
    `<div class="form-text">${tt("job.scheduleHint")}</div>`,
    cancelBtn() + `<button type="button" class="btn btn-primary" data-act="saveSchedule" data-id="${j.id}">${tt("job.schedule")}</button>`));
};
ACT.jobScheduleCrew = (d, el) => ACT.jobSchedule({ id: d.id, crew: el.value });
ACT.saveSchedule = d => {
  const j = jobOf(d.id), n = Math.max(1, parseInt(val("jsDays"), 10) || 1), [y, m, dd] = val("jsDay").split("-").map(Number);
  const days = [], cur = new Date(y, m - 1, dd), wasDays = j.days.slice(), wasCrew = j.crew;
  while (days.length < n) { if (!isOff(cur)) days.push(new Date(cur)); cur.setDate(cur.getDate() + 1); }
  j.crew = val("jsCrew"); j.days = days; j.time = "08:00";
  if (j.stage === "signed") { j.stage = "scheduled"; addLog(j, "log.scheduled"); }
  else if (wasDays.map(iso).join() !== days.map(iso).join() || wasCrew !== j.crew) {       // an already scheduled job changed: the crew gets a "Changed" notice
    j.changed = { wasDays, seen: false, d: new Date() }; addLog(j, "log.changed", { was: rangeText(wasDays) });
  }
  closeModal(); toast(t("log.scheduled")); render();
};

// everything happening on one day: timed inspections, and jobs a crew is working that day
function stopsOn(day, crewId) {
  const out = [];
  if (!crewId) OPPS.filter(o => o.stage === "inspection" && o.insp && sameDay(o.insp.day, day))
    .forEach(o => out.push({ kind: "insp", time: o.insp.time, rec: o, href: "#opp/" + o.id }));
  JOBS.filter(j => (!crewId || j.crew === crewId) && j.days.some(d => sameDay(d, day)))
    .forEach(j => out.push({ kind: "job", time: j.time || "08:00", rec: j, href: "#job/" + j.id }));
  return out.sort((a, b) => a.time.localeCompare(b.time));
}
// one stop as a list row with Call and Directions
function stopRow(s) {

function showBuilder() {
  const o = oppOf(DRAFT.id);
  const rows = DRAFT.lines.map((l, i) =>
    `<div class="row g-2 mb-2"><div class="col"><input class="form-control form-control-sm" value="${esc(l[0])}" data-input="draftEdit" data-i="${i}" data-k="0" aria-label="${tt("docs.lineWhat")}"></div>` +
    `<div class="col-4 col-sm-3"><div class="input-group input-group-sm"><span class="input-group-text">$</span><input class="form-control" inputmode="decimal" value="${l[1] ?? ""}" placeholder="${tt("included")}" data-input="draftEdit" data-i="${i}" data-k="1" aria-label="${tt("docs.lineAmount")}"></div></div>` +
    `<div class="col-auto"><button type="button" class="btn btn-sm btn-outline-secondary" data-act="draftDel" data-i="${i}" aria-label="${tt("docs.removeLine")}">×</button></div></div>`).join("");
  const book = `<select class="form-select form-select-sm w-auto" data-change="draftFromBook" aria-label="${tt("docs.fromBook")}"><option value="">${tt("docs.fromBook")}</option>` +
    PRICE.map(it => `<option value="${it.code}">${esc(it.name)} · ${money(it.price)}/${tt("unit." + it.unit)}</option>`).join("") + `</select>`;
  openModal(modalShell(`${tt("opps.proposal")} #${o.id}`,
    `<p class="small text-body-secondary">${esc(acct(o.acct).name)} · ${esc(addrLine(placeOf(o)))}</p>` +
    `<div class="row g-2 small fw-semibold text-body-secondary mb-1"><div class="col">${tt("docs.lineWhat")}</div><div class="col-4 col-sm-3">${tt("docs.lineAmount")}</div><div class="col-auto invisible"><span class="btn btn-sm">×</span></div></div>` + rows +
    `<div class="d-flex flex-wrap gap-2 align-items-center mt-2"><button type="button" class="btn btn-sm btn-outline-secondary" data-act="draftAdd">${ic("plus")} ${tt("docs.addLine")}</button>${book}` +
    `<div class="ms-auto fw-bold">${tt("total")}: <span id="draftTotal">${money(draftTotal())}</span></div></div>` +
    `<div class="form-text mt-2">${tt("docs.builderHint")}</div>`,
    cancelBtn() + `<button type="button" class="btn btn-primary" data-act="draftPreview">${tt("docs.preview")}</button>`), "lg");
}
ACT.draftEdit = (d, el) => {
  const line = DRAFT.lines[+d.i];
  if (d.k === "0") line[0] = el.value; else { const n = parseFloat(el.value.replace(/[^0-9.]/g, "")); line[1] = isNaN(n) ? null : n; }
  $("#draftTotal").textContent = money(draftTotal());
};
ACT.draftAdd = () => { DRAFT.lines.push(["", null]); showBuilder(); };
ACT.draftDel = d => { DRAFT.lines.splice(+d.i, 1); showBuilder(); };
ACT.draftFromBook = (d, el) => { const it = PRICE.find(x => x.code === el.value); if (it) { DRAFT.lines.push([it.name + " (" + t("unit." + it.unit) + ")", it.price]); showBuilder(); } };
ACT.draftPreview = () => {
  const o = oppOf(DRAFT.id), lines = DRAFT.lines.filter(l => l[0].trim());
  if (!lines.length || !(draftTotal() > 0)) { toast(t("docs.needPrice")); return; }
  o.lines = lines.map(l => [l[0].trim(), l[1]]); o.total = draftTotal();
  showProposal(o);
};

// Step 2: the proposal as the customer gets it
function proposalBody(o) {
  const a = acct(o.acct), p = placeOf(o), c = a.contacts[0];
  return docHead(t("docs.proposal"), o.id, o.sentOn || new Date()) +
    docLabel(t("docs.for")) + `<div class="mb-3"><span class="fw-semibold">${esc(a.name)}</span><br>${esc(addrLine(p))}<br>${esc(c.phone)}${c.email ? " · " + esc(c.email) : ""}</div>` +
    docLines(o.lines, [[t("total"), o.total]]) +
    `<div class="mt-3">${docLabel(t("docs.terms"))}<div class="small">${tt("docs.termsText")}</div></div>`;
}
function showProposal(o) {
  const canSend = oppOpen(o), email = acct(o.acct).contacts[0].email;
  const doc = docWrap(proposalBody(o) +
    `<div class="row g-4 mt-3 small text-body-secondary"><div class="col-6"><div class="border-top border-secondary pt-1">${tt("docs.custSign")}${o.signedBy ? ": " + esc(o.signedBy) : ""}</div></div>` +
    `<div class="col-6"><div class="border-top border-secondary pt-1">${esc(co("legal"))}</div></div></div>`);
  openModal(modalShell(`${tt("opps.proposal")} #${o.id}`, doc,
    (canSend ? `<button type="button" class="btn btn-outline-secondary" data-act="oppProposal" data-id="${o.id}">${ic("edit")} ${tt("docs.edit")}</button>` : "") +
    `<button type="button" class="btn btn-outline-secondary" data-act="pdfDemo">${ic("download")} ${tt("docs.pdf")}</button>` +
    (canSend ? `<button type="button" class="btn btn-primary" data-act="proposalSend" data-id="${o.id}"${email ? "" : " disabled"}>${ic("mail")} ${tt(o.stage === "proposal" ? "docs.emailAgain" : "docs.email")}</button>` : "")), "lg");
}
ACT.oppView = d => showProposal(oppOf(d.id));
ACT.proposalSend = d => {
  const o = oppOf(d.id);
  o.stage = "proposal"; o.sentOn = new Date(); addLog(o, "log.proposalSent");
  closeModal(); toast(t("docs.emailed", { email: acct(o.acct).contacts[0].email })); render();
};

// Step 3: what the customer sees when they tap the link in the email. Accepting signs the proposal.
ACT.oppAccept = d => {
  const o = oppOf(d.id), a = acct(o.acct);
  openModal(modalShell(tt("docs.acceptTitle"),
    `<div class="alert alert-info py-2 small">${tt("docs.acceptExplain", { name: a.name })}</div>` + docWrap(proposalBody(o) +
      `<div class="mt-3">${docLabel(t("docs.acceptLabel"))}</div>` +
      `<input class="form-control my-2" id="accName" placeholder="${tt("docs.acceptName")}" autocomplete="off">` +
      `<button type="button" class="btn btn-primary w-100" data-act="acceptConfirm" data-id="${o.id}">${ic("check")} ${tt("docs.acceptBtn")}</button>` +
      `<div class="form-text">${tt("docs.acceptNote")}</div>`), ""), "lg");
};
ACT.acceptConfirm = d => {
  const name = val("accName");
  if (!name) { $("#accName").classList.add("is-invalid"); return; }
  const o = oppOf(d.id); o.signedBy = name;
  const j = signOpp(o, "link");
  closeModal(); toast(t("opps.jobCreated", { id: j.id })); go("#job/" + j.id);
};

/* ------------------------------ INVOICE ------------------------------ */
const payLabel = x => `${fmtDate(x.d)} · ${t("pay." + x.kind)} · ${t("method." + x.method)}${x.num ? " #" + x.num : ""}`;
function invoiceLines(j) {
  const out = [[t("docs.perProposal", { id: j.id, type: t("type." + j.type) }), j.price]];
  (j.cos || []).filter(c => c.status === "signed").forEach(c => out.push([t("money.co") + " " + c.id + ": " + c.text, c.amount]));
  return out;
}
function showInvoice(j) {
  const a = acct(j.acct), p = placeOf(j), c = a.contacts[0], pays = j.payments || [];
  const totals = [[t("total"), jobTotal(j)], ...pays.map(x => [payLabel(x), -x.amount]), [t("money.balance"), balance(j)]];
  const doc = docWrap(docHead(t("docs.invoice"), j.id, j.invoice ? j.invoice.d : new Date()) +
    `<div class="row g-3 mb-3"><div class="col-sm-6">${docLabel(t("docs.billTo"))}<span class="fw-semibold">${esc(a.name)}</span><br>${esc(c.phone)}${c.email ? "<br>" + esc(c.email) : ""}</div>` +
    `<div class="col-sm-6">${docLabel(t("docs.workAt"))}${esc(addrLine(p))}${p.site ? "<br>" + esc(p.site.name) : ""}${j.ref ? "<br>" + tt("ref." + j.ref.type) + " " + esc(j.ref.num) : ""}</div></div>` +
    docLines(invoiceLines(j), totals) +
    `<div class="mt-3">${docLabel(t("docs.terms"))}<div class="small">${tt("docs.invoiceTerms")}</div></div>`);
  const canSend = !isCrew() && !j.invoice && j.stage === "done";
  openModal(modalShell(`${tt("docs.invoice")} #${j.id}`, doc,
    `<button type="button" class="btn btn-outline-secondary" data-act="pdfDemo">${ic("download")} ${tt("docs.pdf")}</button>` +
    (canSend ? `<button type="button" class="btn btn-primary" data-act="invoiceSend" data-id="${j.id}">${ic("mail")} ${tt("docs.sendInvoice")}</button>` : "") +
    (!canSend && balance(j) > 0 ? `<button type="button" class="btn btn-primary" data-act="payAdd" data-id="${j.id}">${ic("dollar")} ${tt("money.record")}</button>` : "")), "lg");
}
ACT.jobInvoice = d => showInvoice(jobOf(d.id));
ACT.invoiceSend = d => {
  const j = jobOf(d.id);
  j.invoice = { d: new Date() }; j.stage = "invoiced"; addLog(j, "log.invoiced");
  if (balance(j) <= 0) { j.stage = "paid"; addLog(j, "log.paid"); }
  closeModal(); toast(t("docs.emailed", { email: acct(j.acct).contacts[0].email })); render();
};

/* =====================================================================
   MONEY ON A JOB: price, change orders, deposits and payments, balance.
   A crew sees all of this on its own jobs and can record a payment it
   collects. It never sees H & L's costs or margin.
   ===================================================================== */

/* ---------- starting sample money ---------- */
jobOf("26-112").cos = [{ id: "CO1", text: "Replace 6 more sheets of rotted plywood found at tear-off", amount: 390, status: "sent", d: wd(-1) }];
seed(jobOf("26-112"), wd(-1), "office", "log.coSent", { id: "CO1" });
jobOf("26-104").payments = [{ d: ago(5), amount: 1500, method: "check", num: "2217", kind: "deposit", w: "office" }];
seed(jobOf("26-104"), ago(5), "office", "log.payment", { amount: "$1,500" });
Object.assign(jobOf("26-101"), { invoice: { d: ago(13) }, payments: [{ d: ago(12), amount: 1850, method: "check", num: "1048", kind: "payment", w: "office" }] });
jobOf("26-099").invoice = { d: ago(6) };
jobOf("26-095").invoice = { d: ago(9) };
["26-101", "26-099", "26-095"].forEach(id => { const j = jobOf(id); j.log.unshift({ d: j.invoice.d, w: "office", k: "log.invoiced" }); });
jobOf("26-101").log.unshift({ d: ago(12), w: "office", k: "log.paid" });

// an office user can take a payment at any point (a deposit before the work); a crew can once the work has started
const canTakePayment = j => balance(j) > 0 && (isCrew() ? ["inprogress", "done", "invoiced"].includes(j.stage) : j.stage !== "paid");

function jobMoneyCard(j) {
  if (j.type === "warranty") return section(tt("job.money"), `<div class="small text-body-secondary">${tt("job.warrantyNoCharge")}</div>`);
  const cos = j.cos || [], pays = j.payments || [], office = !isCrew();
  const row = (label, amount, cls) => `<div class="d-flex justify-content-between gap-3 ${cls || ""}"><span>${label}</span><span class="text-nowrap">${amount}</span></div>`;
  const head = text => `<div class="small text-uppercase text-body-secondary fw-semibold mt-3 mb-1">${esc(text)}</div>`;
  let h = row(`${tt("job.price")} <span class="text-body-secondary">· ${tt("job.fromProposal")}</span>`, money(j.price));
  if (cos.length || office) {
    h += head(t("money.cos"));
    h += cos.map(c => `<div class="d-flex gap-3 align-items-start border-top py-1"><div class="flex-grow-1 hl-minw0"><span class="fw-semibold">${c.id}</span> · ${esc(c.text)}<br>` +
      badge(t("co." + c.status), c.status === "signed" ? "success" : "warning") +
      (c.status === "sent" && office ? ` <button type="button" class="btn btn-sm btn-link p-0 align-baseline" data-act="coSign" data-id="${j.id}" data-co="${c.id}">${tt("money.coMarkSigned")}</button>` : "") +
      `</div><div class="text-nowrap${c.status === "signed" ? "" : " text-body-secondary"}">${signedMoney(c.amount)}</div></div>`).join("");
    if (!cos.length) h += `<div class="text-body-secondary">${tt("none")}</div>`;
    if (office && j.stage !== "paid") h += `<button type="button" class="btn btn-outline-secondary btn-sm mt-2" data-act="coAdd" data-id="${j.id}">${ic("plus")} ${tt("money.coAdd")}</button>`;
  }
  h += row(tt("total"), money(jobTotal(j)), "fw-bold border-top mt-3 pt-2");
  if (cos.some(c => c.status === "sent")) h += `<div class="text-body-secondary">${tt("money.coNote")}</div>`;
  if (pays.length) h += head(t("money.payments")) + pays.map(x => row(`${esc(payLabel(x))} <span class="text-body-secondary">· ${esc(whoName(x.w))}</span>`, "−" + money(x.amount))).join("");
  h += row(tt("money.balance"), money(balance(j)), "fw-bold fs-5 border-top mt-3 pt-2" + (balance(j) > 0 ? "" : " text-success"));
  const btns = (canTakePayment(j) ? `<button type="button" class="btn btn-primary btn-sm" data-act="payAdd" data-id="${j.id}">${ic("dollar")} ${tt("money.record")}</button>` : "") +
    (j.invoice ? `<button type="button" class="btn btn-outline-secondary btn-sm" data-act="jobInvoice" data-id="${j.id}">${ic("doc")} ${tt("job.viewInvoice")}</button>` : "");
  return section(tt("job.money"), `<div class="small">${h}</div>` + (btns ? `<div class="d-flex flex-wrap gap-2 mt-3">${btns}</div>` : ""));
}

/* ---------- change orders: work added or removed after signing ---------- */
ACT.coAdd = d => openModal(modalShell(tt("money.coAdd"),
  `<p class="small text-body-secondary">${tt("money.coExplain")}</p>` +
  field(t("money.coWhat"), `<textarea class="form-control" id="coText" rows="2"></textarea>`) +
  field(t("money.coAmount"), `<div class="input-group"><span class="input-group-text">$</span><input class="form-control" id="coAmt" inputmode="decimal"></div><div class="form-text">${tt("money.coMinus")}</div>`),
  cancelBtn() + `<button type="button" class="btn btn-primary" data-act="coSave" data-id="${d.id}">${ic("mail")} ${tt("money.coSend")}</button>`));
ACT.coSave = d => {
  const j = jobOf(d.id), text = val("coText"), amount = parseFloat(val("coAmt").replace(/[^0-9.\-]/g, ""));
  if (!text) { $("#coText").classList.add("is-invalid"); return; }
  if (isNaN(amount)) { $("#coAmt").classList.add("is-invalid"); return; }
  j.cos = j.cos || [];
  const c = { id: "CO" + (j.cos.length + 1), text, amount, status: "sent", d: new Date() };
  j.cos.push(c); addLog(j, "log.coSent", { id: c.id });
  closeModal(); toast(t("money.coSentToast")); render();
};
ACT.coSign = d => { const j = jobOf(d.id), c = j.cos.find(x => x.id === d.co); c.status = "signed"; addLog(j, "log.coSigned", { id: c.id }); toast(t("log.coSigned", { id: c.id })); render(); };

/* ---------- payments ---------- */
ACT.payAdd = d => {
  const j = jobOf(d.id);
  openModal(modalShell(tt("money.record"),
    `<p class="small text-body-secondary">#${j.id} · ${esc(acct(j.acct).name)} · ${tt("money.balance")}: <span class="fw-semibold">${money(balance(j))}</span></p>` +
    `<div class="row g-2"><div class="col-6">${field(t("money.amount"), `<div class="input-group"><span class="input-group-text">$</span><input class="form-control" id="payAmt" inputmode="decimal" value="${balance(j)}"></div>`)}</div>` +
    `<div class="col-6">${field(t("money.method"), `<select class="form-select" id="payHow">${["check", "cash", "card", "other"].map(k => `<option value="${k}">${tt("method." + k)}</option>`).join("")}</select>`)}</div></div>` +
    field(t("money.checkNo"), `<input class="form-control" id="payNum" inputmode="numeric" autocomplete="off">`) +
    `<div class="form-text">${tt("money.recordedBy", { who: whoName(me()) })}</div>`,
    cancelBtn() + `<button type="button" class="btn btn-primary" data-act="paySave" data-id="${j.id}">${ic("check")} ${tt("money.record")}</button>`));
};
ACT.paySave = d => {
  const j = jobOf(d.id), amount = parseFloat(val("payAmt").replace(/[^0-9.]/g, ""));
  if (!(amount > 0)) { $("#payAmt").classList.add("is-invalid"); return; }
  j.payments = j.payments || [];
  j.payments.push({ d: new Date(), amount, method: val("payHow"), num: val("payNum"), kind: ["signed", "scheduled"].includes(j.stage) ? "deposit" : "payment", w: me() });
  addLog(j, "log.payment", { amount: money(amount) });
  if (balance(j) <= 0 && ["done", "invoiced"].includes(j.stage)) { j.stage = "paid"; addLog(j, "log.paid"); }
  closeModal(); toast(t("money.recorded")); render();
};

        `<td>${tt("unit." + i.unit)}</td><td class="text-end">${money(i.cost)}</td><td class="text-end">${money(i.price)}</td><td class="text-end pe-3 text-nowrap">${esc(fmtDate(i.changed))}</td></tr>`).join("") +
      `</tbody></table></div></div>` +

function priceDiff(key) {
  const f = INCOMING[key], added = [], changed = [], same = [];
  f.rows.forEach(r => { const it = PRICE.find(x => x.code === r.code);
    if (!it) added.push(r); else if (it.cost !== r.cost || it.price !== r.price) changed.push({ it, r, p: pct(it.cost, r.cost) }); else same.push(r); });
  const missing = PRICE.filter(i => i.supplier === f.supplier && i.line === f.line && !f.rows.some(r => r.code === i.code));
  return { f, added, changed, same, missing };
}
// Upload, step 2: review what would change before anything is saved
ACT.priceCheck = () => {
  const key = document.querySelector('input[name="pfile"]:checked').value, x = priceDiff(key);

      `<td class="text-end text-nowrap">${pctText(c.p)}${Math.abs(c.p) > 10 ? " " + badge(t("price.big"), "danger") : ""}</td></tr>`).join("") + `</tbody></table>` : "") +
    (x.added.length ? `<h3 class="h6">${tt("price.newItems")}</h3><table class="table table-sm small"><tbody>` + x.added.map(r =>
      `<tr><td>${esc(r.name)}</td><td class="text-end text-nowrap">${money(r.cost)} / ${money(r.price)}</td></tr>`).join("") + `</tbody></table>` : "") +
    `<div class="small text-body-secondary">${tt("price.unchanged", { n: x.same.length })} · ${tt("price.notInFile", { n: x.missing.length })}</div>`,
    cancelBtn() + (nothing ? "" : `<button type="button" class="btn btn-primary" data-act="priceConfirm" data-key="${key}">${ic("check")} ${tt("price.confirm")}</button>`)));
};
ACT.priceConfirm = d => {
  const x = priceDiff(d.key), id = "U-0" + (parseInt(UPLOADS[0].id.slice(2), 10) + 1), now = new Date();
  x.changed.forEach(c => { c.it.hist.push({ d: now, cost: c.r.cost, price: c.r.price, up: id }); syncItem(c.it); });
  x.added.forEach(r => PRICE.push(syncItem({ code: r.code, name: r.name, unit: r.unit, supplier: x.f.supplier, line: x.f.line, addedBy: id, hist: [{ d: now, cost: r.cost, price: r.price, up: id }] })));
  UPLOADS.unshift({ id, file: x.f.file, supplier: x.f.supplier, d: now, w: me(), added: x.added.length, changed: x.changed.length, same: x.same.length, live: true });
  closeModal(); toast(t("price.done", { n: x.added.length + x.changed.length })); render();
};
// Made a mistake? Rolling back removes that upload's prices. The list still shows that it happened.
ACT.priceRollback = d => {
  const u = UPLOADS.find(x => x.id === d.id);
  for (let i = PRICE.length - 1; i >= 0; i--) {

    if (it.addedBy === u.id) { PRICE.splice(i, 1); continue; }

};

/* ---------- the week ---------- */
function schedItem(s, day) {
  const r = s.rec, name = acct(r.acct).name, base = "d-block text-decoration-none text-reset small rounded-end border-start border-3 p-1 ";
  if (s.kind === "insp") return `<a href="#opp/${r.id}" class="${base}border-info bg-info-subtle"><span class="fw-semibold">${fmtTime(s.time)}</span> · ${tt("stage.inspection")}<br>${esc(name)}</a>`;
  const tone = CREW_TONE[r.crew] || "secondary", i = r.days.findIndex(x => sameDay(x, day)) + 1;
  return `<a href="#job/${r.id}" class="${base}border-${tone} bg-${tone}-subtle"><span class="fw-semibold">${esc(crewName(crewOf(r.crew)))}</span> · ` +
    (r.days.length > 1 ? tt("sched.dayOf", { i, n: r.days.length }) : fmtTime(r.time)) + `<br>${esc(name)} · ${tt("type." + r.type)}` +
    (r.changed && !r.changed.seen ? `<br>${badge(t("sched.changed"), "warning")}` : "") + `</a>`;
}
function schedDay(d) {
  const f = S.f.sched;
  const items = stopsOn(d).filter(s => f === "all" || (f === "insp" ? s.kind === "insp" : s.kind === "job" && s.rec.crew === f));
  return `<div class="col"><div class="card h-100${sameDay(d, TODAY) ? " border-primary" : ""}">` +
    `<div class="card-header d-flex justify-content-between py-1 px-2 small"><span class="fw-semibold text-uppercase">${esc(d.toLocaleDateString(loc(), { weekday: "short" }))}</span><span>${esc(d.toLocaleDateString(loc(), { month: "short", day: "numeric" }))}</span></div>` +
    `<div class="card-body d-flex flex-column gap-1 p-2">${items.length ? items.map(s => schedItem(s, d)).join("") : `<div class="small text-body-secondary">—</div>`}</div></div></div>`;
}

/* ---------- suggested times ---------- */
// Inspection: any hour from 9 am to 4 pm, one hour long. Days are ranked by how close the
// visit is to that day's other stops, then by soonest.
function inspSuggestions(o) {
  const place = placeOf(o), out = [];
  for (let k = 1; k <= 6; k++) {
    const day = wd(k), others = stopsOn(day).filter(s => s.rec !== o);
    let near = null;
    others.forEach(s => { const m = miles(place, placeOf(s.rec)); if (!near || m < near.m) near = { m, s }; });
    const nearHour = near && near.s.kind === "insp" ? parseInt(near.s.time, 10) : 9;
    for (let h = 9; h <= 16; h++) {
      if (others.some(s => s.kind === "insp" && Math.abs(parseInt(s.time, 10) - h) < 1)) continue;      // that hour is taken
      out.push({ day, time: String(h).padStart(2, "0") + ":00", near, score: near ? near.m : 40, gap: Math.abs(h - nearHour) });
    }
  }
  out.sort((a, b) => a.score - b.score || a.day - b.day || a.gap - b.gap || a.time.localeCompare(b.time));
  const seen = new Set(), top = [];                                  // the best time on each day; four days
  for (const r of out) { if (seen.has(iso(r.day))) continue; seen.add(iso(r.day)); top.push(r); if (top.length === 4) break; }
  return top;
}
// Job: the next days when the crew is free for the whole job. Whole days only.
function jobSuggestions(j, crewId) {
  const n = DAYS_BY_TYPE[j.type] || 1, out = [];
  for (let k = 1; k <= 15 && out.length < 4; k++) {
    const days = Array.from({ length: n }, (_, i) => wd(k + i));
    if (days.some(d => crewBusy(crewId, d, j.id))) continue;
    const prev = JOBS.find(x => x.crew === crewId && x.id !== j.id && x.days.some(d => sameDay(d, wd(k - 1))));
    out.push({ days, prev, m: prev ? miles(placeOf(j), placeOf(prev)) : null });
  }
  return out;
}
// small map: the new visit (green) and that day's other stops
function miniMap(place, day, label) {
  const pts = stopsOn(day).map(s => ({ p: placeOf(s.rec), label: acct(s.rec.acct).name.split(" ")[0] + " " + fmtTime(s.time) }));
  const all = [...pts.map(x => x.p), place], lats = all.map(p => p.lat), lngs = all.map(p => p.lng), pad = 0.03;
  const minLat = Math.min(...lats) - pad, maxLat = Math.max(...lats) + pad, minLng = Math.min(...lngs) - pad, maxLng = Math.max(...lngs) + pad;
  const W = 320, H = 150, X = l => ((l - minLng) / (maxLng - minLng || 1)) * (W - 90) + 15, Y = l => H - (((l - minLat) / (maxLat - minLat || 1)) * (H - 30) + 15);
  return `<svg class="w-100 border rounded bg-body-tertiary mt-3" viewBox="0 0 ${W} ${H}" role="img" aria-label="${tt("sched.map")}">` +
    pts.map(x => `<line x1="${X(place.lng)}" y1="${Y(place.lat)}" x2="${X(x.p.lng)}" y2="${Y(x.p.lat)}" stroke="var(--bs-secondary)" stroke-width="1.5" stroke-dasharray="4 4"/>`).join("") +
    pts.map(x => `<circle cx="${X(x.p.lng)}" cy="${Y(x.p.lat)}" r="6" fill="var(--bs-primary)"/><text x="${X(x.p.lng) + 9}" y="${Y(x.p.lat) + 4}" font-size="10" fill="var(--bs-body-color)">${esc(x.label)}</text>`).join("") +
    `<circle cx="${X(place.lng)}" cy="${Y(place.lat)}" r="7" fill="var(--bs-success)" stroke="var(--bs-body-bg)" stroke-width="2"/><text x="${X(place.lng) + 10}" y="${Y(place.lat) + 4}" font-size="10" font-weight="700" fill="var(--bs-success)">${esc(label)}</text></svg>`;
}

// everything waiting to be booked
const toBook = () => [

];
function bookCard() {

  if (!list.length) return section(tt("sched.book"), `<div class="small text-body-secondary">${tt("sched.nothingToBook")}</div>`);
  const cur = list.find(x => x.key === S.book) || list[0], r = cur.rec, a = acct(r.acct), place = placeOf(r);
  const opt = x => `<option value="${x.key}"${x === cur ? " selected" : ""}>${esc(acct(x.rec.acct).name)} — ${tt("type." + x.rec.type)} · ${esc(placeOf(x.rec).addr)}</option>`;
  const grp = (kind, label) => { const g = list.filter(x => x.kind === kind); return g.length ? `<optgroup label="${esc(label)}">${g.map(opt).join("")}</optgroup>` : ""; };
  let body = field(t("sched.pick"), `<select class="form-select" data-change="bookPick" id="bookPick">${grp("opp", t("sched.inspGroup"))}${grp("job", t("sched.jobGroup"))}</select>`);
  const item = (best, when, note, btn) => `<div class="list-group-item d-flex align-items-center gap-3${best ? " list-group-item-success" : ""}"><div class="fw-bold text-nowrap">${when}</div>` +
    `<div class="flex-grow-1 small hl-minw0">${note}${best ? `<br>${badge(t("sched.best"), "success")}` : ""}</div>${btn}</div>`;
  if (cur.kind === "opp") {
    const sug = inspSuggestions(r);
    body += `<div class="fw-semibold mb-2">${tt("sched.suggestions")}</div><div class="list-group">` + sug.map((s, i) => item(i === 0,
      `${esc(fmtDay(s.day))}<div class="small fw-normal text-body-secondary">${fmtTime(s.time)}</div>`,
      s.near ? tt("sched.near", { m: s.near.m.toFixed(1), name: acct(s.near.s.rec.acct).name, time: fmtTime(s.near.s.time) }) : tt("sched.noNear"),
      `<button type="button" class="btn btn-sm ${i === 0 ? "btn-primary" : "btn-outline-secondary"}" data-act="bookInsp" data-id="${r.id}" data-day="${iso(s.day)}" data-time="${s.time}">${tt("sched.bookBtn")}</button>`)).join("") + `</div>` +
      `<div class="form-text">${tt("sched.inspHint")}</div>` + (sug[0] ? `<div class="row"><div class="col-md-7 col-lg-6">${miniMap(place, sug[0].day, a.name.split(" ")[0])}</div></div>` : "");
  } else {
    const crewId = S.bookCrew, sug = jobSuggestions(r, crewId);
    body += field(t("crew"), `<select class="form-select" data-change="bookCrew">${CREWS.map(c => `<option value="${c.id}"${c.id === crewId ? " selected" : ""}>${esc(crewName(c))} · ${esc(c.lead)}</option>`).join("")}</select>`) +
      `<div class="fw-semibold mb-2">${tt("sched.suggestions")}</div><div class="list-group">` + sug.map((s, i) => item(i === 0,
        esc(s.days.length > 1 ? fmtDay(s.days[0]) + " – " + fmtDay(s.days[s.days.length - 1]) : fmtDay(s.days[0])),
        tt("sched.crewFree", { crew: crewName(crewOf(crewId)), n: s.days.length }) + "<br>" + (s.prev ? tt("sched.dayBefore", { name: acct(s.prev.acct).name, m: s.m.toFixed(1) }) : tt("sched.noDayBefore")),
        `<button type="button" class="btn btn-sm ${i === 0 ? "btn-primary" : "btn-outline-secondary"}" data-act="bookJob" data-id="${r.id}" data-crew="${crewId}" data-day="${iso(s.days[0])}" data-n="${s.days.length}">${tt("sched.bookBtn")}</button>`)).join("") + `</div>` +
      `<div class="form-text">${tt("job.scheduleHint")}</div>`;
  }
  return section(tt("sched.book"), body);
}

  const free = HELPERS.filter(h => !j.workers.includes(h));
  return `<div class="d-flex flex-wrap align-items-center gap-1">` + j.workers.map(w =>
      `<span class="badge text-bg-secondary fw-normal d-inline-flex align-items-center gap-1">${esc(w)}<button type="button" class="btn-close btn-close-white" style="font-size:.55em" data-act="workerDel" data-id="${j.id}" data-w="${esc(w)}" aria-label="${tt("sched.removeWorker")}"></button></span>`).join("") +
    (free.length ? `<select class="form-select form-select-sm w-auto" data-change="workerAdd" data-id="${j.id}" aria-label="${tt("sched.addWorker")}"><option value="">+ ${tt("sched.addWorker")}</option>${free.map(h => `<option>${esc(h)}</option>`).join("")}</select>` : "") + `</div>`;
}
ACT.workerAdd = (d, el) => { if (!el.value) return; const j = jobOf(d.id); j.workers.push(el.value); addLog(j, "log.workerAdded", { name: el.value }); render(); };
ACT.workerDel = d => { const j = jobOf(d.id); j.workers = j.workers.filter(w => w !== d.w); addLog(j, "log.workerRemoved", { name: d.w }); render(); };

/* =====================================================================
   CREW APP. A crew signs in with its one shared login and sees only the
   jobs scheduled to that crew: My Day, My Jobs and Search.
   ===================================================================== */

// one of today's stops, with everything needed on site
function dayCard(s) {
  const j = s.rec, a = acct(j.acct), p = placeOf(j), site = p.site, crew = crewOf(j.crew);
  const i = j.days.findIndex(x => sameDay(x, TODAY)) + 1;
  const big = (act, icon, label, extra) => `<button type="button" class="btn btn-primary btn-sm" data-act="${act}" data-id="${j.id}" ${extra || ""}>${ic(icon)} ${esc(label)}</button>`;
  const next = (j.stage === "scheduled" ? big("jobStage", "check", t("job.start"), 'data-to="inprogress"') : j.stage === "inprogress" ? big("jobStage", "check", t("job.markDone"), 'data-to="done"') : "") +
    (j.type !== "warranty" && canTakePayment(j) ? `<button type="button" class="btn btn-outline-primary btn-sm" data-act="payAdd" data-id="${j.id}">${ic("dollar")} ${tt("money.record")}</button>` : "");
  return `<div class="card shadow-sm mb-3"><div class="card-body">` +
    `<div class="d-flex align-items-center gap-2 mb-1"><span class="fw-bold">${fmtTime(s.time)}</span>${j.days.length > 1 ? `<span class="small text-body-secondary">${tt("sched.dayOf", { i, n: j.days.length })}</span>` : ""}<span class="ms-auto">${jobBadge(j)}</span></div>` +
    `<a class="h5 d-block text-decoration-none mb-0" href="#job/${j.id}">${esc(a.name)}</a>` +
    `<div class="small text-body-secondary">${esc(addrLine(p))}</div><div class="small mb-2">#${j.id} · ${tt("type." + j.type)}${jobTags(j)}</div>` + changedBox(j) +
    `<div class="small mb-1">${ic("accounts")} ${esc([...crew.members, ...j.workers].join(", "))}</div>` +
    (j.type !== "warranty" && balance(j) > 0 ? `<div class="small mb-1">${ic("dollar")} ${tt("money.balance")}: <span class="fw-semibold">${money(balance(j))}</span></div>` : "") +
    `<div class="mt-2">` + contactBtns({ phone: site ? site.phone : a.contacts[0].phone, first: site ? site.name.split(" ")[0] : firstName(a), lang: a.lang, place: p, kind: "job", id: j.id, sm: true, extra: next }) + `</div></div></div>`;
}

route("myday", {
  roles: ["crew"], icon: "myday",
  render() {
    const crew = crewOf(S.crew), stops = stopsOn(TODAY, S.crew), nextDay = wd(1), next = stopsOn(nextDay, S.crew);
    const changes = myJobs().filter(j => j.changed && !j.changed.seen && !j.days.some(d => sameDay(d, TODAY)));
    return `<div class="text-body-secondary small">${esc(fmtDay(TODAY))}</div>` + pageHead(tt("nav.myday"), esc(crewName(crew) + " · " + crew.lead)) +
      (changes.length ? `<h2 class="h6 mb-2">${tt("myday.changes")}</h2>` + changes.map(j =>
        `<div class="card shadow-sm mb-3"><div class="card-body py-2"><a class="fw-semibold text-decoration-none d-block mb-2" href="#job/${j.id}">#${j.id} · ${esc(acct(j.acct).name)} · ${esc(jobDates(j))}</a>${changedBox(j)}</div></div>`).join("") : "") +
      (stops.length ? stops.map(dayCard).join("") : `<div class="card shadow-sm mb-3"><div class="card-body">${empty(t("today.nothing"))}</div></div>`) +
      `<h2 class="h6 mt-4 mb-2">${tt("myday.next")} · ${esc(fmtDay(nextDay))}</h2>` +
      (next.length ? listBox(next.map(s => jobRow(s.rec)).join("")) : `<div class="small text-body-secondary mb-3">${tt("none")}</div>`) +
      `<button type="button" class="btn btn-link btn-sm p-0" data-act="calFeed">${ic("schedule")} ${tt("sched.feed")}</button>`;
  }
});

route("myjobs", {
  roles: ["crew"], icon: "myjobs",
  render() {
    const jobs = myJobs().slice().sort((a, b) => (a.days[0] || 0) - (b.days[0] || 0));
    const isToday = j => j.days.some(d => sameDay(d, TODAY));
    const groups = [
      ["mine.today", jobs.filter(j => isToday(j) && !jobDone(j))],
      ["mine.upcoming", jobs.filter(j => !isToday(j) && !jobDone(j))],
      ["mine.finished", jobs.filter(jobDone).reverse()]
    ];
    const crew = crewOf(S.crew);
    return pageHead(tt("nav.myjobs"), esc(crewName(crew) + " · " + crew.members.join(", "))) +
      groups.map(([key, list]) => `<h2 class="h6 mt-3 mb-2">${tt(key)} <span class="text-body-secondary fw-normal">${list.length}</span></h2>` +
        (list.length ? listBox(list.map(jobRow).join("")) : `<div class="small text-body-secondary mb-3">${tt("none")}</div>`)).join("");
  }
});

/* ---------- start: show the first screen ---------- */
render();
</script>
</body>
